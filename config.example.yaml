# 杖劍傳說助手 —— 設定檔
#
# 每個區段都可以整段刪掉，刪掉就用預設值，所以只需要留你真的要改的部分。
# 唯一一定要設定的是下面的「連哪一台模擬器」。

device:
  # 【方式一】同一台電腦執行 —— 用這個就好
  #   auto    自動選第一台連線中的裝置
  #   留空    改用下面的 host / port
  # 多開時要指定特定一台，就填該台的 adb 序號（用 `devices` 指令查，
  # 格式類似 emulator-XXXX）。
  serial: auto

  # 【方式二】模擬器在別台電腦 —— 只能用這種
  # 使用時把上面的 serial 清空，再填這兩項：
  #   host  模擬器所在電腦的 IP
  #   port  模擬器的 ADB 連接埠（在模擬器的設定裡查，或用介面上的「探索」）
  #         這個埠號每台機器、每個模擬器實例都不同，一定要自己查
  #         找不到就用圖形介面的「探索」，或命令列的 devices
  host: 127.0.0.1
  port: 0

# 要執行哪些腳本。
#
# 每個腳本各自開關、各自排時間，所以可以同時啟用——程式每跑完一輪，
# 就在啟用的腳本裡找「最近的下一個排定時刻」，睡到那時候再跑對應的腳本。
#
# 啟動時會先跑清單裡第一個啟用的腳本，不必等到排定時刻（不然半夜開就得
# 乾等到早上）。這樣做是安全的：每份腳本都判斷得出「今天做完了」，
# 就算今天已經跑過，重跑也只是很快確認一下就結束。
#
# 清單順序＝圖形介面上的顯示順序，照每天實際發生的時間排最好讀。
#
#   daily_at   可以給一個時間，也可以給一串。留空 [] 表示不排程
#   weekly_at  每週固定某天，寫成「週一 08:00」。和 daily_at 可以並用
#   repeat     完成幾次就停，0 表示不限（打到腳本自己的收工條件）
tasks:
  # 自動副本：走到日常副本、配對、打完、只在 S 級領獎，次數用盡就收工
  - name: dungeon
    enabled: true
    daily_at: "08:00"          # 副本次數每天早上 08:00 重置
    repeat: 0

  # 自動公會討伐：領討伐獎勵、推進樓層、進旁觀房間等人夠多才入場
  # 自動每日活動：聖獸試煉打一場領獎，雙影幻境刷到滿波（12 波）
  #
  # 這兩個活動都不消耗每日次數，只記當日最佳成績，所以排在哪裡都不會有損失。
  # 09:30 是副本與公會討伐之間的閒置時段，連打 3 場也不會撞到下一個排程。
  - name: daily
    enabled: true
    daily_at: "09:30"
    repeat: 3                      # 雙影幻境最多打幾場（推到 12 波就提早收工）

  - name: raid
    enabled: true
    daily_at: ["12:30", "21:00"]   # 公會固定中午與晚上各一場
    repeat: 1                      # 一輪就是打一場
    # 兩格都過了才開程式的話（例如 21:33 才想起來）會補跑一場。次數不會留到
    # 隔天，不打就是浪費；而今天只要還有下一格，補跑就不會發生，晚上那次仍然
    # 留著。

  # 自動競技場：每天把累積的券用掉（挑排名最好的對手 → 打排位），
  # 每週一還會順便按下「開啟挑戰」開新一期並領走上一期的排名獎勵。
  #
  # 券每 5 小時回一張、上限 20 張，所以每天跑一次就用得完，不會滿出來。
  # 週一那格留著：之後若把每日改到晚上，開賽仍有早上這格保底（早按排名較前面）。
  - name: arena
    enabled: true
    daily_at: "08:00"              # 接在自動副本後面跑，約一分鐘
    weekly_at: "週一 08:00"        # 新一期在週一開始
    repeat: 1

  # 自動日常雜務：每天要做、但各自只有幾步的小事，合成一趟走完。
  # 目前是命運果實、羈絆冒險、公會捐獻三段，各自有開關。
  #
  # 排兩個時刻是為了羈絆冒險：委派要幾個小時才回來（實測 4 小時，最長 6 小時，
  # 依獎勵等級而定），只排一次的話早上派出去的要等到隔天早上才領得到。
  # 間隔抓 6 小時以上，不論那個節點多久都會在下一格被撈到。
  # ⚠ 刻意不去記「幾點派的、幾小時後回來」——每個節點的時長不一樣，而時長只在
  #   派出去之前看得到。多看幾次比算準一次可靠，而這一趟不到兩分鐘，
  #   沒有可領的節點就什麼都不做。
  - name: chores
    enabled: true
    daily_at: ["09:00", "15:30"]   # 09:00 夾在每日活動（09:30）之前
    repeat: 1

# 腳本開關，所有腳本共用。規則用 when_option 綁定這些開關，
# 同一份腳本就能適應不同玩法。用不到的開關留著不影響。
options:
  # ---- 自動副本 ----

  # true  評級 S 就領獎（正常玩法）
  # false 一律不領獎，打完直接退出。不消耗領獎次數，可一直打賺友情點數
  claim_reward: true

  # true  領獎次數用完、又買不到次數時就收工
  # false 次數用完仍繼續打（配合 claim_reward: false 用來刷友情點數）
  stop_when_no_count: true

  # 領獎次數用完時，自動用晨星購買幾次（1 或 2；遊戲每日限購 2 次）。
  # 設 2 會在購買彈窗上先把數量加到上限再確認，一次買滿。
  buy_counts: 1

  # 新副本開放的前一天，把領獎次數囤到隔天再用。
  # 沒用掉的次數會留到隔天（實測前一天買滿，隔天有 4 場、打完還能再買 2 場），
  # 而新副本的最高難度獎勵比舊副本好。開啟後那一天會：不領獎（S 也不領）、
  # 用晨星把次數買滿、只打一場就收工。
  # ⚠ 會花晨星，所以預設關閉；要用的話這裡一定要明確寫 true。
  stock_up_before_new_dungeon: false

  # true  配對湊了 NPC 夥伴也照樣接受（半夜幾乎湊不到全真人，設 false 會整晚打不到）
  # false 有夥伴就拒絕，等真人隊伍。遊戲明確說拒絕不算「故意取消配對」，不會被鎖
  accept_with_partners: true

  # 進入戰鬥後自動開啟遊戲內的「自動模式」（含自動準備、自動治療）
  auto_battle_mode: true

  # 結算頁順手幫隊友按讚
  like_teammates: true

  # ---- 自動日常雜務 ----

  # 這三段各自獨立開關，關掉的那一段整個不會走進去。
  # 順序固定是 命運果實 → 羈絆冒險 → 公會捐獻。

  # 命運果實：地圖探索頁的卡片亮出「可領取」就點掉，不必進到果實頁面
  chores_fruit: true

  # 羈絆冒險：地圖上有 ❗ 的節點就進去領獎或派人（快速選擇後直接委派）
  chores_bond: true

  # 公會捐獻：走到公會大廳 → 公會捐贈，把每日 5 次捐完
  chores_donate: true

  # 公會捐獻的第一次是免費的
  guild_donate_free: true

  # 免費那次之後改用晨星繼續捐。價格逐次遞增。
  # ⚠ 晨星也是競技場買券、副本買次數在用的貨幣。不想花就設成 false，
  #   免費那一次仍然照捐。
  guild_donate_stars: true

  # 免費那次之後最多再花晨星捐幾次。每天總共 5 次，所以 4 就是捐滿。
  # ⚠ 這個上限**跨執行保留**（記在程式旁邊的 state.json），補跑或手動再跑一次
  #   都不會重新計數，換一天自動歸零。
  guild_donate_star_times: 4

  # ---- 自動公會討伐 ----

  # 討伐獎勵亮著（金框加紅點）就先領走，再往下一關
  claim_raid_reward: true

  # true  等場上有人開打了才入場，太早進去會被踢出場。
  #       等超過 7 分鐘還是沒人，就自己先進去觸發一場
  # false 一到可挑戰的層就直接入場，不等人
  wait_for_others: true

  # 以下五項只在 wait_for_others = true 時有作用。
  #
  # 「人數」填的是實際玩家數，程式會換算成順序條上的單位數。
  # ⚠ 那是估計值，誤差約 ±2～3 人，所以門檻不必填得太精確。
  #
  # 為什麼值得等人：同樣消耗一次次數，人多的場次撐得久、打得出來的傷害多好幾倍，
  # 單人開場則一分鐘就結束。

  # 房間裡估到這麼多人在打，就加入戰鬥
  raid_join_players: 10

  # 等不到上面那個人數時的保底：進房間等這麼多分鐘就跟著打，不要空等到收工
  raid_join_wait_minutes: 5

  # 人數上到平台期（不再增加）就入場，接住「今天湊不到 10 人」的日子。
  # 人數還在往上衝時不會成立，那時仍在等上面那個主門檻。
  raid_plateau_players: 6.5
  raid_plateau_sustain: 120        # 秒。要「不再增加」多久才算平台期

  # 討伐頁完全沒人挑戰時，等這麼多分鐘就自己先進場觸發一場。
  # 從進到討伐頁那一刻起算（不是絕對時刻），所以中午與晚上兩場共用這個值
  raid_page_wait_minutes: 7

  # 進了房間卻連一場戰鬥實例都沒有（按鈕是「開始戰鬥」），等這麼久才自己開。
  # 單人開場效益極差，所以這是最後手段
  raid_solo_after_minutes: 15

  # 安全網：在討伐頁折騰超過這麼久就收工並存一張截圖。
  # ⚠ 一定要大於 raid_page_wait_minutes，否則等人還沒等完就先收工
  raid_page_giveup_minutes: 15

  # ---- 自動每日活動 ----

  # 打完後把獎勵條上亮起來的獎勵領走（聖獸試煉、雙影幻境共用這個開關）。
  # 關掉的話只刷成績不領獎——獎勵留在那裡，當天之內隨時可以手動領
  claim_daily_reward: true

  # ---- 自動競技場 ----

  # 把累積的競技場券用掉：挑排名最好的對手。戰力遠高時按「碾壓」直接判贏，
  # 戰力相近時按「挑戰」，進戰鬥後用快進鍵跳到結果。關掉的話這份腳本就只在
  # 週一按下「開啟挑戰」。
  crush_arena: true

  # 挑第幾個對手（畫面上四個橫排，由左到右）。左邊三個排名在你前面，打贏才會
  # 往上爬；第四個排名在你後面、必定是碾壓，打贏不加排名只拿積分與競技幣。
  #   1  最強的——爬得最快，但戰力不如對方時會輸掉、白花一張券
  #   2 / 3  弱一點但仍在你前面，勝率高、每場爬得少
  #   4  必定碾壓，不會輸也不會爬
  # ⚠ 排名不等於戰力，排名靠前的不一定比較難打，所以沒有「最佳解」可以自動選。
  arena_opponent: 1

  # 每天最多打幾場。券每 5 小時回一張、上限 20 張，所以填 20 等於「有券就打完」。
  # 想留一些券自己手動打（或想少花點時間）就調小。
  #
  # ⚠ 這是「開打的場次」，不是「贏幾場」——輸掉那場也算一次。
  # ⚠ 這個上限**跨執行保留**：今天已經打掉的場次記在程式旁邊的 state.json，
  #   所以補跑或手動再按一次都不會重新計數。換一天自動歸零。
  arena_max_battles: 20

  # 打輸了要不要換一個對手再試。開著的話：第一順位輸了就改挑排名低一階的，
  # 再輸就再低一階，第三場還輸就收工，剩下的券留到下次（每 5 小時回一張，
  # 不打也不會滿出來）。贏了就回到第一順位——贏一場清單會換人。
  # 關掉的話永遠只挑 arena_opponent 那一格，輸了也照打。
  arena_retry_on_loss: true

  # 退格時要挑第幾個。預設 2、3 就是「往右一格、再往右一格」，
  # 只有把 arena_opponent 改成 1 以外的值時才需要跟著調。
  arena_opponent_2: 2
  arena_opponent_3: 3

  # 券用完時自動用晨星補買（10 晨星一張、遊戲每日限購 8 張）。
  # ⚠ 預設關閉，而且**一定要明確寫成 true 才會生效**——這是唯一會花掉資源的
  #   開關，不該因為舊設定檔缺這個鍵就被當成開啟。
  buy_arena_tickets: false

# ── 以下都有合理預設值，通常不用改，整段刪掉也可以 ──

ui:
  # 視窗外觀。只影響長相，不影響任何腳本行為。
  # 這兩項在介面右上角就能改，改了會自動寫回這裡。
  #
  # 配色。system 跟隨 Windows 的深淺色設定；也可以直接指定一套：
  #   dark 午夜藍　forest 松綠　plum 暗紫　carbon 純黑
  #   light 雲白　 warm 暖米
  theme: system

runtime:
  # 主迴圈每輪之間的間隔（秒）
  tick: 1.0
  # 模板比對預設門檻，0~1，越高越嚴格
  threshold: 0.85
  # 點擊後的固定等待（秒），避免動畫還沒結束就繼續判斷
  post_tap_delay: 0.6
  # 點擊座標隨機抖動範圍（像素），降低機械感
  tap_jitter: 4
  # 啟動時補跑「今天已經過了排定時刻、但還沒跑到」的腳本。
  #
  # 例如晚上八點才開程式：08:00 的副本與 09:30 的每日活動都已經過了，
  # 沒有這一項的話它們會被算到明天，今天就整個跳過。
  #
  # 補跑不會重複做事——腳本會自己進遊戲確認（次數用盡、獎勵已領就直接收工）。
  # 唯一要留意的是公會討伐：它每天兩次是**分開時段**的，補跑等於把晚上那次提前
  # 用掉。只想讓討伐照原本的時段跑，就把這項設成 false。
  catch_up: true

  # 下一個排定時刻在這麼多分鐘之內時，補跑要**讓路**——先把那一格跑完再補。
  #
  # 為什麼需要：補跑和排定時刻的價值不一樣。補跑只是「不要讓今天整個跳過」，
  # 晚一點做沒差；而排定時刻是你指定的**那一刻**——公會討伐 21:00 的價值就在
  # 那時候人最多，事後補等於白補。少了這一項，一長串補跑會直接輾過那一格。
  #
  # 設 0 就整個關掉（補跑照舊搶先）。
  catch_up_guard_minutes: 30

adb:
  # adb 已隨程式附帶（打包後在 EXE 裡），所以這項幾乎不用動。
  # 只有想改用系統或自訂的 adb 時才需要填絕對路徑。
  path: adb
  # 單次 adb 指令逾時（秒）。跨機器連線又很慢時可以調大
  timeout: 20
