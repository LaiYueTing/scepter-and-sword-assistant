<!doctype html>
<html lang="zh-Hant-TW" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <title>杖劍傳說助手</title>
    <!--
      ⚠ CSP 一定要寫。renderer 載入的是本機檔案，但 naive-ui 會注入 <style>，
        所以 style-src 要放行 'unsafe-inline'；script 則不放行任何 inline，
        全部走打包好的檔案。
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
