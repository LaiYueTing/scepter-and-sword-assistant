# 自動競技場
#
# 每天用掉累積的競技場券：進競技場、挑對手、打排位挑戰。每週一新一期開始時先按
# 「開啟挑戰」，同時領取上一期的排名獎勵（畫面上寫「開啟後自動領取排名獎勵」）。
#
# 流程：任何頁面 → 筆記 → 競技 → 競技場
#      →（週一）結算對話框按「開啟挑戰」
#      → 選對手 → 排位挑戰對話框按入場鍵，兩種情況：
#          「碾壓」（戰力遠高）→ 直接判定勝利，跳結果頁
#          「挑戰」（戰力相近）→ 載入 → 戰鬥地圖按「開始戰鬥」→ 按快進鍵跳到結果
#      → 結果頁點空白處 → 下一場
#      → 券用完時遊戲自動跳「購買競技場券」，按取消並結束本輪
#
# 畫面性質：
# 1. 打完一場，對手清單自動換成排名更前面的四個，不必翻頁也不必記錄打過誰。
#    排名往前之後對手變強，入場鍵會從「碾壓」變成「挑戰」，同一輪兩種都會遇到。
# 2. 左側 ▶| 快進鍵按下後兩秒內出結果，一場約 20 秒。
# 3. 券用完時遊戲自動跳購買對話框，不必讀「N/20」；⚔ 在沒券時外觀不變。
# 4. 「開啟挑戰」只在新一期開始時出現，不必判斷星期幾。
#
# 共通約束與共用規則的說明見 dungeon.yaml 檔頭。

name: 自動競技場
package: com.m88.idleXX

# 券最多 20 張、一場約 20 秒，全部打完約 7 分鐘。15 分鐘是安全網：規則互相觸發而
# 來回循環時，時間到就結束本輪，不擋住後面的排程。
max_minutes: 15

# 結束程序：退回家園待命。競技場頁沒有底部導覽列，要先退到競技頁。
on_finish:
  # ⚠ 每一步之前都要 wait_for，理由見 dungeon.yaml 的結束程序。
  - log: 本輪結束，返回家園待命
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: nav_home
  - wait: 2

rules:
  # ==================== 每週一：開新一期 ====================

  - name: 競技場結算對話框 → 開啟挑戰
    # 新一期開始時才有，按下去領取上一期的排名獎勵並開始新一期。
    # ⚠ 排在最前面：對話框蓋住整個畫面，底下的競技場頁不該先動作。
    template: btn_open_challenge
    do:
      - tap_template: btn_open_challenge
      - wait: 3

  # ==================== 排位挑戰：把券用完 ====================
  # 一場是「挑對手 → 入場 → 開始戰鬥 → 快進 → 關閉結果頁」，同一組規則循環到券用完。
  # ⚠ 越上層的畫面越優先：結果頁蓋在戰鬥上、戰鬥蓋在對話框上、對話框蓋在列表上。
  #
  # 結果頁分勝負兩條：勝利要把挑對手的接力歸零，失敗不歸零才會退一格。
  # ⚠ 兩種橫幅位置差 257px（勝利 y=205、失敗 y=462）；「點擊空白處關閉」兩頁都有
  #   （0.991／0.989），當作認不出勝負時的安全網。

  - name: 點空白處無法關閉的頁面 → 重新啟動遊戲
    # 共用規則，說明見 dungeon.yaml。⚠ 一定要排在所有點空白處的規則前面。
    template: label_tap_blank_close
    sustain: 90
    max_fires: 1
    do:
      - screenshot: blank_page_stuck
      - restart_app: 45

  - name: 重新啟動後仍無法關閉 → 結束本輪
    template: label_tap_blank_close
    sustain: 90
    do:
      - log: 點空白處無法關閉這張頁面，重新啟動遊戲後仍然存在，結束本輪
      - screenshot: blank_page_stuck_after_restart
      - finish: skip_cleanup

  - name: 挑戰勝利 → 點空白處關閉
    # 勝利 1.000、失敗頁 0.179。勝利後清單換人，挑對手的接力回到第一順位。
    template: label_arena_win
    cooldown: 3
    do:
      - reset_fires: [競技場頁 → 挑對手,
                      上一場輸了 → 改挑弱一點的對手,
                      又輸了 → 挑最後一個對手,
                      連續三場都落敗 → 結束本輪]
      - tap: [360, 640]
      - wait: 2.5

  - name: 設定為不換對手 → 關掉結果頁，下一場挑同一格
    # arena_retry_on_loss 關閉時：把第一順位歸零，下一場仍挑同一格。少了這條，
    # 第一順位的 max_fires 用完後沒有規則接手，整輪只打一場。
    # 勝利那條在前面，到這裡的一定是失敗或認不出勝負。
    template: label_tap_blank_close
    when_option: "!arena_retry_on_loss"
    cooldown: 3
    do:
      - reset_fires: [競技場頁 → 挑對手]
      - tap: [360, 640]
      - wait: 2.5

  - name: 挑戰失敗 → 點空白處關閉
    # 失敗 1.000、勝利頁 0.368。不歸零：挑對手的接力靠這個往後退一格。
    template: label_arena_lose
    cooldown: 3
    do:
      - tap: [360, 640]
      - wait: 2.5

  - name: 挑戰結果 → 點空白處關閉
    # 安全網：認不出勝負橫幅時照樣關閉頁面。勝負不明所以不歸零（寧可多退一格，
    # 不在打不贏的對手上重複花券）。紀錄會寫「（認不出）」。
    template: label_tap_blank_close
    cooldown: 3
    do:
      - log_match:
          結果: {of: {勝利: label_arena_win, 失敗: label_arena_lose}}
      - tap: [360, 640]
      - wait: 2.5

  - name: 競技場戰鬥準備 → 開始戰鬥
    # 進場後有 57 秒準備倒數，按下就開打。與公會討伐共用模板（1.000）。
    # ⚠ 必須排在快進鍵前面：準備畫面上兩者都是 1.000。
    template: btn_start_battle
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 競技場戰鬥中 → 按快進鍵跳到結果
    # ⚠ 錨點用快進鍵本身，不用回合條（回合條在競技場列表頁有 0.725，快進鍵 0.403）。
    #   戰鬥中 0.920～0.978，其餘畫面 ≤0.717。
    template: btn_battle_skip
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2.5

  - name: 週一開新一期 → 有券就打，不受每日場次上限
    # 新一期剛開始時排名越早往前越好，週一把券全部用完；其他天照 arena_max_battles。
    # ⚠ 要排在下一條前面，模板與動作要和它完全一樣，只是不掛 max_fires_daily
    #   （週一的場次不計入每日上限）。
    template: [btn_arena_crush, btn_arena_crush_b,
               btn_arena_challenge, btn_arena_challenge_b]
    region: [230, 860, 260, 80]
    when_option: [crush_arena, arena_monday_use_all=true]
    when_weekday: 週一
    cooldown: 3
    do:
      - tap_match: []
      - wait: 3

  - name: 排位挑戰對話框 → 按下入場鍵
    # 點對手卡片後跳出的對話框（對手戰力與防守技能），按入場鍵消耗一張券。
    # ⚠ 入場鍵有兩種文字：戰力遠高時「碾壓」（直接判定勝利），戰力相近時「挑戰」
    #   （要進戰鬥）。只掛一種的話另一種會停在對話框前。
    # ⚠ 每種文字各兩張模板：對話框剛出現與完全顯示時差一個像素（x 306 對 305），
    #   另一張只剩 0.821。四張各自 1.000，其餘畫面 ≤0.679。
    # ⚠ 模板只裁按鈕文字，不含會變的券數；region 框住按鈕（標題「排位挑戰」也有同樣的字）。
    # ⚠ 場次上限掛在這條：每一場恰好觸發一次，而且不會被 reset_fires 歸零。用
    #   max_fires_daily：今天打過幾場畫面上看不到，max_fires 每輪重置會讓重新執行時
    #   重新計數。
    template: [btn_arena_crush, btn_arena_crush_b,
               btn_arena_challenge, btn_arena_challenge_b]
    region: [230, 860, 260, 80]
    when_option: crush_arena
    cooldown: 3
    max_fires_daily: "${arena_max_battles:20}"
    do:
      - tap_match: []
      - wait: 3

  - name: 今日場次已達上限 → 關閉對話框並結束本輪
    # 上一條的每日上限用完後才輪到。對話框開著但還沒按入場鍵，券沒有花掉。
    # ⚠ 模板要和上一條完全一樣，少一種文字就會停在對話框前（對話框上返回鍵 0.58）。
    # 對話框沒有取消鍵，用系統返回鍵關閉。
    template: [btn_arena_crush, btn_arena_crush_b,
               btn_arena_challenge, btn_arena_challenge_b]
    region: [230, 860, 260, 80]
    do:
      - back:
      - wait: 2
      - count:
      - finish:

  - name: 競技場券用盡 → 買滿再繼續打
    # 預設關閉（buy_arena_tickets）。開啟後用晨星買券：10 晨星一張、每日限購 8 張。
    # ⚠ 下一條刻意不綁開關：買到上限（max_fires 用完）後由它關閉對話框並結束本輪。
    template: label_arena_ticket
    when_option: buy_arena_tickets=true
    max_fires: 8           # 每日限購 8 張
    cooldown: 3
    do:
      - tap_template: btn_buy_max      # 一次加到上限
      - wait: 1
      - tap_template: btn_buy_ticket
      - wait: 2.5

  - name: 競技場券用盡 → 取消購買並結束本輪
    # 券用完時遊戲自動跳購買對話框（持有 0、10 晨星一張、每日限購 8 張）。
    # 預設不購買：花不花晨星由使用者決定。
    # ⚠ 要排在挑對手前面：對話框蓋在列表上，底下的 ⚔ 仍然比對得到。
    template: label_arena_ticket
    do:
      - tap_template: btn_cancel
      - wait: 2
      - count:
      - finish:

  # ---- 挑對手：落敗就往後退一格，勝利回到第一順位 ----
  # 四個對手橫排：左邊三個排名在自己前面（打贏才會往前），第四個在後面、必定是
  # 碾壓（不加排名，只拿積分與競技幣）。
  #
  # 排名不等於戰力，而 OCR 讀不出戰力的小數點（5.9 億讀成 59 億），所以不預測勝負，
  # 改為落敗就退一格，退到第三順位仍落敗就結束本輪。
  #
  # 接力用 max_fires：三條各觸發一次，前一條用完才輪到下一條。勝利時 reset_fires
  # 把它們歸零。
  # ⚠ pick 不要寫死：第一順位由使用者設定，退格是設定的第二、第三順位。
  #   arena_retry_on_loss 關閉時後兩條不啟用，永遠挑同一格。
  # ⚠ 四顆 ⚔ 外觀相同，靠位置區分；pick 給數字是由左數來第幾個。

  - name: 競技場頁 → 挑對手
    template: btn_arena_fight
    pick: "${arena_opponent:1}"
    when_option: crush_arena
    cooldown: 3
    max_fires: 1
    do:
      - tap_match: []
      - wait: 2.5

  - name: 上一場輸了 → 改挑弱一點的對手
    template: btn_arena_fight
    pick: "${arena_opponent_2:2}"
    when_option: arena_retry_on_loss
    cooldown: 3
    max_fires: 1
    do:
      - tap_match: []
      - wait: 2.5

  - name: 又輸了 → 挑最後一個對手
    template: btn_arena_fight
    pick: "${arena_opponent_3:3}"
    when_option: arena_retry_on_loss
    cooldown: 3
    max_fires: 1
    do:
      - tap_match: []
      - wait: 2.5

  - name: 連續三場都落敗 → 結束本輪
    # 三個順位都試過且都落敗，券留到下次（每 5 小時回復一張）。
    # ⚠ 要有 sustain：上面三條用完到這條成立之間有空檔，而清單頁一直看得到 ⚔。
    require: [anchor_arena, btn_arena_fight]
    when_option: arena_retry_on_loss
    sustain: 6
    do:
      - count:
      - finish:

  - name: 競技場沒有待辦項目 → 結束本輪
    # 沒有開賽對話框（本週已開過），也沒有對手可挑（關閉了排位戰或清單是空的）。
    # ⚠ 要有 sustain：按下開啟挑戰後會蓋一層「獲得獎勵」動畫，等動畫結束再判斷。
    require: [anchor_arena]
    absent: [btn_arena_fight, btn_open_challenge, label_arena_ticket]
    sustain: 5
    do:
      - count:
      - finish:

  # ==================== 導覽 ====================

  - name: 競技頁 → 進入競技場
    template: card_arena_main
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 筆記頁 → 進入競技
    template: card_arena
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 其他頁面 → 點筆記
    template: nav_note
    cooldown: 5
    do:
      - tap_match: []
      - wait: 2

  # ==================== 遊戲冷啟動（共用規則，說明見 dungeon.yaml） ====================

  - name: 伺服器維護中 → 結束本輪，下一輪再試
    # ⚠ 要排在「標題畫面 → 點擊開始遊戲」前面。
    template: label_server_maintenance
    do:
      - finish: skip_cleanup

  - name: 遊戲要求重新進入 → 重新啟動遊戲
    template: [label_restart_to_update, label_world_changed]
    max_fires: 2
    do:
      - tap_template: btn_confirm
      - wait: 2
      - restart_app:

  - name: 重新啟動後仍要求重新進入 → 結束本輪，下一輪再試
    template: [label_restart_to_update, label_world_changed]
    do:
      - finish: skip_cleanup

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    # ⚠ 必須排在「誤入次要頁面」前面。
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    max_fires: 10
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 標題畫面點了沒有反應 → 重新啟動遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    max_fires: 1
    do:
      - screenshot: title_stuck
      - reset_fires: [標題畫面 → 點擊開始遊戲]
      - restart_app: 45

  - name: 重新啟動後仍停在標題畫面 → 結束本輪
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    do:
      - log: 標題畫面點擊沒有反應，重新啟動遊戲後仍然一樣，結束本輪
      - screenshot: title_stuck_after_restart
      - finish: skip_cleanup

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  - name: 載入中 → 等畫面切換
    template: [label_loading, label_loading_b, label_loading_c]
    do: []

  # ==================== 後備規則（共用規則，說明見 dungeon.yaml） ====================

  - name: 觀戰確認框 → 確定退出
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 誤入次要頁面 → 點返回退出
    # ⚠ 用 require ＋ absent 而不是 template：競技頁與競技場頁都有返回鍵，用 template
    #   的話 sustain 會跨頁累積，進到競技場頁時已經累積滿，比「沒有待辦項目」先觸發
    #   而退出。把競技場頁與戰鬥畫面列進 absent，條件在那些畫面上不成立，計時才會
    #   歸零（戰鬥準備畫面返回鍵 1.000、anchor_arena 0.578，準備倒數 57 秒）。
    require: [btn_back_arrow]
    absent: [anchor_arena, btn_open_challenge, btn_battle_skip,
             label_tap_blank_close]
    sustain: 4
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 停在無法處理的畫面 → 回家園重新開始
    # 看得到家園頁籤，卻連續 5 秒沒有規則成立時回家園。
    # nav_home 在競技場流程的畫面上都 ≤0.60，只有家園 1.000 與筆記頁 0.918 過門檻，
    # 而那兩頁的主流程規則都沒有 sustain，一定先成立。
    template: nav_home
    sustain: 5
    cooldown: 30
    do:
      - screenshot:
      - tap_match: []
      - wait: 3

  - name: 完全無法辨識 → 按系統返回鍵
    # ⚠ absent 要列出開機畫面與挑戰流程的畫面（對話框、戰鬥、結果頁、購買對話框）：
    #   這些畫面上返回鍵 ≤0.66、anchor_arena ≤0.58，不列的話計時會一直累積。
    absent: [nav_home, btn_back_arrow, anchor_arena, btn_open_challenge,
             btn_arena_challenge, btn_arena_challenge_b, btn_battle_skip,
             label_tap_blank_close, label_arena_ticket,
             label_title_menu, label_tap_to_start, label_boot_logo,
             label_boot_network, label_loading, label_loading_b,
             label_loading_c, label_notice_dont_remind]
    sustain: 45
    max_fires: 5          # 用完之後由下一條重新啟動遊戲
    do:
      - screenshot: arena_unknown
      - back:
      - wait: 3

  - name: 持續無法脫困 → 重新啟動遊戲
    # ⚠ absent 要和上一條完全一樣。
    absent: [nav_home, btn_back_arrow, anchor_arena, btn_open_challenge,
             btn_arena_challenge, btn_arena_challenge_b, btn_battle_skip,
             label_tap_blank_close, label_arena_ticket,
             label_title_menu, label_tap_to_start, label_boot_logo,
             label_boot_network, label_loading, label_loading_b,
             label_loading_c, label_notice_dont_remind]
    sustain: 45
    max_fires: 3      # 用完之後由下一條結束本輪
    do:
      - restart_app: 45

