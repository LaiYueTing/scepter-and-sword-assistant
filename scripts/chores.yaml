# 自動日常雜務
#
# 把每天要做、各自只有幾步的事合成一趟，省下重複導覽的時間。
#
# 先在家園處理功能區（商城 → 好友 → 任務 → 餽贈）與精彩活動（祕寶大作戰 → 每日簽到），
# 再到筆記頁處理命運果實 → 羈絆冒險 → 素材祕境，最後公會捐獻。每段由一條入口規則開始，
# 各有一個開關。段與段之間不記錄進度，靠入口規則的 max_fires: 1 交接：走過一次就用完，
# 回到功能區、活動一覽或筆記頁時自然輪到下一段。
#
# ⚠ 順序寫在規則的排列裡。調整順序前先確認每一段結束後回到哪一頁：功能區的各項回到
#   功能區，活動的各項回到活動一覽，果實、羈絆、素材祕境回到筆記頁，而筆記頁上同時
#   看得到公會頁籤。
#
# 共通約束與共用規則的說明見 dungeon.yaml 檔頭。

name: 自動日常雜務
package: com.m88.idleXX

# 正常一趟約五分鐘，沒有需要長時間等待的步驟，超過 15 分鐘就代表卡住了，
# 結束本輪讓出給下一個排程。
max_minutes: 15

# 結束程序：捐獻面板 → 公會頁 → 公會島 → 家園。
# ⚠ 只能用 tap_template，不能用固定座標：這是無條件執行的清單。
on_finish:
  # ⚠ 每一步之前都要 wait_for，理由見 dungeon.yaml 的結束程序。
  - log: 本輪結束，返回家園待命
  - wait: 2
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: nav_home
  - wait: 2

rules:
  # ==================== 對話框優先 ====================

  - name: 獲得獎勵動畫 → 點擊關閉
    # 捐獻、公會島累積獎勵之後的「獲得獎勵」橫幅，點空白處關閉。與討伐共用模板（0.998）。
    template: label_reward_got
    do:
      - tap: [360, 250]
      - wait: 1.5

  - name: 捐獻確認框 → 勾選不再提醒後確定
    # 晨星捐獻前的「要使用 N 晨星額外捐贈一次嗎？」。勾「本次登入不再提醒」再按確定，
    # 之後的捐獻不再跳出。
    # 模板取「額外捐贈一次嗎?」，避開會變的金額（20 → 50 → 200）：確認框 1.000、
    # 其餘畫面 ≤0.421。
    # ⚠ 勾選框用固定座標點，不用模板判斷有沒有勾：勾與未勾 1.000 對 0.846，距門檻
    #   只差 0.004。勾完之後這個框不會再出現，不會被點回去。
    # ⚠ 不用 tap_match 從文字位移：金額變成三位數時句子右移約 11px，勾選框位置不變。
    template: label_donate_confirm
    cooldown: 3
    do:
      - tap: [272, 666]      # 「本次登入不再提醒」的勾選框
      - wait: 0.6
      - tap_template: btn_confirm
      - wait: 2

  # ==================== 家園：功能區 ====================
  # 聊天欄上方的方塊按鈕打開功能區，依序處理 商城 → 好友 → 任務 → 餽贈，每項處理完
  # 回到功能區，由下一項的入口規則接手；都用完之後返回家園。
  # ⚠ 這幾頁都有返回鍵，所以「誤入次要頁面」的 absent 列了每一頁的錨點，各頁改由
  #   「…→ 返回」離開。否則它的計時會跨過連續領取累加，在兩次領取之間把頁面退掉。

  - name: 家園 → 開啟功能區
    # 方塊按鈕只在家園而且功能區沒開時看得到：家園 1.000、其餘 ≤0.437。
    template: btn_home_func_panel
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 2

  - name: 功能區 → 開啟商城
    # 也是功能區的錨點：功能區 ≥0.984、其餘 ≤0.819。
    template: label_panel_shop
    when_option: chores_shop
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 功能區 → 開啟好友
    template: label_panel_friends
    require: [label_panel_shop]
    when_option: chores_friends
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 功能區 → 開啟任務
    # 「任務」卡片文字在功能區 ≥0.864、其餘 ≤0.462。
    template: label_panel_task
    require: [label_panel_shop]
    threshold: 0.8
    when_option: chores_tasks
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 功能區 → 開啟餽贈
    # 「餽贈」在功能區 ≥0.886、其餘 ≤0.715。
    template: label_panel_gift
    require: [label_panel_shop]
    threshold: 0.8
    when_option: chores_rewards
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 功能區的項目都處理完 → 返回家園
    template: label_panel_shop
    when_spent: [功能區 → 開啟商城, 功能區 → 開啟好友, 功能區 → 開啟任務, 功能區 → 開啟餽贈]
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  # ---- 商城：巡禮之證、每日優惠、本週精選 ----
  # 卡片右上角有 ❗ 代表有東西可領，領完就消失。模板連 ❗ 一起裁：有 ❗ ≥0.951、
  # 領完的卡片 ≤0.757。依序處理巡禮之證 → 每日優惠 → 本週精選。

  - name: 商城 → 巡禮之證有驚嘆號 → 進入
    template: card_shop_pass_dot
    require: [label_shop_list]
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 商城 → 每日優惠有驚嘆號 → 進入
    template: card_shop_daily_dot
    require: [label_shop_list]
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 商城 → 本週精選有驚嘆號 → 進入
    template: card_shop_weekly_dot
    require: [label_shop_list]
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 商城 → 往下捲到每日優惠
    # 兩張卡片在列表最下面，拖到底兩張都看得到。
    template: label_shop_list
    max_fires: 2
    cooldown: 3
    do:
      - swipe: [360, 1000, 360, 300, 500]
      - wait: 1.5

  - name: 商城的贈禮都領完 → 返回
    # 列表的返回鍵是沒有底框的「<」，btn_back_arrow 認不得（0.51），用系統返回鍵。
    template: label_shop_list
    sustain: 6
    cooldown: 3
    do:
      - back:
      - wait: 2

  - name: 巡禮目標 → 領取
    # 與任務同一種「領取」按鈕。錨點取左上角的「巡禮之證」標題（各頁籤都是 1.000，
    # 其餘 ≤0.419）。
    # ⚠ 兩條領取排在切換頁籤前面：切換之後原本的頁籤可能還掛著 ❗。
    template: btn_claim_dot
    require: [label_pass]
    threshold: 0.82
    cooldown: 1.5
    do:
      - tap_match: []
      - wait: 1.5

  - name: 巡禮之證 → 領取巡禮指引的獎勵
    # 左邊「巡禮指引」那一欄可領的獎勵右上角有 ❗，region 只框那一欄，不碰右邊要
    # 付費解鎖的「女神賜福」。有 ❗ 1.000、其餘 ≤0.481。
    template: badge_reward_dot
    region: [250, 370, 70, 780]
    require: [label_pass]
    max_fires: 5
    cooldown: 2
    do:
      - tap_match: [-30, 35]
      - wait: 2

  - name: 巡禮之證 → 巡禮目標有驚嘆號 → 切換頁籤
    # badge_tab_dot_b 是頁籤上的紅色 ❗，region 只框「巡禮目標」頁籤的右上角。
    template: badge_tab_dot_b
    region: [660, 1170, 50, 45]
    require: [label_pass]
    max_fires: 1
    cooldown: 3
    do:
      - tap: [610, 1218]
      - wait: 2

  - name: 巡禮之證頁籤有驚嘆號 → 切換頁籤
    # 巡禮值升級之後，「巡禮之證」頁籤會出現 ❗（0.830～0.975，其餘 ≤0.446）。
    template: badge_tab_dot
    region: [390, 1170, 50, 45]
    require: [label_pass]
    threshold: 0.8
    max_fires: 1
    cooldown: 3
    do:
      - tap: [290, 1218]
      - wait: 2

  - name: 巡禮之證已處理完 → 返回
    require: [label_pass]
    absent: [btn_claim_dot]
    threshold: 0.82
    sustain: 4
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 每日優惠 → 領取每日贈禮
    # 左上角的禮物，有 ❗ 0.884～1.000、領完變成「已領取」0.543。錨點取「小確幸禮包」
    # 標題（0.891～1.000，其餘 ≤0.716），大標題有光暈動畫不能用。
    template: gift_daily_dot
    require: [label_offer_daily]
    threshold: 0.8
    max_fires: 1
    cooldown: 3
    do:
      - tap_match: [-30, 20]
      - wait: 2

  - name: 每日優惠已領取 → 返回
    require: [label_offer_daily]
    absent: [gift_daily_dot]
    threshold: 0.8
    sustain: 3
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 本週精選 → 領取每週贈禮
    # 有 ❗ 1.000、領完 ≤0.642。
    template: gift_weekly_dot
    require: [label_offer_weekly]
    max_fires: 1
    cooldown: 3
    do:
      - tap_match: [-40, 30]
      - wait: 2

  - name: 本週精選已領取 → 返回
    require: [label_offer_weekly]
    absent: [gift_weekly_dot]
    sustain: 3
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  # ---- 好友：友情幣 ----

  - name: 好友 → 友情幣有驚嘆號 → 開啟
    # 底部中央的按鈕，有 ❗ 1.000、領完 ≤0.542。
    template: btn_friend_coin_dot
    require: [label_friends]
    threshold: 0.8
    max_fires: 1
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 獲得友情幣 → 領取
    # 對話框的「領取」位置固定；領完之後同一個對話框改顯示「暫時沒有可領取的友情幣」。
    require: [label_friend_coin]
    absent: [label_friend_coin_empty]
    max_fires: 2
    cooldown: 3
    do:
      - tap: [360, 965]
      - wait: 2

  - name: 友情幣已領完 → 關閉對話框
    template: label_friend_coin_empty
    max_fires: 2
    cooldown: 3
    do:
      - back:
      - wait: 2

  - name: 好友已處理完 → 返回
    require: [label_friends]
    absent: [btn_friend_coin_dot, label_friend_coin]
    threshold: 0.8
    sustain: 3
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  # ---- 任務：日常、週常 ----

  - name: 任務 → 領取
    # 可領的任務按鈕右上角有 ❗，領完的任務沉到最下面變成「已完成」。有 ❗ 的「領取」
    # 0.859～1.000；錨點取底部的「任務／成就」頁籤（1.000，其餘 ≤0.768）。
    template: btn_claim_dot
    require: [label_tasks_tabs]
    threshold: 0.82
    cooldown: 1.5
    do:
      - tap_match: []
      - wait: 1.5

  - name: 任務 → 週常有驚嘆號 → 切到週常
    # badge_tab_dot 是頁籤上的紅色 ❗，region 只框週常頁籤的右上角。
    template: badge_tab_dot
    region: [330, 1170, 60, 45]
    require: [label_tasks_tabs]
    max_fires: 1
    cooldown: 3
    do:
      - tap: [318, 1216]
      - wait: 2

  - name: 任務已領完 → 返回
    require: [label_tasks_tabs]
    absent: [btn_claim_dot]
    threshold: 0.82
    sustain: 3
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  # ---- 餽贈 ----

  - name: 餽贈 → 領取全部
    # 按任何一個「領取」就會全部領走，之後頁面顯示「暫無可領取的餽贈獎勵」。
    template: btn_gift_claim_dot
    require: [label_gift_overview]
    max_fires: 2
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 餽贈已領完 → 返回
    require: [label_gift_overview]
    absent: [btn_gift_claim_dot]
    sustain: 3
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  # ==================== 家園：精彩活動 ====================
  # 右上角的「精彩活動」打開活動一覽，依序處理 祕寶大作戰 → 每日簽到。賽季活動每期
  # 內容不同，不處理。

  - name: 家園 → 開啟精彩活動
    # 功能區開著時這個圖示也看得到，所以要求方塊按鈕在（功能區會蓋住它）。
    template: label_home_events
    require: [btn_home_func_panel]
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 活動一覽 → 祕寶大作戰有驚嘆號 → 進入
    # 紅色 ❗ ≥0.955；能量領完之後變成藍色 ❕，只有 ≤0.791。
    template: card_treasure_dot
    require: [label_event_list]
    threshold: 0.9
    when_option: chores_treasure
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 活動一覽 → 每日簽到有驚嘆號 → 進入
    # 有 ❗ ≥0.992、簽完 ≤0.677。
    template: card_signin_dot
    require: [label_event_list]
    when_option: chores_signin
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 活動一覽 → 往下捲
    # 每日簽到在列表最下面，拖到底時祕寶大作戰與每日簽到都看得到。
    template: label_event_list
    max_fires: 2
    cooldown: 3
    do:
      - swipe: [360, 1000, 360, 300, 500]
      - wait: 1.5

  - name: 活動都處理完 → 返回
    # 列表的返回鍵沒有底框，用系統返回鍵。
    template: label_event_list
    sustain: 6
    cooldown: 3
    do:
      - back:
      - wait: 2

  - name: 祕寶大作戰 → 領取能量
    # 錨點取「購買禮包獲得」那一列：祕寶大作戰 1.000、其餘 ≤0.565。
    template: btn_claim_dot
    require: [label_treasure_page]
    threshold: 0.82
    cooldown: 1.5
    do:
      - tap_match: []
      - wait: 1.5

  - name: 祕寶大作戰已領完 → 返回
    require: [label_treasure_page]
    absent: [btn_claim_dot]
    threshold: 0.82
    sustain: 3
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 每日簽到 → 領取今天的獎勵
    # 今天那一格上方的「領取」標籤，1.000、其餘 ≤0.445。
    template: btn_signin_today
    require: [label_signin]
    max_fires: 1
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 每日簽到已領取 → 返回
    require: [label_signin]
    absent: [btn_signin_today]
    sustain: 3
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  # ==================== 命運果實 ====================
  # 地圖探索頁的「命運果實」卡片在可領取時左下角顯示「可領取」，直接點那個標籤就領取
  # 完成，不必進入果實頁面。

  - name: 命運果實可以領 → 點下去領走
    # 模板取「可領取」標籤：可領 1.000、領完（變成倒數）0.530、其餘畫面 ≤0.540。
    template: label_fruit_ready
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 筆記頁 → 進地圖探索看果實
    # 入口規則，max_fires: 1。領完或還不能領時，地圖探索頁沒有規則成立，由後備規則
    # 「誤入次要頁面」按返回回到筆記頁。
    template: card_map_explore
    when_option: chores_fruit
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  # ==================== 羈絆冒險 ====================
  # 地圖上的節點右上角有 ❗ 代表需要處理：紅 ❗ 是委派完成可領獎，藍 ❗ 是空著可委派。
  # 點進去之後由下面的規則依畫面處理。全部派出後節點顯示 ⏳ 倒數、沒有記號，這一段
  # 自然結束。

  - name: 委派結束 → 點擊領取獎勵
    # 委派完成的全螢幕「委派結束」，點任意處關閉即領取。
    # ⚠ 標題有兩種樣式：一般成功是白字黑邊（寬 310px），大成功是青字白邊加一對 ⬆
    #   （寬 402px），互相只有 0.179／0.239，兩張都要掛。模板取縮放動畫結束後的畫面。
    template: [label_dispatch_done, label_dispatch_done_b]
    cooldown: 3
    do:
      - tally: 羈絆領獎
      - tap: [360, 180]
      - wait: 2

  - name: 委派開始 → 關閉確認頁
    # 派出之後的全螢幕「委派開始」，點任意處關閉才回到地圖。
    # 模板取標題四個字：其餘畫面 ≤0.279，與「委派結束」0.171／0.216。
    template: label_dispatch_sent
    cooldown: 3
    do:
      - tap: [360, 180]
      - wait: 2

  - name: 委派條件沒滿足 → 按確定繼續
    # 「委派條件沒有全部滿足，是否繼續委派?」：照樣派出。確認框 1.000、其餘 ≤0.352。
    template: label_dispatch_confirm
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 委派詳情頁還沒選人 → 按快速選擇
    # 「委派成員」欄還有淺灰人形圖示就是沒選人：空著時找得到 2 格（1.000／0.991），
    # 選好之後 0 格，其餘畫面 ≤0.561。
    # ⚠ 黑色剪影是按下快速選擇後、頭像載入前的過渡畫面，不能當作空位的判斷依據。
    # ⚠ btn_quick_select 要從沒有點擊漣漪的畫面裁：乾淨 1.000、漣漪擴散中 0.961、
    #   點擊當下 0.687。
    require: [btn_quick_select, slot_empty]
    cooldown: 4
    do:
      - tap_template: btn_quick_select
      - wait: 1.5

  - name: 委派詳情頁人選好了 → 開始委派
    # ⚠ region 只作用在 absent（require 不使用 region），框住成員欄，避免畫面別處的
    #   深色圓形被當成空位。
    require: [btn_dispatch_start]
    absent: [slot_empty]
    region: [60, 600, 660, 120]
    cooldown: 4
    do:
      - tally: 羈絆委派
      - tap_template: btn_dispatch_start
      - wait: 2.5

  - name: 委派詳情頁 → 等畫面回應
    # 攔截規則。按下快速選擇的瞬間漣漪蓋住按鈕（0.687），上面兩條都不成立。
    # 錨點「開始委派」在詳情頁任何狀態都是 1.000。
    template: btn_dispatch_start
    do: []

  - name: 羈絆地圖有可派的節點 → 點進去
    # ❗ 在節點方塊右上角，往左下偏移點到方塊本身。
    # 紅、藍兩色都要掛；模板清單的順序就是優先順序，紅色在前＝先領獎再委派。
    # ⚠ region 要框住整張地圖（y 90 起算）：每一階的節點位置不同，記號最高出現在
    #   y≈134。標題列的 ❗ 在 y≈50，框不到。
    # ⚠ 一定要有頁面錨點：記號實際分數 0.88～1.00（背景會透出來），而其他頁面在這個
    #   region 內最高 0.884（公會活動頁）、0.862（筆記頁）。錨點「基礎委派獎勵：」
    #   本頁 1.000、其餘 ≤0.694，綁上後門檻才能放到 0.80。
    # pick: highest 讓處理順序固定（由上而下），所有節點最後都會處理到。
    require: [label_bond_map]
    template: [mark_bond_node, mark_bond_ready]
    region: [20, 90, 690, 740]
    threshold: 0.80
    pick: highest
    cooldown: 4
    do:
      - tap_match: [-25, 40]
      - wait: 2.5

  - name: 筆記頁 → 進羈絆冒險
    # 入口規則，max_fires: 1。
    template: card_bond_adventure
    when_option: chores_bond
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  # ==================== 素材祕境：一鍵購買 ====================
  # 筆記頁 →「素材祕境」→ 右下角「一鍵購買」→ 對話框裡四列道具，由上而下是鐵鎚、
  # 十字鎬、拳套、鏟子（對應鐵石、黃金、怪物、砂石四個礦洞），每列有「今日限購：N/20」
  # 與組數加減鈕，最下面「購買 ✦總價」一次買齊。
  #
  # 每列用 top_up 讀出今天已買的組數，把組數調成「設定 − 已買」（設定是每天最多買幾組，
  # 手動買過的也算在內）。「−」最低到 0，「+」最多到 20 減掉已買的。四列都不必買就
  # 不按購買；購買另外綁 max_fires_daily: 1 作為第二道保險。
  # 按下購買後沒有確認框，對話框直接關閉並顯示入帳。
  #
  # ⚠ 四條 top_up 要排在購買前面：購買依它們設定的旗標決定要不要按。

  - name: 一鍵購買：鐵鎚補到設定的組數
    require: [label_material_buy_dialog]
    when_option: chores_material=true
    max_fires: 1
    do:
      - top_up:
          label: 鐵鎚
          read: [466, 404, 132, 24]
          minus: [472, 445]
          plus: [593, 445]
          target: "${material_hammer_sets:2}"
          flag: 素材有要買的
      - wait: 0.5

  - name: 一鍵購買：十字鎬補到設定的組數
    require: [label_material_buy_dialog]
    when_option: chores_material=true
    max_fires: 1
    do:
      - top_up:
          label: 十字鎬
          read: [466, 516, 132, 24]
          minus: [472, 557]
          plus: [593, 557]
          target: "${material_pickaxe_sets:2}"
          flag: 素材有要買的
      - wait: 0.5

  - name: 一鍵購買：拳套補到設定的組數
    require: [label_material_buy_dialog]
    when_option: chores_material=true
    max_fires: 1
    do:
      - top_up:
          label: 拳套
          read: [466, 628, 132, 24]
          minus: [472, 669]
          plus: [593, 669]
          target: "${material_glove_sets:2}"
          flag: 素材有要買的
      - wait: 0.5

  - name: 一鍵購買：鏟子補到設定的組數
    require: [label_material_buy_dialog]
    when_option: chores_material=true
    max_fires: 1
    do:
      - top_up:
          label: 鏟子
          read: [466, 740, 132, 24]
          minus: [472, 781]
          plus: [593, 781]
          target: "${material_shovel_sets:2}"
          flag: 素材有要買的
      - wait: 0.5

  - name: 一鍵購買：組數調好了 → 購買
    # ⚠ 用 tap_template 不用固定座標：它會重新擷取畫面，對話框已關閉時就不點。
    require: [label_material_buy_dialog]
    when_option: chores_material=true
    when_flag: 素材有要買的
    max_fires_daily: 1
    do:
      - tap_template: btn_material_buy
      - wait: 3

  - name: 一鍵購買對話框還開著 → 按取消關閉
    # 不必購買、已經買完、或開關關閉卻停在對話框上時關閉它。
    # ⚠ 用 sustain 不用 cooldown：按下購買後的轉場期間標題列可能還在，立刻按取消
    #   可能點到其他畫面。
    require: [label_material_buy_dialog]
    sustain: 5
    do:
      - tap: [229, 900]
      - wait: 2

  - name: 素材祕境 → 開一鍵購買
    # 入口之後的一步，max_fires: 1。關閉對話框後這頁沒有規則成立，由後備規則
    # 「誤入次要頁面」按返回回到筆記頁（返回鍵 1.000）。模板本頁 1.000、其餘 ≤0.659。
    template: btn_material_one_click
    when_option: chores_material=true
    max_fires: 1
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 筆記頁 → 進素材祕境
    # 入口規則，max_fires: 1。模板只裁卡片上的「素材祕境」文字：筆記頁 1.000、其餘 ≤0.608。
    template: card_material_realm
    when_option: chores_material=true
    max_fires: 1
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  # ==================== 公會捐獻 ====================

  - name: 不做捐獻卻停在捐獻面板 → 關掉退出
    # chores_donate 關閉而面板已經開著時關閉它（面板在第三層，沒有導覽規則帶得走）。
    # ⚠ 面板上沒有返回鍵（0.622），要按系統返回鍵。
    template: label_donate_panel
    when_option: "!chores_donate"
    cooldown: 3
    do:
      - back:
      - wait: 1.5

  - name: 捐獻次數已用盡 → 結束本輪
    # 五次捐完後按鈕變成灰色「今日的捐贈次數已達到上限」。
    # 模板只取「今日的捐贈」，右半有光暈動畫：上限畫面 1.000／0.960、其餘 ≤0.467。
    # ⚠ 面板上沒有返回鍵（0.622）與家園（0.503），要自己按系統返回鍵關閉面板。
    template: label_donate_maxed
    do:
      - back:
      - wait: 1.5
      - count:
      - finish:

  - name: 捐獻面板 → 免費捐贈
    # 每日第一次免費：0/5 畫面 1.000、換成晨星版後 ≤0.473。
    template: btn_donate_free
    when_option: guild_donate_free
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 捐獻面板 → 花晨星捐贈
    # 免費那次之後按鈕變成「捐贈 ✦N」，價格逐次遞增（20 → 50 → 200）。
    # 模板取「捐贈」加晨星圖示，與「免費捐贈」區分。價格三位數時文字重新置中，
    # 分數最低 0.916。
    # ⚠ 會花晨星（競技場買券、副本買次數也用晨星）。guild_donate_stars 關閉時只捐免費那次。
    # ⚠ 次數上限用 max_fires_daily：捐了幾次畫面上看不到，max_fires 每輪重置會在重新
    #   執行時多捐。
    template: btn_donate_star
    when_option: guild_donate_stars
    cooldown: 3
    max_fires_daily: "${guild_donate_star_times:4}"
    do:
      - tap_match: []
      - wait: 2

  - name: 今日捐獻已達設定次數 → 關閉面板並結束本輪
    # 上一條的每日上限用完（或關閉晨星捐獻）後才輪到。少了這條會停在面板上直到
    # max_minutes。
    # ⚠ 一定要 when_spent：捐獻之後按鈕一直留在畫面上，只靠 sustain 的話計時會跨過
    #   好幾次捐獻累加，在上一條 cooldown 的那 3 秒裡搶先結束，少捐一次。
    # ⚠ 面板上沒有返回鍵，要按系統返回鍵。
    template: btn_donate_star
    when_spent: 捐獻面板 → 花晨星捐贈
    sustain: 4
    do:
      - back:
      - wait: 1.5
      - count:
      - finish:

  - name: 捐獻面板開著 → 等畫面回應
    # 攔截規則。按下捐贈到畫面更新之間上面幾條都不成立，要擋住後備規則。
    # 錨點用面板標題「公會捐贈」（1.000、其餘 ≤0.448）。
    template: label_donate_panel
    do: []

  - name: 公會頁 → 開啟公會捐贈
    # 公會大廳底部第一顆圓鈕。模板取按鈕下方文字，不含會消失的紅點：
    # 公會頁 1.000／0.946、其餘畫面 ≤0.659。
    template: btn_guild_donate
    when_option: chores_donate
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  # ==================== 頁面導覽 ====================
  # 公會島的拖曳搜尋與討伐相同，差別只在目標是大廳而不是遠征之門（說明見 raid.yaml）。
  # 導覽排在各段任務之後：前面都沒有事情要做時才往下一頁走。
  #
  # ⚠ 走向捐獻的每一步都要掛 chores_donate。從公會島或公會頁啟動時，只擋入口仍會走進
  #   捐獻面板。開關關閉時這幾頁沒有規則成立，由後備規則逐層退出。

  - name: 放置詳情對話框 → 按系統返回鍵關閉
    # 放置獎勵剛領過、還沒累積時，點右下角開的是「放置詳情」（採集效率與加成），不是領獎。
    # 對話框沒有關閉鍵；系統返回鍵關得掉。raid.yaml 有同一條。
    # 模板只裁標題「放置詳情」：對話框 1.000、其餘樣本 ≤0.676。
    template: label_idle_detail
    cooldown: 3
    do:
      - back:
      - wait: 1.5

  - name: 公會島放置獎勵 → 領取
    # 右下角（角色＋熔爐、下方一條計時）是隨時可領的放置獎勵，累積越久越多（2 小時
    # 18 分＝公會幣 326、時之砂 1200，上限 36 小時）。點下去就領取並重新累計，跳出的
    # 「獲得獎勵」橫幅由第一條規則關閉；剛領過時開的是「放置詳情」，由上一條關閉。
    # 模板只裁熔爐（角色姿勢會變、右側石堆會被卡片邊緣切掉）：公會島 0.963～1.000
    # （日夜皆同）、其餘 ≤0.579。raid.yaml 有同一條。
    template: btn_guild_mine_reward
    require: [label_nav_guild_on]
    region: [500, 880, 220, 160]
    max_fires: 1
    do:
      - tap_match: []
      - wait: 2

  - name: 公會島看到公會大廳 → 點進去
    # 模板取建築下方的文字標籤（UI 疊加層，不受施工鷹架與日夜影響）：
    # 白天 1.000、夜晚 0.975／0.954、看不到大廳的視角 0.554。
    template: building_guild_hall
    when_option: chores_donate
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 公會島找不到大廳 → 往右拖曳搜尋
    # ⚠ 拖曳距離與速度不要加大，理由見 raid.yaml。
    require: [label_nav_guild_on]
    absent: [building_guild_hall]
    when_option: chores_donate
    max_fires: 5
    do:
      - swipe: [480, 400, 240, 400, 800]
      - wait: 1.5

  - name: 公會島找不到大廳 → 往回拖曳搜尋
    require: [label_nav_guild_on]
    absent: [building_guild_hall]
    when_option: chores_donate
    max_fires: 20
    do:
      - swipe: [240, 400, 480, 400, 800]
      - wait: 1.5

  - name: 不在筆記頁 → 點筆記頁籤
    # 前三段的入口在筆記頁，這條負責開始時走過去。
    # ⚠ 要排在公會島那幾條後面（島上也看得到筆記頁籤），又要排在「點公會頁籤」前面
    #   （否則從家園啟動會直接進入捐獻，跳過前三段）。
    # ⚠ max_fires: 1：只負責開始時。各段結束後由後備規則的返回鍵回到筆記頁。
    # ⚠ sustain: 5：家園也看得到筆記頁籤，按下功能區或精彩活動之後的等待與過渡畫面
    #   不能觸發。家園的兩個入口沒有 sustain，一到家園就先觸發。
    template: nav_note
    sustain: 5
    max_fires: 1
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 不在公會島 → 點公會頁籤
    # ⚠ sustain: 5 的理由同上一條；兩條一起有，家園上仍由上一條先到。
    template: nav_guild
    when_option: chores_donate
    sustain: 5
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 所有項目都已完成 → 結束本輪
    # 不捐獻時，前三段走完會停在家園或筆記頁，沒有規則成立。
    # ⚠ 錨點 nav_guild 只在家園（0.929）與筆記頁（1.000）過門檻，其餘 ≤0.446。
    # ⚠ 只在捐獻關閉時啟用，與「點公會頁籤」互斥：兩條同時啟用時，入口規則 cooldown
    #   的 4 秒內會被這條搶先。
    template: nav_guild
    when_option: "!chores_donate"
    sustain: 5
    do:
      - count:
      - finish:

  # ==================== 換頁與冷啟動（共用規則，說明見 dungeon.yaml） ====================

  - name: 載入中 → 等畫面切換
    template: [label_loading, label_loading_b, label_loading_c]
    do: []

  - name: 伺服器維護中 → 結束本輪，下一輪再試
    # ⚠ 要排在「標題畫面 → 點擊開始遊戲」前面。
    template: label_server_maintenance
    do:
      - finish: skip_cleanup

  - name: 遊戲要求重新進入 → 重新啟動遊戲
    template: [label_restart_to_update, label_world_changed]
    max_fires: 2
    do:
      - tap_template: btn_confirm
      - wait: 2
      - restart_app:

  - name: 重新啟動後仍要求重新進入 → 結束本輪，下一輪再試
    template: [label_restart_to_update, label_world_changed]
    do:
      - finish: skip_cleanup

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    # ⚠ 必須排在「誤入次要頁面」前面。
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    max_fires: 10
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 標題畫面點了沒有反應 → 重新啟動遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    max_fires: 1
    do:
      - screenshot: title_stuck
      - reset_fires: [標題畫面 → 點擊開始遊戲]
      - restart_app: 45

  - name: 重新啟動後仍停在標題畫面 → 結束本輪
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    do:
      - log: 標題畫面點擊沒有反應，重新啟動遊戲後仍然一樣，結束本輪
      - screenshot: title_stuck_after_restart
      - finish: skip_cleanup

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  # ==================== 後備規則（共用規則，說明見 dungeon.yaml） ====================

  - name: 觀戰確認框 → 確定退出
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 退出確認對話框 → 確定退出
    # 副本那一輪中途中斷時留下的結算頁，說明見 dungeon.yaml 的同名規則。
    template: label_exit_confirm
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2.5

  - name: 點空白處無法關閉的頁面 → 重新啟動遊戲
    # ⚠ 一定要排在點空白處那條前面。
    template: label_tap_blank_close
    sustain: 90
    max_fires: 1
    do:
      - screenshot: blank_page_stuck
      - restart_app: 45

  - name: 重新啟動後仍無法關閉 → 結束本輪
    template: label_tap_blank_close
    sustain: 90
    do:
      - log: 點空白處無法關閉這張頁面，重新啟動遊戲後仍然存在，結束本輪
      - screenshot: blank_page_stuck_after_restart
      - finish: skip_cleanup

  - name: 點擊空白處關閉的頁面 → 點擊關閉
    template: label_tap_blank_close
    cooldown: 3
    do:
      - tap: [360, 640]
      - wait: 2

  - name: 誤入次要頁面 → 點返回退出
    # ⚠ absent 列出家園各項的頁面：那幾頁有自己的「→ 返回」，這條的計時要在那裡歸零。
    require: [btn_back_arrow]
    absent: [label_panel_shop, label_pass, label_offer_daily, label_offer_weekly, label_friends,
             label_friend_coin, label_tasks_tabs, label_gift_overview,
             label_treasure_page, label_signin]
    threshold: 0.8
    sustain: 6
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 停在無法處理的畫面 → 回家園重新開始
    template: nav_home
    sustain: 8
    cooldown: 30
    do:
      - screenshot:
      - tap_match: []
      - wait: 2

  - name: 完全無法辨識 → 按系統返回鍵
    # ⚠ absent 要列出開機畫面與沒有返回鍵的雜務畫面（捐獻面板、委派詳情頁、委派
    #   結束／開始），理由見 dungeon.yaml 的同名規則。
    absent: [nav_home, btn_back_arrow, label_donate_panel, btn_dispatch_start,
             label_dispatch_done, label_dispatch_done_b, label_dispatch_sent,
             label_boot_logo, label_boot_network, label_title_menu,
             label_tap_to_start]
    sustain: 45
    max_fires: 5          # 用完之後由下一條重新啟動遊戲
    cooldown: 20
    do:
      - screenshot:
      - back:
      - wait: 3

  - name: 持續無法脫困 → 重新啟動遊戲
    # ⚠ absent 要和上一條完全一樣。
    absent: [nav_home, btn_back_arrow, label_donate_panel, btn_dispatch_start,
             label_dispatch_done, label_dispatch_done_b, label_dispatch_sent,
             label_boot_logo, label_boot_network, label_title_menu,
             label_tap_to_start]
    sustain: 45
    max_fires: 3      # 用完之後由下一條結束本輪
    do:
      - restart_app: 45

  - name: 重新啟動遊戲也無法恢復 → 結束本輪
    absent: [nav_home, btn_back_arrow, label_donate_panel, btn_dispatch_start,
             label_dispatch_done, label_dispatch_done_b, label_dispatch_sent,
             label_boot_logo, label_boot_network, label_title_menu,
             label_tap_to_start]
    sustain: 45
    do:
      - log: 重新啟動遊戲三次仍無法辨識畫面，結束本輪
      - screenshot: stuck_after_restart
      - finish:
