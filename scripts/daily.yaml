# 自動每日活動（聖獸試煉 + 雙影幻境）
#
# 流程：家園 → 筆記頁 →「每日活動」→ 聖獸試煉：配對 → 接受 → 打完領獎
#      → 退回每日活動頁 → 雙影幻境：配對 → 接受 → 按準備 → 打完領獎
#      → 波次沒到 12 就再打一場，到了（或打滿設定的場數）就逐層退回家園
#
# 五份腳本共通的約束（tap_match 換頁要 cooldown、純攔截不能有 cooldown、
# 收尾只能用 tap_template）不再重述，見 dungeon.yaml 檔頭。
# 下面只寫這份腳本特有的四件事：
#
# 1. **兩個活動都不消耗每日次數**，只記錄當日最佳成績（聖獸記最高傷害、雙影記
#    最多擊破波次）。所以重跑不會有損失，這點和副本／討伐完全不同。
#
# 2. **「今天打過了沒」各用各的標記**：
#    - 雙影頁上直接寫著「今日最多擊破波次：N」，裁 N=12 那個數字就好。
#    - 聖獸頁上是「今日試煉最高傷害」，那是會變動的長數字（0 → 63897690742），
#      框不出穩定的 region。改成反推：**獎勵領過了就代表打過了**。
#      打一場就必定超過最高門檻（實測 638 億 vs 15.1 億，差 42 倍），
#      所以「已領」和「打過」在這裡是同一件事。
#
# 3. **兩個活動的獎勵條長得一樣**（同樣三個節點、同樣在 y≈900），所以領獎的模板
#    與 region 共用一份，只靠 require 的頁面錨點區分是誰。
#    可領 = 節點右上角的紅色驚嘆號（聖獸 0.92～1.00、雙影 0.90～0.92，
#    其餘畫面 ≤0.45）。判斷「能不能領」比判斷「領過沒」可靠，理由見 raid.yaml。
#
# 4. **這兩頁與戰鬥畫面全都有左下角返回鍵**（實測 btn_back_arrow = 1.00），
#    而配對要等 30 秒～1 分 40 秒、戰鬥要 4 分鐘。少了純攔截規則，兜底會在等待
#    期間把人退出去，所以配對中、等待其他玩家、戰鬥中各有一條 do: [] 的攔截。

name: 自動每日活動
package: com.m88.idleXX

# 雙影的配對實測等過 1 分 41 秒，期間畫面上只有傳送門的漩渦在動；戰鬥本身約 4 分鐘。
stuck_timeout: 900

# 收尾：逐層退回家園待命。可能停在雙影詳情頁、每日活動頁或戰鬥中，所以每步都先
# 試著點家園、找不到才點返回鍵退一層：戰鬥 → 詳情頁 → 每日活動頁 → 筆記頁 → 家園。
# 只有筆記頁與家園有底部導覽列，所以最多要退三層才找得到 nav_home。
on_finish:
  - log: 本輪結束，返回家園待命
  - wait: 2
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: nav_home
  - wait: 2

rules:
  # ==================== 限時 / 最深的畫面優先 ====================

  - name: 獲得獎勵動畫 → 點掉繼續
    # 領獎後跳出的黃色「獲得獎勵」橫幅，點空白處關掉。和討伐共用同一個模板
    # （實測 0.953），排最前面免得動畫蓋住底下的獎勵條造成誤判。
    template: label_reward_got
    do:
      - tap: [360, 250]
      - wait: 1.5

  - name: 配對成功 → 接受
    # ⚠ 只有 20 秒可按，所以刻意不設 cooldown——漏接的代價（整場配對作廢、
    #   要從頭再等一次）比誤點大。按下去按鈕就消失，本來也不會重複觸發。
    #   這和 dungeon.yaml 的「配對成功 → 接受」是同一個判斷。
    #
    # 用的是副本那顆既有的 btn_accept：兩個活動的接受鈕與副本同位置同外觀
    # （實測 1.000）。
    template: btn_accept
    do:
      - tap_match: []
      - wait: 3

  - name: 準備階段 → 按下準備
    # 雙影幻境接受配對後會進到戰鬥地圖，中央有「戰鬥準備倒數計時：56 秒」和一顆
    # 「準備」按鈕，不按就要等倒數結束才自動開打。
    #
    # 聖獸試煉**沒有**這一步（接受之後直接進場），所以這條只會在雙影成立。
    # 模板沿用副本的 label_battle_prepare（雙影 0.990，其餘畫面 ≤0.45）。
    #
    # ⚠ cooldown 放到 20 是為了少寫紀錄，不是怕點不到：按下準備後畫面**不會變**
    #   （要對方也按、或等倒數結束才開打），所以這條會一路重複觸發到戰鬥開始。
    #   實測 cooldown 5 會按 7 次（46 秒內）；20 秒在 56 秒的倒數裡仍有 3 次機會。
    template: label_battle_prepare
    cooldown: 20
    do:
      - tap_match: []
      - wait: 2

  - name: 結算頁 → 點空白處關閉
    # 兩個活動打完都會跳結算頁（聖獸是「隊伍傷害 N 億」、雙影是「擊破波次 N」），
    # 版面不同但底部都有同一行「點擊空白處關閉」，位置也一樣，所以共用一個模板。
    #
    # ⚠ 這張頁的返回鍵無效，只能點空白處。點 y=1255 是文字下方的空地——聖獸的
    #   結算頁在 y≈1070～1130 有一排隊友按讚鈕，往上點會誤觸。
    template: label_tap_blank_close
    cooldown: 3
    do:
      - tap: [360, 1255]
      - wait: 2.5

  - name: 等待其他玩家 → 留在原地
    # 純攔截。接受配對後的角色展示畫面，倒數 20 秒等所有人就緒，期間沒有任何
    # 該做的事。這張是全螢幕的，連返回鍵都沒有——少了這條，兜底的「完全無法辨識」
    # 會開始累積秒數。
    template: label_wait_others
    do: []

  - name: 戰鬥中 → 留在原地
    # 純攔截。錨點用「回合：N/M」那個深色膠囊，實測聖獸 0.948、雙影 0.948～0.966。
    #
    # ⚠ region 不能省。這個模板在全畫面搜尋時，非戰鬥畫面也會誤中到 0.724
    #   （畫面上到處都有深色圓角底的數字）。框住頂端那條就乾淨了。
    #
    # ⚠ 兩個活動都需要這條，但理由不同：雙影的戰鬥畫面左下角有返回鍵（1.00），
    #   少了攔截會被兜底退出戰鬥；聖獸的戰鬥畫面連返回鍵都沒有（0.58），
    #   會落到「完全無法辨識」那條去按系統返回鍵。
    template: label_round
    region: [275, 0, 200, 64]
    do: []

  # ==================== 聖獸試煉 ====================
  # 每天只需要打一場：一場就打出 638 億，而最高的獎勵門檻是 15.1 億。

  - name: 聖獸獎勵可領 → 領取
    # region 框住三個獎勵節點的紅點（實測聖獸在 y=902、雙影在 y=892，x 都是
    # 288/475/661，所以同一個 region 兩邊通用）。不框的話畫面上其他紅點會誤中。
    #
    # 門檻放到 0.80：三個節點的紅點分數在 0.83～1.00 之間（記號本身一樣，
    # 但底下透出來的獎勵圖示不同），預設的 0.85 會漏掉中間那個。
    # 反向驗證：其餘所有畫面在同一個 region 下 ≤0.45，餘裕很大。
    #
    # 偏移 (-25, +28) 是從紅點打到節點中心。cooldown 讓它一輪領一個，
    # 領完紅點消失，規則自然落空。
    require: [label_beast_page]
    template: reward_dot
    region: [268, 872, 420, 50]
    threshold: 0.80
    when_option: claim_daily_reward
    cooldown: 3
    do:
      - tally: 聖獸領獎
      - tap_match: [-25, 28]
      - wait: 2

  - name: 聖獸試煉已完成 → 前往雙影幻境
    # 「獎勵已領」就代表今天打過了（見檔頭第 2 點）。這條也讓「重開助手時已經
    # 打過就別再打」自然成立——不必記錄任何狀態，畫面自己會講。
    #
    # ⚠ 門檻用預設的 0.85：這個模板對雙影的已領節點只有 0.645（底下的獎勵圖示
    #   不同），刻意不放寬——它只負責聖獸，雙影那邊由「今日最多擊破波次」判斷。
    #   require 的頁面錨點也已經把雙影排除掉了。
    require: [label_beast_page]
    template: reward_claimed
    region: [230, 898, 480, 56]
    cooldown: 5
    do:
      - tap_template: btn_back_arrow
      - wait: 2.5

  - name: 聖獸配對中 → 等待配對
    # 純攔截。按下配對後按鈕變成「取消配對」並開始計時（實測等了 32 秒配到）。
    # 這頁左下角有返回鍵（1.00），少了這條會被兜底退出去。
    require: [label_beast_page]
    template: btn_cancel_match
    do: []

  - name: 聖獸試煉未打 → 開始配對
    # 走到這裡代表：在聖獸頁、獎勵沒得領、也沒領過、而且不在配對中。
    # 前面三條規則的順序已經把條件表達完了，不必再加額外判斷。
    #
    # ⚠ 模板名字是 btn_match_daily 而不是 btn_match：副本詳情頁那顆長得很像但
    #   不一樣（78x38 對 70x32），而 btn_match 這個名字已經被 dungeon 用走了。
    #   模板是三份腳本共用一個資料夾，取名前一定要先確認沒被佔用——覆蓋掉的話
    #   另一份腳本會默默壞掉（這次就是 selftest 才抓出來的）。
    #
    # 門檻不能留在預設的 0.85：同一顆按鈕在雙影「今天還沒打」的頁面只有 0.834
    # （不是淡入造成的——同一張畫面的頁面錨點都是 1.00，是按鈕自己的渲染差異）。
    # 放寬的安全前提是 require 的頁面錨點：配對中那張只有 0.58～0.66，
    # 副本詳情頁沒有 label_beast_page，兩邊都進不到這條。
    require: [label_beast_page]
    template: btn_match_daily
    threshold: 0.80
    cooldown: 5
    max_fires: 3
    do:
      - tap_match: []
      - wait: 3

  # ==================== 雙影幻境 ====================
  # 目標是把「今日最多擊破波次」推到 12（滿波）。打不到就再打一場，
  # 最多打幾場由設定檔的 repeat 決定。

  - name: 雙影獎勵可領 → 領取
    # 和聖獸那條完全同一組模板與 region，只有頁面錨點不同。
    # 雙影的獎勵門檻是 1／2／3 波，所以打完任何一場都會全部亮起來。
    require: [label_dual_page]
    template: reward_dot
    region: [268, 872, 420, 50]
    threshold: 0.80
    when_option: claim_daily_reward
    cooldown: 3
    do:
      - tally: 雙影領獎
      - tap_match: [-25, 28]
      - wait: 2

  - name: 雙影幻境已打滿 12 波 → 收工
    # 頁面上直接寫著「今日最多擊破波次：12」，裁那兩個字元就好，不必 OCR。
    # region 框住數字的位置（標題置中而數字靠右，位置固定）。
    # 實測 12 波時 1.000、0 波時 0.423，餘裕 0.577。
    #
    # ⚠ 必須排在「再打一場」前面，否則會在達標之後又開一場。
    require: [label_dual_page]
    template: label_wave_12
    region: [430, 795, 100, 56]
    do:
      - finish:

  - name: 雙影配對中 → 等待配對
    # 純攔截。雙影的配對比聖獸久得多（實測 1 分 41 秒），這段時間畫面上只有
    # 傳送門的漩渦在動，而左下角就是返回鍵。
    require: [label_dual_page]
    template: btn_cancel_match
    do: []

  - name: 雙影幻境未達 12 波 → 再打一場
    # 每開一場算一次，所以設定檔的 repeat 就是「最多打幾場」——打滿還沒推到
    # 12 波就結束本輪（引擎在 completed >= repeat 時停下並跑收尾）。
    #
    # 為什麼用「開場」而不是「打完」計次：打完的判斷點是結算頁，而結算頁是兩個
    # 活動共用的規則，分不出是誰的。開場這裡有頁面錨點守著，語意也剛好是使用者
    # 要的「試了幾次」。
    #
    # threshold 0.80 的理由見上面聖獸那條——「今天還沒打」的雙影頁上這顆按鈕
    # 只有 0.834，用預設門檻會整條落空而被兜底當成「誤入次要頁面」退出去。
    require: [label_dual_page]
    template: btn_match_daily
    threshold: 0.80
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3
      - count:

  # ==================== 導覽：走到每日活動 ====================

  - name: 每日活動頁 → 先進聖獸試煉
    # max_fires: 1 是這兩條規則能分工的關鍵。引擎不記錄「走到第幾步」，所以
    # 「該進哪一個活動」不能靠狀態，只能靠「聖獸那趟已經走過了」。
    #
    # 聖獸今天已經打完的情況也一樣安全：進去看到獎勵已領就退出來，
    # 這一次就用掉了，回到這頁時自然輪到下面那條。多花約 10 秒，換來不必記狀態。
    require: [label_daily_page]
    template: card_beast_trial
    cooldown: 4
    max_fires: 1
    do:
      - tap_match: []
      - wait: 2.5

  - name: 每日活動頁 → 進雙影幻境
    require: [label_daily_page]
    template: card_dual_realm
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 筆記頁 → 進入每日活動
    # 卡片右上角有數量徽章（實測打完前後都不會變，所以不能拿它判斷完成與否），
    # 模板只裁「每日活動」那四個字避開它。
    template: card_daily_events
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 不在筆記頁 → 點筆記頁籤
    # 和副本共用同一條路：每日活動和日常副本都掛在筆記頁底下。
    template: nav_note
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  # ==================== 安全網 ====================

  - name: 在每日活動裡折騰太久 → 收工
    # 真的卡在某個活動頁一直進不去戰鬥時就收工並留一張截圖，不要空轉整個上午。
    # 已知需要久等的情況（配對、戰鬥）都有專屬的攔截規則，所以走到這條代表
    # 遇到還沒見過的畫面——那張截圖就是下次要補的模板來源。
    #
    # ⚠ 1800 秒要大於「配對 + 戰鬥」的一輪（實測約 6 分鐘），也要留得下
    #   repeat 設到 3～4 場的空間。
    require: [label_daily_page]
    sustain: 1800
    do:
      - log: 已等 30 分鐘仍無進展
      - screenshot: daily_stuck
      - finish:

  # ==================== 開機 ====================
  # 冷啟動要 152 秒才進得到家園，這段期間沒有任何主流程元素可認。
  # 三條規則與時間軸的說明見 dungeon.yaml 的同名規則。

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    # 在別的裝置登入同一個帳號時會被踢出並跳出這個對話框，不按確定就永遠停在
    # 這裡（兜底接不住：這張畫面上返回鍵只有 0.487，而 modal 對話框對系統返回鍵
    # 通常無效）。說明見 dungeon.yaml。
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    # ⚠ 必須排在「誤入次要頁面」前面，否則返回鍵會先被按掉而失去勾選的機會。
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    # 冷啟動唯一會卡死的畫面：不點就永遠停在那裡，而它沒有返回鍵可讓兜底接手。
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  - name: 載入中 → 等畫面切換
    # 三個模板是同一段文字的三個彈跳位相，理由見 dungeon.yaml 的同名規則。
    template: [label_loading, label_loading_b, label_loading_c]
    do: []

  # ==================== 兜底：三層 ====================

  - name: 觀戰確認框 → 確定退出
    # 「要退出觀戰狀態嗎?」——按了系統返回鍵之後跳出來的。
    #
    # ⚠ 少了這條會死循環：兜底按返回鍵 → 叫出這個框 → 認不得 → 再按返回鍵 →
    #   框關掉又開起來。實測有使用者卡在這裡 17 分鐘、空按 26 次返回鍵。
    #   modal 對話框對系統返回鍵通常無效或反效果，一定要各自認得。
    #
    # 模板取訊息那行字（其餘樣本 ≤0.549），確定鍵用既有的 btn_confirm（1.000）。
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 誤入次要頁面 → 點返回退出
    template: btn_back_arrow
    sustain: 6
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 卡在未知畫面 → 回家園重來
    template: nav_home
    sustain: 8
    cooldown: 30
    do:
      - screenshot:
      - tap_match: []
      - wait: 3

  - name: 完全無法辨識 → 按系統返回鍵
    # ⚠ absent 裡除了開機畫面，還要列進聖獸的戰鬥錨點 label_round：
    #   聖獸戰鬥畫面上既沒有導覽列也沒有返回鍵，而 sustain 是累加的——攔截規則
    #   贏了的每一輪，這條的計時仍在往上加，4 分鐘的戰鬥打完必定超過 45 秒。
    #   （這正是冷啟動那次踩到的坑：光靠攔截排在前面擋不住計時。）
    absent: [nav_home, btn_back_arrow, nav_note, label_round, label_wait_others,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 5          # 按這麼多次還脫不了困，就交給下一條重開遊戲
    cooldown: 30
    do:
      - screenshot:
      - back:
      - wait: 2

  - name: 一直脫不了困 → 重開遊戲
    # 兜底按了 5 次系統返回鍵還是認不出畫面。返回鍵解決不了兩種狀況：**對它無效
    # 的結算頁**（只能點空白處），以及**按下去反而會叫出確認框**的頁面——後者會
    # 變成開開關關的死循環。重開遊戲讓畫面回到「開機 → 家園」這條認得的路。
    #
    # ⚠ absent 要和上面那條**完全一樣**。少列任何一個，這條就會在那個畫面上誤
    #   觸發，而重開遊戲要 152 秒。
    # ⚠ 上面那條一定要有 max_fires，否則它每輪都成立、永遠輪不到這裡。
    absent: [nav_home, btn_back_arrow, nav_note, label_round, label_wait_others,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 3      # 重開這麼多次還是認不出來，就別再重開了（見下一條）
    do:
      - restart_app: 45

  - name: 重開遊戲也救不回來 → 收工
    # 最後的保險絲。重開三次還是認不出畫面，代表遇到的東西不是「重開就會好」的
    # ——再重開下去只會每半分鐘關開遊戲一次，直到有人來看。
    #
    # ⚠ 這條非有不可。實測 2026-08-25：領獎確認框的文字被遊戲改掉，模板比不中而
    #   落到兜底，接著**每 30 秒重開一次遊戲，從 08:03 跑到 12:17**，
    #   足足 4 小時 14 分，而且是使用者自己按停止才停的——
    #   而重開那條當時沒有 max_fires，所以永遠輪不到任何人喊停。
    #
    # ⚠ 收工比空轉好：這一輪讓出去，排程會照常跑下一個腳本，下一個排定時刻也會
    #   重新開始。截圖留著當補模板的來源。
    absent: [nav_home, btn_back_arrow, nav_note, label_round, label_wait_others,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    do:
      - log: 重開遊戲三次仍然認不出畫面，這一輪先收工
      - screenshot: stuck_after_restart
      - finish:

