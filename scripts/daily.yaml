# 自動每日活動（聖獸試煉 ＋ 雙影幻境）
#
# 流程：家園 → 筆記頁 →「每日活動」→ 聖獸試煉：配對 → 接受 → 打完領獎
#      → 退回每日活動頁 → 雙影幻境：配對 → 接受 → 按準備 → 打完領獎
#      → 波次未達 12 就再打一場，達到（或打滿設定的場數）就逐層退回家園
#
# 共通約束與共用規則的說明見 dungeon.yaml 檔頭。這份腳本的特點：
#
# 1. 兩個活動都不消耗每日次數，只記錄當日最佳成績（聖獸是最高傷害、雙影是最多擊破
#    波次），重新執行沒有損失。
#
# 2. 「今天打過了沒」各用不同的標記：
#    - 雙影頁顯示「今日最多擊破波次：N」，比對 N=12。
#    - 聖獸頁的「今日試煉最高傷害」是長度會變的數字，改看獎勵：打一場必定超過最高
#      獎勵門檻（638 億對 15.1 億），所以「獎勵已領」就等於「今天打過」。
#
# 3. 兩個活動的獎勵條版面相同（三個節點、y≈900），領獎的模板與 region 共用，用
#    require 的頁面錨點區分。可領取＝節點右上角的紅色驚嘆號（聖獸 0.92～1.00、
#    雙影 0.90～0.92，其餘畫面 ≤0.45）。
#
# 4. 活動頁與戰鬥畫面都有左下角返回鍵（1.00），配對要等 30 秒到 1 分 40 秒、戰鬥約
#    4 分鐘，所以配對中、等待其他玩家、戰鬥中各有一條攔截規則。

name: 自動每日活動
package: com.m88.idleXX

# 雙影配對最長約 1 分 41 秒，期間只有傳送門漩渦在動；戰鬥本身約 4 分鐘。
stuck_timeout: 900

# 結束程序：逐層退回家園待命：戰鬥 → 詳情頁 → 每日活動頁 → 筆記頁 → 家園。
# 只有筆記頁與家園有底部導覽列，每一步先試著點家園，找不到才點返回鍵。
on_finish:
  # ⚠ 每一步之前都要 wait_for，理由見 dungeon.yaml 的結束程序。
  - log: 本輪結束，返回家園待命
  - wait: 2
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: nav_home
  - wait: 2

rules:
  # ==================== 最上層的畫面優先 ====================

  - name: 獲得獎勵動畫 → 點擊關閉
    # 領獎後的「獲得獎勵」橫幅，點空白處關閉。與討伐共用模板（0.953）。
    template: label_reward_got
    do:
      - tap: [360, 250]
      - wait: 1.5

  - name: 配對成功 → 接受
    # ⚠ 只有 20 秒可按，不設 cooldown（與 dungeon.yaml 同一條規則的理由相同）。
    # 接受鈕與副本同位置同外觀（1.000）。
    template: btn_accept
    do:
      - tap_match: []
      - wait: 3

  - name: 準備階段 → 按下準備
    # 雙影幻境接受配對後進入戰鬥地圖，中央有 56 秒倒數與「準備」按鈕；聖獸試煉沒有
    # 這一步。模板沿用副本的 label_battle_prepare（雙影 0.990，其餘畫面 ≤0.45）。
    # cooldown 20：按下後要等對方也按準備才開打，畫面不會改變，這條會重複成立；
    # 20 秒在 56 秒倒數內仍有 3 次機會。
    template: label_battle_prepare
    cooldown: 20
    do:
      - tap_match: []
      - wait: 2

  - name: 點空白處無法關閉的頁面 → 重新啟動遊戲
    # 共用規則，說明見 dungeon.yaml。⚠ 一定要排在點空白處那條前面。
    template: label_tap_blank_close
    sustain: 90
    max_fires: 1
    do:
      - screenshot: blank_page_stuck
      - restart_app: 45

  - name: 重新啟動後仍無法關閉 → 結束本輪
    template: label_tap_blank_close
    sustain: 90
    do:
      - log: 點空白處無法關閉這張頁面，重新啟動遊戲後仍然存在，結束本輪
      - screenshot: blank_page_stuck_after_restart
      - finish: skip_cleanup

  - name: 結算頁 → 點空白處關閉
    # 兩個活動的結算頁版面不同，但底部都有同一行「點擊空白處關閉」。
    # ⚠ 返回鍵無效。點 y=1255（文字下方）：聖獸結算頁 y≈1070～1130 有隊友按讚鈕。
    template: label_tap_blank_close
    cooldown: 3
    do:
      - tap: [360, 1255]
      - wait: 2.5

  - name: 等待其他玩家 → 留在原地
    # 攔截規則。接受配對後 20 秒的角色展示畫面，全螢幕而且沒有返回鍵。
    template: label_wait_others
    do: []

  - name: 戰鬥中 → 留在原地
    # 攔截規則。錨點用「回合：N/M」（聖獸 0.948、雙影 0.948～0.966）。
    # ⚠ region 不能省：全畫面搜尋時非戰鬥畫面也有 0.724。
    # 雙影戰鬥畫面有返回鍵（1.00），聖獸沒有（0.58），兩種情況都需要攔截。
    template: label_round
    region: [275, 0, 200, 64]
    do: []

  # ==================== 聖獸試煉 ====================
  # 每天打一場即可：一場約 638 億，最高獎勵門檻是 15.1 億。

  - name: 聖獸獎勵可領 → 領取
    # region 框住三個節點的紅點（聖獸 y=902、雙影 y=892，x 都是 288/475/661，同一個
    # region 兩邊通用）。門檻 0.80：三個節點 0.83～1.00（底下透出的獎勵圖示不同），
    # 其餘畫面在這個 region 內 ≤0.45。偏移 (-25, +28) 從紅點到節點中心。
    require: [label_beast_page]
    template: reward_dot
    region: [268, 872, 420, 50]
    threshold: 0.80
    when_option: claim_daily_reward
    cooldown: 3
    do:
      - tally: 聖獸領獎
      - tap_match: [-25, 28]
      - wait: 2

  - name: 聖獸試煉已完成 → 前往雙影幻境
    # 獎勵已領就代表今天打過了（見檔頭第 2 點），重新執行時不會再打一場。
    # 門檻維持 0.85：這個模板對雙影的已領節點只有 0.645，只負責聖獸。
    require: [label_beast_page]
    template: reward_claimed
    region: [230, 898, 480, 56]
    cooldown: 5
    do:
      - tap_template: btn_back_arrow
      - wait: 2.5

  - name: 聖獸配對中 → 等待配對
    # 攔截規則。配對中按鈕變成「取消配對」（約 30 秒配到），頁面有返回鍵。
    require: [label_beast_page]
    template: btn_cancel_match
    do: []

  - name: 聖獸試煉未打 → 開始配對
    # 前面三條排除了可領、已領、配對中，到這裡就是還沒打。
    # ⚠ 模板名稱是 btn_match_daily：副本的 btn_match 外觀相近但尺寸不同（78x38 對 70x32），
    #   模板資料夾是所有腳本共用的，取名前要先確認沒有重複。
    # 門檻 0.80：同一顆按鈕在雙影未打的頁面只有 0.834。配對中的頁面 0.58～0.66，
    # 副本詳情頁沒有聖獸頁錨點，放寬不會誤判。
    require: [label_beast_page]
    template: btn_match_daily
    threshold: 0.80
    cooldown: 5
    max_fires: 3
    do:
      - tap_match: []
      - wait: 3

  # ==================== 雙影幻境 ====================
  # 目標是「今日最多擊破波次」達到 12。未達到就再打一場，最多打 repeat 場。

  - name: 雙影獎勵可領 → 領取
    # 與聖獸同一組模板與 region，只有頁面錨點不同。
    require: [label_dual_page]
    template: reward_dot
    region: [268, 872, 420, 50]
    threshold: 0.80
    when_option: claim_daily_reward
    cooldown: 3
    do:
      - tally: 雙影領獎
      - tap_match: [-25, 28]
      - wait: 2

  - name: 雙影幻境已達 12 波 → 結束本輪
    # 比對「今日最多擊破波次：12」的數字（12 波 1.000、0 波 0.423）。
    # ⚠ 必須排在「再打一場」前面。
    require: [label_dual_page]
    template: label_wave_12
    region: [430, 795, 100, 56]
    do:
      - finish:

  - name: 雙影配對中 → 等待配對
    # 攔截規則。雙影配對最長約 1 分 41 秒。
    require: [label_dual_page]
    template: btn_cancel_match
    do: []

  - name: 雙影幻境未達 12 波 → 再打一場
    # 每開一場計一次，repeat 就是最多打幾場；打滿仍未達 12 波就結束本輪。
    # 在開場時計次：結算頁是兩個活動共用的規則，分不出是哪一個。
    # 門檻 0.80 的理由見聖獸那條。
    require: [label_dual_page]
    template: btn_match_daily
    threshold: 0.80
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3
      - count:

  # ==================== 導覽：走到每日活動 ====================

  - name: 每日活動頁 → 先進聖獸試煉
    # max_fires: 1 決定兩個活動的先後：聖獸走過一次後，回到這頁就輪到雙影。
    # 聖獸已經打過時進去看到已領就退出來，同樣算用掉。
    require: [label_daily_page]
    template: card_beast_trial
    cooldown: 4
    max_fires: 1
    do:
      - tap_match: []
      - wait: 2.5

  - name: 每日活動頁 → 進雙影幻境
    require: [label_daily_page]
    template: card_dual_realm
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 筆記頁 → 進入每日活動
    # 模板只裁「每日活動」四個字，避開右上角的數量徽章。
    template: card_daily_events
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 不在筆記頁 → 點筆記頁籤
    template: nav_note
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  # ==================== 安全網 ====================

  - name: 在每日活動停留過久 → 結束本輪
    # 在活動頁停留 30 分鐘仍沒有進展就結束本輪並截圖（補模板的來源）。
    # ⚠ 1800 秒要大於配對加戰鬥的一場（約 6 分鐘）乘上 repeat。
    require: [label_daily_page]
    sustain: 1800
    do:
      - log: 已等待 30 分鐘仍無進展
      - screenshot: daily_stuck
      - finish:

  # ==================== 遊戲冷啟動（共用規則，說明見 dungeon.yaml） ====================

  - name: 伺服器維護中 → 結束本輪，下一輪再試
    # ⚠ 要排在「標題畫面 → 點擊開始遊戲」前面。
    template: label_server_maintenance
    do:
      - finish: skip_cleanup

  - name: 遊戲要求重新進入 → 重新啟動遊戲
    template: [label_restart_to_update, label_world_changed]
    max_fires: 2
    do:
      - tap_template: btn_confirm
      - wait: 2
      - restart_app:

  - name: 重新啟動後仍要求重新進入 → 結束本輪，下一輪再試
    template: [label_restart_to_update, label_world_changed]
    do:
      - finish: skip_cleanup

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    # ⚠ 必須排在「誤入次要頁面」前面。
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    max_fires: 10
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 標題畫面點了沒有反應 → 重新啟動遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    max_fires: 1
    do:
      - screenshot: title_stuck
      - reset_fires: [標題畫面 → 點擊開始遊戲]
      - restart_app: 45

  - name: 重新啟動後仍停在標題畫面 → 結束本輪
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    do:
      - log: 標題畫面點擊沒有反應，重新啟動遊戲後仍然一樣，結束本輪
      - screenshot: title_stuck_after_restart
      - finish: skip_cleanup

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  - name: 載入中 → 等畫面切換
    template: [label_loading, label_loading_b, label_loading_c]
    do: []

  # ==================== 後備規則（共用規則，說明見 dungeon.yaml） ====================

  - name: 觀戰確認框 → 確定退出
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 退出確認對話框 → 確定退出
    # 副本那一輪中途中斷時留下的結算頁，說明見 dungeon.yaml 的同名規則。
    template: label_exit_confirm
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2.5

  - name: 誤入次要頁面 → 點返回退出
    template: btn_back_arrow
    sustain: 6
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 停在無法處理的畫面 → 回家園重新開始
    template: nav_home
    sustain: 8
    cooldown: 30
    do:
      - screenshot:
      - tap_match: []
      - wait: 3

  - name: 完全無法辨識 → 按系統返回鍵
    # ⚠ absent 除了開機畫面，還要列聖獸戰鬥的錨點（回合條、等待其他玩家）：聖獸戰鬥
    #   畫面沒有導覽列也沒有返回鍵，不列的話 4 分鐘的戰鬥會讓計時超過 45 秒。
    absent: [nav_home, btn_back_arrow, nav_note, label_round, label_wait_others,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 5          # 用完之後由下一條重新啟動遊戲
    cooldown: 30
    do:
      - screenshot:
      - back:
      - wait: 2

  - name: 持續無法脫困 → 重新啟動遊戲
    # ⚠ absent 要和上一條完全一樣。
    absent: [nav_home, btn_back_arrow, nav_note, label_round, label_wait_others,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 3      # 用完之後由下一條結束本輪
    do:
      - restart_app: 45

  - name: 重新啟動遊戲也無法恢復 → 結束本輪
    absent: [nav_home, btn_back_arrow, nav_note, label_round, label_wait_others,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    do:
      - log: 重新啟動遊戲三次仍無法辨識畫面，結束本輪
      - screenshot: stuck_after_restart
      - finish:
