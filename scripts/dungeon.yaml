# 自動副本
#
# 流程：筆記頁 → 日常副本 → 副本列表 → 詳情頁 → 配對 → 戰鬥 → 結算（S 級領獎）
#      → 領獎次數用盡收工 → 逐層退回家園
#
# 引擎每輪抓一張畫面，由上而下檢查規則，執行第一條成立的——順序就是優先度：
#   限時操作 > 自動模式 > 結算 > 購買次數 > 詳情頁 > 列表頁 > 筆記頁 > 兜底
#
# 「該等待」的狀態（配對中、戰鬥中、準備倒數、選房間）只需要純攔截規則（do: []）：
# 沒有規則動作，引擎自然就在等，等 20 秒或 3 分鐘都一樣。
#
# 兩條全域約束（**五份腳本共通，只在這裡寫一份**，其他四份指過來）：
#   - 用 tap_match 而且會換頁的規則一定要設 cooldown。tap_match 點的是觸發那一輪
#     截圖裡的座標，畫面切換要一兩秒；少了 cooldown 會把舊座標點在新畫面上。
#     唯一例外是限時操作（漏接的代價比誤點更大）。
#   - 純攔截規則不能設 cooldown，必須每輪都成立才擋得住兜底。
#
# 規則欄位與動作見 README。

name: 自動副本
package: com.m88.idleXX

# 戰鬥最長 650 秒，加上配對排隊，「畫面靜止」的脫困門檻要放寬到不會誤判
stuck_timeout: 900

# 收尾：逐層退回家園待命，讓下一輪或人工接手時停在已知畫面。
#
# 一定要逐層退。從副本詳情頁按一次返回只到副本列表頁，而那頁沒有底部導覽列，
# nav_home 找不到；要再退到筆記頁才有。每步先試著點家園、找不到才點返回鍵，
# 重複點 nav_home 是安全的（已經在家園再點還是家園）。
on_finish:
  # ⚠ **每一步 tap_template 前面都要先 wait_for。** 收尾是無條件清單，沒有規則
  #   可以等畫面，而 `finish` 常常剛好落在轉場的那一刻——實測 2026-09-02 09:41
  #   每日活動剛按下配對就滿了 3 次而收工，四步全部空點、人停在配對畫面上；
  #   同一天 12:33 討伐也一樣（加入戰鬥之後戰鬥正在載入）。
  #   `wait_for` 每 0.5 秒看一次、**認得出來就立刻往下走**，上限 25 秒，
  #   所以正常情況幾乎不花時間，只有真的認不得才會等。
  # ⚠ **最後那一步刻意不補。** 它的用途是「已經到家園就再確認一次」，而前一步
  #   已經等過了；在那裡再等一輪只會把「按下停止到真正結束」拖長。
  - log: 收工，返回家園待命
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: nav_home
  - wait: 2

# 等待時附在狀態列與任務卡後面的即時資訊。只影響顯示，不影響任何判斷。
#
# 戰鬥中畫面右上角有一塊評級徽章，而且是**一路往上升**的（畫面上就寫著
# 「通關 2 層後可提升評級」）。實測一場：D → C → B → A，所以看得到現在打到
# 哪一級，就知道這場還有沒有機會拿 S。
#
# 這個值在一場戰鬥裡會變好幾次，寫進紀錄只會洗版，附在狀態列剛好——隨時看得到
# 最新的，而且不留痕跡。
#
# ⚠ region 要放到 110px 高。徽章的高度會被 BOSS 血條往下推約 70px（一般關卡
#   y≈196、BOSS 房 y≈265），框太緊在 BOSS 房就整個落空。
#
# ⚠ 模板只裁**字母**，不要裁整塊牌子。牌子的形狀每一級都一樣、只有底色不同，
#   裁進去就變成在比牌子：實測「A 模板」在 D 的畫面上有 0.757，只留字母之後
#   降到 0.477。實際餘裕：57 張實機裁圖裡，第一名與第二名最少差 0.383。
#
# ⚠ 門檻 0.80 而不是預設的 0.85：牌子是半透明的，底下畫面不同分數會整段浮動
#   （同一個 D 量到 1.000 與 0.977）。反向驗證非戰鬥畫面最高只有 0.377。
#
# **沒有 S，而且不會有。** 戰鬥中的徽章最高只到 A：達到 S 的那一刻這一場就結束了，
# 直接跳結算頁去領 S 獎勵，所以 S 這一級在戰鬥畫面上根本不會出現。
# 想知道最後拿到幾級，看結算那條規則的 `log_match`（那裡才有 S）。
status:
  評級:
    region: [645, 185, 75, 110]
    threshold: 0.80
    of: {A: rank_live_a, B: rank_live_b, C: rank_live_c, D: rank_live_d}

rules:
  # ==================== 限時操作：最高優先 ====================
  # 配對成功後只有 20 秒可以按「接受」，錯過就得重新排隊。

  - name: 配對湊了 NPC 夥伴 → 拒絕，等真人隊伍
    # 玩家少時配對會自動塞 NPC 夥伴湊人數。遊戲會提示「如果拒絕，本次將不視為
    # 故意取消配對」，所以拒絕不會被鎖一分鐘，是沒有代價的選擇。
    #
    # 判斷必須用那兩行紅字：「拒絕」按鈕在無夥伴的配對畫面也在（0.975），
    # 拿它判斷分不出有沒有夥伴。
    #
    # 預設不啟用（accept_with_partners: true，照樣接受）——半夜幾乎湊不到全真人
    # 隊伍，設成拒絕會變成整晚重配。想確保評級再把開關關掉。
    template: label_partners_added
    when_option: "!accept_with_partners"
    do:
      - tap_template: btn_reject
      - wait: 3

  - name: 配對成功 → 接受
    # region 必須同時涵蓋兩種佈局：配對塞了 NPC 夥伴時，畫面多出兩行紅字提示，
    # 把「接受」按鈕往下推 75px（y 1082 → 1157）。範圍卡在剛好貼齊的邊界時，
    # 模板全畫面比對 0.974、限定 region 只有 0.369，整條規則會落空。
    #
    # 刻意不設 cooldown：限時操作，漏接的代價比誤點更大。
    #
    # 這條會在 5～6 秒後再觸發一次，而且是 template 真的比到才觸發——按下之後
    # 對話框仍留著等其他玩家也按，所以第二下點的是同一顆已按過的按鈕，無害。
    template: btn_accept
    region: [360, 1030, 360, 200]
    do:
      - tap_match: []
      - wait: 3

  # ==================== 戰鬥中的自動模式 ====================
  # 準備階段（4 秒自動確認）與選房間（9 秒自動前進）都不必操作，
  # 唯一要做的是確保遊戲內的「自動模式」開著。

  - name: 自動模式面板 → 補開自動準備
    # 錨點用「自動準備」這行標籤，不能用面板標題：標題會隨狀態變
    # （「自動模式」→「已開啟自動模式……」），啟動後就認不出來、面板關不掉。
    require: [label_auto_prepare]
    absent: [toggle_auto_prepare_on]      # 而且這個開關沒開
    region: [400, 500, 230, 46]           # 只看「自動準備」那一行
    when_option: auto_battle_mode
    do:
      - tap: [511, 524]
      - wait: 0.8

  - name: 自動模式面板 → 補開自動治療
    require: [label_auto_prepare]
    absent: [toggle_auto_heal_on]
    region: [400, 554, 230, 46]           # 只看「自動治療」那一行
    when_option: auto_battle_mode
    do:
      - tap: [511, 578]
      - wait: 0.8

  - name: 自動模式面板 → 啟動
    template: btn_start_auto
    when_option: auto_battle_mode
    cooldown: 4          # 見檔頭：用 tap_match 換頁的規則都要設
    do:
      - tap_match: []
      - wait: 1.5

  - name: 自動模式面板已在執行 → 關閉面板
    # 面板開著但沒有「開啟自動模式」按鈕，代表已經在跑了，關掉就好，
    # 不要去點「結束自動模式」。
    #
    # ⚠ 要設 cooldown。按下返回到面板真的收起來有一兩秒，少了它會在那期間
    #   連續觸發（實測一次開面板就寫了六行）。
    require: [label_auto_prepare]
    absent: [btn_start_auto]
    when_option: auto_battle_mode
    cooldown: 3
    do:
      - back:
      - wait: 1

  - name: 自動模式被中斷 → 重開
    template: label_auto_stopped
    when_option: auto_battle_mode
    do:
      - tap: [46, 838]                    # 左側齒輪
      - wait: 1.5

  - name: 戰鬥中但自動模式沒開 → 點齒輪開面板
    # 上面那五條都要求面板已經開著，這條負責把它打開；開了之後由它們接手
    # （有「開啟自動模式」就按，沒有代表已在跑、關掉面板）。
    #
    # ⚠ 錨點只能用回合條。齒輪在 BOSS 房是 0.742～0.810、中位 0.777，40 次
    #   取樣有 25 次低於門檻 0.78，sustain 撐不滿；回合條同期 0.940～1.000。
    # ⚠ 齒輪要用固定座標點：`tap_template` 寫死用 runtime.threshold（0.85），
    #   齒輪只有 0.81 找不到；而 `tap_match` 點的是回合條不是齒輪。
    # ⚠ 選房間階段沒有回合條（0.491），所以不會在那裡開面板——理由見下面。
    template: label_round
    when_option: auto_battle_mode
    sustain: 20
    max_fires: 1
    do:
      - tap: [46, 838]         # 左側齒輪
      - wait: 1.5

  # ⚠ 不要加「**定期**開自動模式面板確認」這種規則。自動模式開了就會一直開著，
  #   而定期開會在選房間、準備階段亂開面板，兩層 UI 疊起來後齒輪與面板都認不
  #   出來，反被判成「完全無法辨識」而按返回，整場副本毀掉。
  #
  #   上面那條和它的差別是「只開一次」＋「錨點在選房間階段不成立」，不是同一
  #   件事——但改動它之前先把那兩個條件重新量一遍。

  # ==================== 結算處理 ====================
  # 順序是判斷的一部分：S 級規則排在前面，所以後面的規則能成立時，
  # 必定代表「在結算頁但找不到 S」。rank_s 在 S 頁 0.999、A 頁 0.386。

  - name: 退出確認對話框 → 確定退出
    # 評級未達 S 而退出結算頁時，遊戲會先問「尚未領取日常副本獎勵，確定要退出？」。
    # ⚠ 系統返回鍵對這個框完全無效，所以少了這條會一路掉到兜底空按返回而卡死。
    #
    # 和「領獎確認框」是不同的對話框，各自用文字判斷（互相只有 0.39），
    # 但「確定」按鈕是同一個模板。
    template: label_exit_confirm
    do:
      - tap_template: btn_confirm
      - wait: 2.5

  - name: 領獎確認對話框 → 點確定
    # 點「領取獎勵」不會直接領到，會先跳「要消耗領獎次數 ...」的確認框。
    # ⚠ 要排在結算規則前面，對話框才不會被漏掉——漏了會變成「紀錄寫完成 1 次、
    #   獎勵一個都沒領到」，這種錯最難發現。
    #
    # ⚠ 兩個模板：2026-08-25 遊戲把這句話整個改寫了（「要消耗領獎次數，領取本次
    #   副本獎勵嗎?」→「領取本次副本獎勵需消耗當日領獎次數，是否領取?」），舊模板
    #   對新畫面只有 0.369，於是整條落空、掉進兜底，接著每 30 秒重開一次遊戲跑了
    #   一個多小時。舊文字留著是因為別人的客戶端不一定同時更新。
    # ⚠ 新的那句底下多了一行「可領獎次數：N」——**不能裁進來**，那個數字會變。
    #   模板只取第一行（本畫面 1.000、其餘樣本 ≤0.543）。
    template: [label_claim_confirm, label_claim_confirm_old]
    do:
      - tap_template: btn_confirm
      - wait: 2.5
      - count:

  - name: 獎勵已領取 → 離開結算頁
    # 領完後按鈕變成灰色「已領取」，但評級 S 還在畫面上——少了這條會一直去戳
    # 已經失效的按鈕。「已領取」對「領取獎勵」模板只有 0.54，不會互相誤判。
    template: btn_claimed
    do:
      - tap: [75, 1219]
      - wait: 2.5

  - name: 結算頁 → 幫隊友按讚
    # 要在領獎前做，領完畫面就換掉了。按過的讚會變成已按狀態、模板找不到，
    # 所以不會重複點。
    template: btn_like
    when_option: like_teammates
    do:
      - tap_all: btn_like
      - wait: 1

  - name: 結算頁次數已用盡 → 不領獎直接退出
    # 領獎次數用盡時，結算頁右下的按鈕從「領取獎勵」換成灰色「領獎次數已用盡」，
    # 所以 btn_claim_reward 整條落空，底下兩條退出規則都不會成立。
    #
    # ⚠ 必須排在「結算 S 級 → 領取獎勵」前面。否則評級剛好是 S 而次數用盡時，
    #   那條會成立並一直去點這顆已失效的灰按鈕，卡在結算頁出不來。
    #
    # region 是必要的：詳情頁那行「今日的領獎次數已用盡」很像，全畫面比對有
    # 0.857 會誤中。兩者 y 差 180px，框住按鈕後結算頁 1.000、詳情頁 0.035。
    template: btn_count_used_up
    region: [360, 1185, 330, 66]
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5
      - count:

  - name: 明天開新副本 → 今天不領獎，打完這一場就收工
    # 次數已經在詳情頁買滿了，這一場只是把今天的例行走完（評級仍會更新），
    # 獎勵留到明天。打完就收工，免得沒有次數用盡的收工條件而一直打下去。
    #
    # ⚠ 退出前一定要自己按掉「尚未領取日常副本獎勵，確定要退出副本嗎?」。
    #   別條不領獎的規則不必管它——退出之後引擎還會再轉一輪，「退出確認對話框
    #   → 確定退出」自然接手；而這條緊接著 finish，引擎當場就停了，on_finish
    #   只找 nav_home 與返回鍵，對這個彈窗完全無效，遊戲會整個卡在上面。
    template: btn_claim_reward
    when_option: "stock_up_before_new_dungeon=true"
    when_flag: [明天開新副本]
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait_for: label_exit_confirm
      - tap_template: btn_confirm
      - wait: 2.5
      - count:
      - finish:

  - name: 結算 S 級 → 領取獎勵
    # ⚠ when_flag 綁的是詳情頁判斷出來的「這一級已經是天花板」。少了它，新副本
    #   開放當天會把次數花在普通與困難的獎勵上——那兩場的 S 是拿來解鎖用的，
    #   獎勵要留給打得動的最高難度。旗標怎麼設見詳情頁那三條。
    template: rank_s
    region: [270, 140, 200, 220]
    when_option: claim_reward
    when_flag: [已在最高難度]
    do:
      - tally: 領取副本獎勵
      - tap: [520, 1217]
      - wait: 2

  - name: 還能解鎖更高的難度 → 拿到 S 也先不領獎
    # 這一場的 S 會把下一級打開，所以領獎次數留著。退出後回到詳情頁，
    # 「下一難度可以解鎖 → 按下解鎖」會接手。
    template: rank_s
    region: [270, 140, 200, 220]
    when_option: claim_reward
    when_flag: ["!已在最高難度"]
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5

  - name: 設定為不領獎 → 直接退出
    # claim_reward 關閉時走這條：打完就走、不消耗領獎次數，可以無限打下去
    # 賺友情點數。
    template: btn_claim_reward
    when_option: "!claim_reward"
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5
      - count:

  - name: 結算未達 S → 放棄領取，退出重打
    # 規則名稱只說得出「不是 S」，紀錄想知道的是「那到底是幾級」——差一級和
    # 差三級是完全不同的情況。評級字母是大塊的黑色美術字疊在黃綠帶上，對比極大：
    # 正確的那個 1.000，其餘 ≤0.404，餘裕很大。
    #
    # ⚠ region 一定要框住評級那一塊。單一個字母不框的話，畫面別處的深色圖形
    #   也可能比中。這個 region 和上面「結算 S 級」那條是同一塊。
    #
    # C、D 級目前沒有實機畫面所以沒有模板——那種情況會寫「評級：（認不出）」，
    # 只影響紀錄，規則照樣退出重打。之後遇到了再補一張就好。
    template: btn_claim_reward
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5

  # ==================== 領獎次數用盡的處理 ====================
  # 不必讀「2/2」這種數字，畫面本身就說得很清楚：
  #   還有次數　　　　　→ 顯示「每日領獎次數：X/2 ⊕」
  #   次數用盡　　　　　→ 該行變成「今日的領獎次數已用盡」
  #   連購買額度也滿了　→ ⊕ 按鈕直接消失
  # 所以「有沒有 ⊕」就等於「還能不能買」。

  - name: 次數用盡但還能購買 → 開啟購買
    template: btn_add_count
    require: [label_no_count_left]
    max_fires: 3                           # 最多試三次，免得一直空點
    do:
      - tap_match: []
      - wait: 1.5

  - name: 購買彈窗 → 先把數量加到上限
    # 彈窗預設買 1 次，buy_counts 設 2 就先點 + 加到上限再確認。
    #
    # + 一定要用 tap_template 找：彈窗位置會隨「從哪個畫面開啟」上下浮動十幾
    # 像素（從結算頁跳出來的比從詳情頁高約 11px）。
    #
    # max_fires: 1 是必要的——這條和下面「確認購買」的條件相同，不限次數的話
    # 會一直點 + 而永遠輪不到確認。
    template: dialog_purchase_title
    require: [btn_slider_plus]
    when_option: "buy_counts=2"
    max_fires: 1
    do:
      - tap_template: btn_slider_plus
      - wait: 0.4
      - tap_template: btn_slider_plus    # 點兩次確保到頂，到上限後再點無效
      - wait: 0.5

  - name: 購買彈窗 → 確認購買
    # 模板取「彈窗完全顯示」的畫面，不是淡入動畫的中間格——中間格偏白霧，
    # 對穩定狀態只有 0.837 / 0.825，兩個都差門檻一點點而整條落空。
    # ⚠ 系統返回鍵對這個彈窗無效，落空的話兜底救不回來。
    template: dialog_purchase_title
    do:
      - tap_template: btn_purchase_confirm
      - wait: 2.5

  - name: 次數用盡且無法購買 → 收工
    # ⊕ 不見了就代表買不了了，這是最主要的收工條件。
    absent: [btn_add_count]
    require: [label_no_count_left]
    sustain: 3
    when_option: stop_when_no_count
    do:
      - finish:

  - name: 次數用盡且補充無效 → 收工
    # 兜底：⊕ 還在但按了沒用（例如晨星不足）。刻意不比對「已達上限」那個浮動
    # 提示——它疊在副本背景圖上，換副本就可能認不出。改看狀態本身持續多久。
    #
    # 30 秒是算出來的：上面的購買規則 max_fires 3，每次約 6~7 秒（點 ⊕ 1.5s
    # ＋ 彈窗確認 2.5s ＋ 輪詢間隔），三次約 20 秒。購買一旦成功畫面就變、
    # 計時歸零，不會誤觸發。
    template: label_no_count_left
    sustain: 30
    when_option: stop_when_no_count
    do:
      - finish:

  - name: 次數用盡且準備收工 → 不要再去配對
    # 純攔截。上面兩條收工規則都有 sustain（3 秒與 30 秒），而 sustain 沒滿的
    # 規則會讓後面的規則有機會——那幾秒空窗裡「點配對」會搶先進排隊隊列，
    # 收工時人還卡在配對中。
    #
    # ⚠ 必須排在兩條收工規則之後。排前面的話它每輪都成立，收工規則永遠等不到
    #   自己的 sustain。
    #
    # 綁 stop_when_no_count：設定成「次數用完仍要繼續打刷友情點數」時不啟用，
    # 照樣去配對。
    require: [anchor_dungeon_detail, label_no_count_left]
    when_option: stop_when_no_count
    do: []

  # ==================== 主流程 ====================

  # ==================== 難度：能開就開，開不了就退回去打 ====================
  # 新副本開放後，難度是一級一級解鎖的：困難要「普通達到 S 評級」，惡夢還要
  # 「戰力達到 7.2 億」。策略是先把能開的都開完，開不動了才開始領獎——所以
  # 這三條要排在配對規則前面，先處理難度再去打。
  #
  # 遊戲把整個判斷寫在畫面上，規則不必算戰力也不必記狀態：
  #   條件達成 → 淺綠條 ＋ 亮綠「解鎖」鈕（還帶紅點）
  #   條件未達 → 灰條　 ＋ 灰色「未達成啟用條件」
  #
  # 難度頁籤等距 139px（普通 222／困難 360／惡夢 500／煉獄 640），底下兩條的
  # 位移都是這個數字。

  - name: 下一難度可以解鎖 → 按下解鎖
    # 條件全部達成時按鈕才是亮綠的「解鎖」，按下去就換到那一級。
    # 模板只裁按鈕文字，不裁右邊的紅點（解鎖後紅點就沒了）。
    # 實測可解鎖 1.000、其餘畫面 ≤0.68。
    template: btn_unlock
    cooldown: 5
    do:
      # 往上爬了一級，「天花板在哪」要重新判斷。
      - clear_flag: [更高的難度開不了, 已在最高難度]
      - tap_template: btn_unlock
      - wait: 3

  - name: 看看更高的難度能不能開
    # 往「最左邊那個還鎖著的頁籤」的前一格跳，也就是目前看得到的最高難度。
    #
    # ⚠ region 是必要的。配對冷卻中時「配對」按鈕上也有一個鎖頭倒數，不框住
    #   頁籤那一條的話會比中它（實測 detail_cooldown 0.902）。
    # ⚠ require 確認這一頁是「打得了的難度」（解鎖頁沒有「前往副本」那顆），
    #   不會在解鎖頁亂跳。舊副本（月之宮殿）難度全開、沒有鎖，這條在那邊本來
    #   就不成立（tab_lock 0.710）。
    # ⚠ 不要用 btn_match 當 require：配對按鈕上疊著次數徽章，實測只有 **0.85**、
    #   剛好貼在門檻上，而徽章的數字會變（2 → 1 → 0）。anchor_dungeon_detail
    #   沒有徽章，穩定得多。
    # ⚠ 用 cooldown 而不是 max_fires：一輪裡會打好幾場，中途可能剛好把當前難度
    #   打到 S 而讓下一級變成可解鎖。240 秒約是一場的長度。
    template: tab_lock
    require: [anchor_dungeon_detail]
    region: [140, 1180, 580, 80]
    pick: first
    cooldown: 240
    do:
      - tap_match: [-139, 0]
      - wait: 2

  - name: 這一級還開不了 → 退回上一級
    # 上一條跳過去之後，若那一級的條件沒達成（例如戰力不夠），畫面會是灰條
    # 「未達成啟用條件」。往左退一格，回到打得了的難度。
    #
    # ⚠ 錨點用「選中頁籤的淺綠左緣」而不是灰條本身——要點的是頁籤，不是條。
    #   模板刻意不裁文字：難度有四種名稱，裁進去就要四張圖，而我們只想知道
    #   「選中的那格在哪」。
    # ⚠ tab_selected 單獨用會誤中副本列表頁的「副本」頁籤（實測 0.951，那顆
    #   也是淺綠圓角），所以一定要配 require 綁住「這一頁是開不了的難度」。
    template: tab_selected
    require: [label_unlock_blocked]
    region: [140, 1180, 580, 80]
    cooldown: 5
    do:
      # 記下這件事，底下「該不該領獎」要用——結算頁上看不到難度開不開得了。
      - set_flag: 更高的難度開不了
      - tap_match: [-139, 0]
      - wait: 2

  - name: 領獎次數已達上限 → 記住不要再買
    # 點 ⊕ 之後跳出「目前領獎次數已達到上限，無法進行購買」就代表囤到頂了
    # （實測上限是 4：每日 2 次 ＋ 買來的 2 次）。
    #
    # ⚠ 這是唯一看得出「還能不能買」的訊號——⊕ **買滿之後不會消失**，而且點下去
    #   連購買彈窗都不會開，所以沒有彈窗裡的「今日限購」可以讀。
    # ⚠ 只裁「無法進行購買」那半句，前半句會隨原因改寫。
    # 這行浮動提示疊在副本美術上，但實測那條深帶幾乎不透明：來源畫面（赤炎之楔）
    # 1.000、換成月之宮殿仍有 0.986、其餘 113 張樣本最高 0.593。
    template: label_buy_capped
    when_option: "stock_up_before_new_dungeon=true"
    when_flag: ["!次數已經買滿"]
    do:
      - set_flag: 次數已經買滿

  - name: 明天開新副本 → 先把領獎次數買滿
    # 和「次數用盡但還能購買」的差別是**不等次數用盡**：⊕ 在 2/2 的時候就在
    # （實測 0.995）。買到當日額度滿了 ⊕ 就消失，這條自然停下來。
    # 買到的次數今天不會用掉（底下那條不領獎），全部留到明天。
    #
    # ⚠ require 綁詳情頁：結算頁上也有同一顆 ⊕。
    #
    # ⚠ 上限用 max_fires_daily 而不是 max_fires。⊕ **買滿之後不會消失**（只是點
    #   下去不再跳彈窗），所以規則本身分不出「還能買」和「買不了」；而 max_fires
    #   是每輪重置的，同一天重新執行一次就又空點三下。改用跨執行保留的每日上限
    #   之後，今天點過幾次就是幾次，換一天才歸零。
    #   「今天還能買幾次」只寫在購買彈窗裡（今日限購：N/2），詳情頁上看不到
    #   ——符合破例記狀態的判準。
    #   給 3 而不是 2 是留一次重試：多點一下是空點（無害），少點一下就少買一次。
    template: btn_add_count
    require: [anchor_dungeon_detail]
    when_option: "stock_up_before_new_dungeon=true"
    when_flag: [明天開新副本, "!次數已經買滿"]
    max_fires_daily: 3
    do:
      - tap_match: []
      - wait: 1.5

  - name: 副本詳情頁 → 確認副本後配對
    # 排隊中按鈕變成「取消配對」，這條就不成立，自然停在等待狀態。
    #
    # log_text 是為了讓紀錄留下「這次打的是哪個副本、哪個難度」。詳情頁是入場前
    # 最後一個判斷點，也是唯一讀得到這兩個欄位的地方（列表頁的卡片名稱同樣是
    # 美術字，實測讀成「跡鼓 卜被熟 熔的 岩脈」；難度頁籤只存在於詳情頁）。
    #
    # 用 OCR 而不用模板，因為副本與難度是「內容會一直增加」的欄位：用模板每出
    # 一個新副本就要補一張圖，而且只認得補過的，遇到沒見過的會默默漏掉。
    #
    # 兩塊區域的參數是量出來的，不要憑感覺改：
    #   副本 標題是白色美術字描黑邊、疊在場景圖上，直接讀是「月殿·惡歹」，要先
    #        用亮度門檻 210 轉黑字白底再放大 **4** 倍。⚠ 放大 3 倍時「赤炎之楔」
    #        會**穩定讀不到**（五次全空），而「月之宮殿」三次全對——同一份前處理、
    #        圖也乾淨，純粹是 Windows OCR 對某些字在那個尺寸下認不出來。
    #        4 倍之後四張樣本各三次全穩。標題其實是「名稱·難度」，
    #        右半最難讀（會變成一個雜字），用 trim_right 切掉：難度固定兩個字，
    #        「·難度」寬度是常數 193px（容許 185～200）。**錨定文字右端**而不是
    #        寫死右邊界——標題置中，名稱長度一變左右兩端都會移動。
    #   難度 「惡夢副本獎勵」那行是淺底標準字，最好讀，但要放大 4 倍
    #        （x2 讀成「亞本獎勵」），再去掉固定的「副本獎勵」。不從標題或底部
    #        頁籤讀——頁籤選中的那個是深字疊在螢光底上，反而最難讀。
    #
    # 要重調參數時，參考畫面在 samples/ocr/dungeon_detail.png（放子目錄是因為
    # 它不是回歸測試案例，不該被當成沒被引用的樣本清掉）：
    #   python main.py text samples\ocr\dungeon_detail.png 110 174 510 64 \
    #          --binary 210 --scale 3 --trim-right 193      → 月之宮殿
    #   python main.py text samples\ocr\dungeon_detail.png 30 798 170 34 --scale 4
    #                                                       → 惡夢副本獎勵
    template: btn_match
    cooldown: 5
    do:
      # 先讀出這是什麼、再按配對，紀錄的順序才和實際發生的順序一致。
      # 欄位名稱就是紀錄裡的標籤。
      - log_text:
          選擇副本: {region: [110, 174, 510, 64], binary: 210, scale: 4, trim_right: 193}
          難度: {region: [30, 798, 170, 34], scale: 4, strip: 副本獎勵}
      - tap_match: []
      - wait: 3

  - name: 配對冷卻中 → 等待解鎖
    # 取消配對或漏接會被鎖一分鐘，「配對」按鈕變成「🔒 倒數」。純攔截：倒數期間
    # 什麼都不做，時間到按鈕變回「配對」，上面那條自然接手。
    # 模板只取鎖圖示那段，避開會變動的秒數。
    template: btn_match_locked
    do: []

  - name: 配對過久 → 取消後重新配對
    # 半夜人少時可能一直配不到。詳情頁連續停留 5 分鐘還沒進戰鬥就取消重排；
    # 正常配對一兩分鐘就成功，畫面一變計時歸零。
    template: anchor_dungeon_detail
    sustain: 300
    cooldown: 60
    do:
      - log: 已配對 5 分鐘沒有結果
      - tap: [539, 1097]                   # 取消配對（與配對同一顆按鈕的位置）
      - wait: 3

  # ---------- 「現在這一級是不是天花板」----------
  # 領獎次數一天只有兩次，所以要留給**打得動的最高難度**。而該不該領要在結算頁
  # 決定，結算頁上卻只有副本名與難度，看不出「更高的那級開不開得了」——那件事
  # 只寫在詳情頁上。旗標就是為了把它帶過去。
  #
  # 判準是「再打一場 S 有沒有可能讓上一級解鎖」：
  #   這一級還沒拿過 S　→ 那一場 S 會開下一級，獎勵留著（不設旗標）
  #   這一級已經是 S 了 → 再打也開不了，現在就是天花板（設旗標，開始領獎）
  #
  # ⚠ 位置被兩邊夾住。要排在配對那幾條**後面**——不能搶走配對那一輪，也不能
  #   在「配對冷卻中」的畫面上蓋掉那條攔截；配對規則的 cooldown 是 5 秒，這幾條
  #   在那個空檔裡才輪得到，而一輪只需要設一次。
  # ⚠ 但一定要排在「配對中 → 留在原地等待」**前面**：那條純攔截每輪都成立，
  #   排它後面就永遠輪不到。

  - name: 這一級已是 S 而沒有難度等著解鎖 → 已在最高難度
    # 沒有任何頁籤掛著 🔒，代表沒有哪一級在等「打到 S」。實測 🔒 只在「上一級
    # 還沒拿到 S」時出現：赤炎之楔的煉獄在惡夢拿到 S 之後就沒有 🔒 了，儘管它
    # 仍然被戰力擋著（未達成啟用條件）。
    require: [anchor_dungeon_detail, label_detail_rank_s]
    absent: [tab_lock]
    region: [140, 1180, 580, 80]
    when_flag: ["!已在最高難度"]
    cooldown: 60
    do:
      - set_flag: 已在最高難度

  - name: 這一級已是 S 而更高的難度剛確認開不了 → 已在最高難度
    # 上一級掛著 🔒（還在等 S）但整頁是「未達成啟用條件」——代表除了評級之外
    # 還有戰力沒到，那不是今天打得出來的。
    require: [anchor_dungeon_detail, label_detail_rank_s]
    when_flag: [更高的難度開不了, "!已在最高難度"]
    cooldown: 60
    do:
      - set_flag: 已在最高難度

  - name: 已經在最高的難度 → 已在最高難度
    # 煉獄是最右邊那格，上面沒有更高的了，不必看評級。
    # 模板取選中狀態（淺綠底深字），未選中時只有 0.684。
    template: tab_inferno_on
    require: [anchor_dungeon_detail]
    when_flag: ["!已在最高難度"]
    cooldown: 60
    do:
      - set_flag: 已在最高難度

  - name: 配對中 → 留在原地等待
    # 純攔截。排隊時「配對」按鈕變成「取消配對」，上面那條點配對的規則就不成立
    # 了；少了這條會掉到兜底去按返回，變成「進詳情頁 → 被退出 → 又進來」的死
    # 循環。錨點用「前往副本」，因為它配對與否都在。
    template: anchor_dungeon_detail
    do: []

  - name: 明天就開新副本 → 記住今天要囤次數
    # 沒用掉的領獎次數會留到隔天，所以新副本開放的前一天不要把次數花在舊副本上
    # ——留到明天在新副本的最高難度上領，價值高得多。
    #
    # 判斷不必讀數字：倒數掉到 24 小時以內時，「N天」那一段就不見了
    # （「倒數計時：4天17小時12分36秒」→「倒數計時：17小時12分36秒」）。
    # 所以「倒數計時在，而『天』不在」就是明天開。
    #
    # ⚠ 遊戲若改成寫「0天17小時」，這條只是不觸發、行為退回原本的樣子，不會做錯
    #   事。真的跨過 24 小時那天拿一張列表頁來確認就知道。
    # 實測「天」：4天17小時 1.000、13天21小時 0.970、其餘 113 張樣本 ≤0.512。
    require: [label_unlock_countdown]
    absent: [label_countdown_days]
    region: [100, 880, 520, 180]
    when_option: "stock_up_before_new_dungeon=true"
    when_flag: ["!明天開新副本"]
    do:
      - log: 新副本明天開放，今天不領獎，把領獎次數囤到明天
      - set_flag: 明天開新副本

  - name: 副本列表頁 → 選還沒開放那張的上一張
    # 副本會一直新增，要選的永遠是「最新的那個打得了的」——獎勵最好。
    #
    # 不能靠評級標章找它：卡片右上角的標章跟的是**當前選中的難度**，不是這個
    # 副本的最高評級。解鎖了新難度而還沒打過那一級時，標章就變回「暫無評級」，
    # 於是最新的副本整個從腳本的視野裡消失，而紀錄上只看得到它乖乖去打了舊的
    # 那一個，看不出哪裡不對。
    #
    # 改用「還鎖著的那張」當錨點往上一格。列表是舊到新排列、未開放的永遠在最
    # 後面，所以它的上一張就是目前打得了的最新副本，和標章是什麼無關。
    #
    # 卡片間距 352px（實測卡片上緣 129／481／833）。列表整體會上下位移（標題列
    # 的次數徽章會推動它，兩張樣本差 32px），所以一定要用 tap_match 的相對位移，
    # 不能寫死座標。
    #
    # ⚠ pick 用 highest（y 最小 ＝ 最上面那個鎖著的）。同時有兩個以上未開放的
    #   副本時，只有第一個的上一張才是最後一個打得了的。
    # ⚠ region 限在下半部，是為了保證「上一張」還在畫面內：倒數計時落在 y≥500
    #   時，往上 352px 仍在卡片區裡。
    # 模板取「倒數計時：」那幾個固定字，不含會變的數字。實測正確畫面 1.000、
    # 其餘 86 張樣本 ≤0.644。
    template: label_unlock_countdown
    region: [0, 500, 720, 780]
    pick: highest
    cooldown: 5
    do:
      - tap_match: [0, -352]
      - wait: 3

  - name: 副本列表頁 → 選最下面那張副本
    # 沒有倒數計時可當路標時（賽季最後一個已開通，後面還沒排新的）才輪到這條。
    # 要選的永遠是**最下面那一張**——列表是舊到新排列，最新的獎勵最好。
    #
    # ⚠ 錨點是「評級標章」，而每張卡片都有：打過的是「最高評級」、沒打過的是
    #   「暫無評級」。所以兩個模板都要掛，再用 pick_across 跨模板挑最下面的。
    #
    # ⚠ **不可以只挑「暫無評級」的。** 標章跟的是**當前選中難度**，會被腳本
    #   自己的動作改掉：2026-08-31 新副本開放當天，起源之門的普通打到 S、標章
    #   就翻成「最高評級」，於是「最下面那張還沒評級的」改指到最上面的月之宮殿，
    #   腳本掉頭去打舊副本。錨點被規則自己的動作改動，這是同一個標章坑的第三個現場。
    #
    # ⚠ **不可以有 sustain。** 曾經掛過 `sustain: 2` 想多一道保險，結果第一輪
    #   就被當時排在後面的另一條無 sustain 的規則搶走。sustain 沒滿的規則會讓
    #   後面的規則有機會執行。
    #
    # ⚠ 一定要排在倒數那條後面：倒數卡片上也掛著「暫無評級」，靠門檻擋不掉
    #   （實測 0.942），只能靠上一條每輪都先成立並換頁來壓住。
    #
    # 位移取兩種標章的折衷：最高評級的中心在 (650, 卡片上緣+7)、暫無評級在
    # (661, +6)，差 11px，而卡片有 690px 寬、300px 高，落點都在卡片中央附近。
    template: [label_max_rank_text, label_no_rank_text]
    pick: lowest
    pick_across: true
    cooldown: 5
    do:
      - tap_match: [-296, 138]
      - wait: 3

  - name: 筆記頁 → 進入日常副本
    template: card_daily_dungeon           # 藍色漩渦，無文字，語系無關
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 其他頁面 → 點筆記
    template: nav_note
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 討伐結算頁 → 點掉繼續
    # 這是**公會討伐**的結算頁，不是副本的。副本腳本要管它，是因為討伐腳本在
    # 加入戰鬥後就收工，遊戲會留在戰鬥畫面，打完變成這張結算頁一直停著——隔天
    # 早上自動副本啟動時看到的就是它。
    #
    # ⚠ 這張頁系統返回鍵無效，只能點空白處。少了這條，副本腳本會一路掉到
    #   「完全無法辨識 → 按系統返回鍵」而卡住。
    # 點掉之後會回到討伐頁，那頁有返回鍵，「誤入次要頁面」就能逐層退回家園。
    template: label_raid_result
    do:
      - tap: [360, 900]
      - wait: 2

  # 底下幾條純攔截把「副本內」拆成看得懂的狀態，行為完全相同（都是 do: []），
  # 唯一目的是紀錄看得懂：卡住時一眼知道卡在哪個階段。
  #
  # ⚠ 細節狀態要排在通用的「戰鬥中」前面，否則齒輪先中，就永遠只顯示「戰鬥中」。

  - name: BOSS 房戰鬥中
    # 和「戰鬥中」是同一件事，分兩條是因為 region 是規則級的，沒辦法只套在其中
    # 一個模板上（齒輪在左側 y≈835，回合條在頂端）。
    #
    # 為什麼需要它：BOSS 房背景是整片明亮的主題色（冰藍、紅），而齒輪是半透明
    # 的，疊上去只有 0.800～0.813，對門檻 0.78 只剩 0.02 餘裕。「回合：N/M」是
    # 深色膠囊上的白字、完全不透明，BOSS 房 1.000。一般關卡沒有回合條，
    # 所以它是加固而不是取代。
    #
    # 只拿它當「在戰鬥畫面」的錨點，不要解讀那個數字——那是每個玩家自己入場後
    # 的計數，不是全場統一的。
    #
    # region 是必要的：不限範圍時副本詳情頁 0.726、列表頁 0.718，餘裕只剩 0.05，
    # 而純攔截在詳情頁誤中會擋住「點配對」。限定頂端後有回合條最低 0.964、
    # 沒有的最高 0.445。這裡用 region 是安全的——回合條在畫面最頂端，上方沒有
    # 任何內容可以把它推移（被上方文字推走正是 region 失效最常見的原因）。
    template: label_round
    region: [230, 12, 270, 56]
    do: []

  - name: 載入中 → 等畫面切換
    # 副本內每進下一關都會經過一張全螢幕「載入中……」，齒輪與房間地圖都不在
    # （0.316 / 0.261），所以「戰鬥中」那條會落空。
    #
    # 三個模板是同一段文字的三個彈跳位相：「載入中」整串會次像素級上下彈跳，
    # 單一模板的分數在 0.601～1.000 之間跳（門檻 0.85 一半會落空）。三張之後
    # 載入畫面最低 0.893、非載入畫面最高 0.649。
    #
    # 裁的是「入中」兩個字，避開左邊奔跑的角色與右邊會一顆顆增加的「……」。
    # 這張畫面全遊戲共用，raid.yaml 也掛了同一條。
    template: [label_loading, label_loading_b, label_loading_c]
    do: []

  # ==================== 遊戲冷啟動 ====================
  # 從關閉狀態啟動遊戲要 **108 秒**才進得到家園，而這整段畫面上沒有任何主流程元素
  # （導覽列、返回鍵、戰鬥齒輪全都比不到 0.63）。少了下面兩條攔截，「完全無法辨識」
  # 會在開機途中按下系統返回鍵，而且每 30 秒再按一次。
  #
  # 實測的時間軸：
  #   0～35 秒　　全黑。無法用模板判斷，但這段撐得過去——`_ensure_app` 啟動遊戲後
  #               會先睡 8 秒，而兜底要連續 45 秒才動作，中間攔截就接手了。
  #   35～42 秒　 LT GAMES 開場 logo
  #   44～103 秒　標題畫面「正在載入更新檔」→「正在初始化」← 最長的一段
  #   105～109 秒 轉場。1～3 秒的空窗只會讓兜底的計時歸零，正是我們要的。
  #   109 秒～　　公告（有左下返回鍵，交給「誤入次要頁面」關掉）
  #
  # 「檢查網路」是標題畫面唯一穩定的 UI 元件——進度條會動、底下的字會換、背景還有
  # 粒子動畫，只有右上角那顆按鈕不變。實測標題畫面 0.947～1.000、遊戲內 59 張樣本
  # 最高 0.427。
  #
  # 這兩條對「更新檔要下載很久」的日子特別重要：標題畫面會停留多久完全不可預測，
  # 有攔截就能無限等下去。

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    # 在別的裝置（手機、另一台模擬器）登入同一個帳號時，這邊會被踢出並跳出這個
    # 對話框。**不按確定就永遠停在這裡**，和「點擊任意處開始遊戲」是同一類死結。
    #
    # ⚠ 兜底完全接不住它：這張畫面上 btn_back_arrow 只有 0.487、nav_home 0.482，
    #   所以會一路掉到「完全無法辨識」去按系統返回鍵——而 modal 對話框對系統返回鍵
    #   通常無效（購買彈窗那次就是這樣空按了十幾分鐘）。
    #
    # 模板只取訊息那行字。「確認」標題和「確定」按鈕都是遊戲共用的元件，拿它們當
    # 模板會認到別的對話框；訊息文字才是這個狀況獨有的。
    #
    # 按下確定後會回到標題畫面，接著由「標題畫面 → 點擊開始遊戲」接手完成登入，
    # 所以這裡不必自己做登入流程。
    #
    # 確定鈕用既有的 btn_confirm（實測 0.982），tap_template 當場找，不寫死座標。
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    # 開機後會自動彈出全螢幕公告。順手勾「今日不再提醒」再關掉，當天就不會再跳。
    # ⚠ 這是四份腳本共用的開機規則，說明只在這裡寫一份。
    #
    # ⚠ 必須排在「誤入次要頁面」前面：那條看到返回鍵（這頁 1.00）就會直接關掉，
    #   勾選的機會就沒了。
    #
    # 模板把圓圈和文字一起裁進來（公告頁 1.00、其他 63 張樣本最高 0.58）。
    # 這樣勾選之後圓圈變了、分數就掉下去——剛好防止規則再次觸發而把勾選取消掉。
    # 動作也在同一輪就把頁面關掉，不留機會。
    #
    # 偏移是量出來的：模板中心 (362, 1128)、圓圈中心 (289, 1127)，所以 -73。
    # 規則有 template 守著畫面是什麼，用固定偏移是安全的。
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    # 載入完成後會停在「點擊任意處開始遊戲」，**不點就永遠不會前進**——這是冷啟動
    # 唯一會卡死的畫面，兜底也接不住（btn_back_arrow 只有 0.58）。
    #
    # 錨點用右側選單的「修復用戶端」那顆按鈕，不用底下那行字：那行有流光動畫，
    # 分數在 0.71～0.98 之間週期跳動（92 張裡 46 張低於門檻，補第二個位相仍有 30 張
    # 落空——連續掃光用離散位相補不完）。選單是靜態 UI，實測 0.93～1.00，
    # 而載入中的標題畫面沒有這個選單。那行字仍掛第二個模板當備援。
    #
    # sustain 3 是為了跳過「公告正在淡入」那一兩幀（那時選單還看得見，0.91）。
    # 這張畫面會一直停著，多等 3 秒沒有代價。
    #
    # 點固定座標是安全的：畫面上就寫著「點擊任意處」，而 (360, 900) 是角色與文字條
    # 之間的空地，右側選單在 x>600 不會誤觸。
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  - name: 選擇房間中 → 等投票結果
    # 每打完一關會出現「副本房間地圖」，投票選下一間，9 秒後自動前進。
    # 不必操作，但這是副本內停留時間第二長的階段，值得有自己的狀態名稱。
    template: label_room_map
    do: []

  - name: 準備中 → 等倒數結束
    # 開打前的「戰鬥準備倒數計時：N 秒」，模板取那行字並避開會變的秒數。
    #
    # 不必去點那顆「準備」按鈕：畫面自己寫著「若無任何操作，則 4 秒後自動確認
    # 準備就緒」，而腳本也已經開了遊戲內的自動準備。點下去最多省 4 秒
    # （一場副本約 5 分半），卻多一個不必要的動作。
    #
    # 橫幅是半透明疊在關卡背景上的，所以多驗了幾張：三個不同準備階段共 5 張都
    # 在 0.995～1.000，其他畫面 ≤0.458。
    template: label_battle_prepare
    do: []

  - name: 戰鬥中
    # 通用的兜底狀態：副本內看得到左側齒輪就算在戰鬥中，上面幾條沒認出來的階段
    # （打鬥中、修整室）都落到這裡。
    #
    # threshold 0.78 是量出來的：齒輪半透明、疊在會動的戰鬥特效上，132 張戰鬥幀
    # 只在 0.863～0.913 之間跳動，準備階段 0.792，明亮的 BOSS 房 0.800～0.813
    # ——預設 0.85 會有一大部分落空，狀態就在「戰鬥中 ↔ 等待畫面變化」之間來回。
    # 非戰鬥畫面的齒輪 ≤0.63，放寬到 0.78 仍有足夠餘裕。
    #
    # ⚠ 齒輪不是萬能的：紫色主題的關卡上只有 0.727，而那種關卡**沒有回合條**
    #   （0.569），兩個都認不到就整張畫面沒人認得。戰鬥中的評級徽章不透明、
    #   位置固定，同一張畫面上是 0.998，所以一起掛上當第三個錨點。
    #   （四個等級都要列：戰鬥中最高只到 A，達到 S 那一刻就跳結算頁了。）
    #
    # 規則名稱刻意只寫狀態，等待訊息取的就是「→」前面那段。
    template: [btn_settings_gear, rank_live_d, rank_live_c, rank_live_b,
               rank_live_a]
    threshold: 0.78
    do: []

  # ==================== 兜底：三層 ====================
  # 走到這裡代表卡在流程外的畫面，由淺入深試三種脫困方式。
  #
  # ⚠ 三條都要設 sustain。畫面轉場（載入中、配對動畫、結算動畫）那一兩秒所有
  #   主流程規則都會暫時落空，兜底若立刻動作就會把正常流程打斷。

  - name: 觀戰確認框 → 確定退出
    # 「要退出觀戰狀態嗎?」——按了系統返回鍵之後跳出來的。
    #
    # ⚠ 少了這條會死循環：兜底按返回鍵 → 叫出這個框 → 認不得 → 再按返回鍵 →
    #   框關掉又開起來。實測有使用者卡在這裡 17 分鐘、空按 26 次返回鍵。
    #   modal 對話框對系統返回鍵通常無效或反效果，一定要各自認得。
    #
    # 模板取訊息那行字（其餘樣本 ≤0.549），確定鍵用既有的 btn_confirm（1.000）。
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 點擊空白處關閉的頁面 → 點掉
    # 遊戲有好幾張「返回鍵無效、只能點空白處」的結算頁（挑戰賽戰鬥結束、
    # 公會討伐結算…）。它們共用底部那行「點擊空白處關閉」，用它一併接住，
    # 不必為每一張各裁一個模板。
    #
    # ⚠ 排在兜底前面。少了這條會一路掉到「完全無法辨識」去空按返回鍵——而返回鍵
    #   對這類頁面沒有作用，還可能叫出別的確認框。
    template: label_tap_blank_close
    cooldown: 3
    do:
      - tap: [360, 640]
      - wait: 2

  - name: 誤入次要頁面 → 點返回退出
    # 接住「沒有底部導覽列、只有左下角返回鍵」的頁面——也就是誤點進去的任何子頁面。
    # 主流程的畫面（詳情頁、結算頁、列表頁）也都有返回鍵，但那些規則排在前面。
    template: btn_back_arrow
    sustain: 4
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 卡在未知畫面 → 回家園重來
    template: nav_home
    sustain: 5
    cooldown: 30
    do:
      - screenshot:
      - tap_match: []
      - wait: 3

  - name: 完全無法辨識 → 按系統返回鍵
    # 連導覽列、返回鍵、戰鬥齒輪都找不到（例如全螢幕公告）。把齒輪列進來很重要，
    # 否則戰鬥中會誤觸發而中斷戰鬥。
    #
    # sustain 要放得很寬：副本內有好幾個畫面既沒有導覽列也沒有返回鍵（載入中的
    # 黑畫面、選房間、準備倒數），那些都是正常流程，誤按返回會毀掉一場副本。
    #
    # ⚠ 開機畫面的三個模板也要列進來。sustain 是**累加**的：兜底的條件（這些模板
    #   全都不在）在整段開機期間一直成立，上面的攔截規則只是「排在前面所以先被
    #   回傳」，並沒有讓它的計時歸零。所以到了開機第 105 秒那個 3 秒轉場空窗，
    #   它累積的 97 秒早就超過 45 秒而按下返回鍵。把開機畫面列進 absent，
    #   條件才會在那些畫面上變成 false 而真正歸零。
    #   （這三個在遊戲內 59 張樣本上最高只有 0.53，不會擋到真正該脫困的情況。）
    #
    # ⚠ 戰鬥中的評級徽章也要列進來。齒輪是半透明的，背景是紫色主題的關卡只有
    #   0.727（低於門檻 0.78），而那一關又沒有回合條（0.569）——兩個都認不到，
    #   於是戰鬥中誤觸發按下返回鍵。徽章在同一張畫面上是 0.998，而非戰鬥畫面
    #   最高 0.377，餘裕足夠。四個等級都要列（戰鬥中最高只到 A，不會出現 S）。
    absent: [nav_home, btn_back_arrow, btn_settings_gear, label_round,
             rank_live_d, rank_live_c, rank_live_b, rank_live_a,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 5          # 按這麼多次還脫不了困，就交給下一條重開遊戲
    cooldown: 30
    do:
      - screenshot:
      - back:
      - wait: 2

  - name: 一直脫不了困 → 重開遊戲
    # 兜底按了 5 次系統返回鍵還是認不出畫面。返回鍵解決不了兩種狀況：**對它無效
    # 的結算頁**（只能點空白處），以及**按下去反而會叫出確認框**的頁面——後者會
    # 變成開開關關的死循環。重開遊戲讓畫面回到「開機 → 家園」這條認得的路。
    #
    # ⚠ absent 要和上面那條**完全一樣**。少列任何一個，這條就會在那個畫面上誤
    #   觸發，而重開遊戲要 152 秒。
    # ⚠ 上面那條一定要有 max_fires，否則它每輪都成立、永遠輪不到這裡。
    absent: [nav_home, btn_back_arrow, btn_settings_gear, label_round,
             rank_live_d, rank_live_c, rank_live_b, rank_live_a,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 3      # 重開這麼多次還是認不出來，就別再重開了（見下一條）
    do:
      - restart_app: 45

  - name: 重開遊戲也救不回來 → 收工
    # 最後的保險絲。重開三次還是認不出畫面，代表遇到的東西不是「重開就會好」的
    # ——再重開下去只會每半分鐘關開遊戲一次，直到有人來看。
    #
    # ⚠ 這條非有不可。實測 2026-08-25：領獎確認框的文字被遊戲改掉，模板比不中而
    #   落到兜底，接著**每 30 秒重開一次遊戲，從 08:03 跑到 12:17**，
    #   足足 4 小時 14 分，而且是使用者自己按停止才停的——
    #   而重開那條當時沒有 max_fires，所以永遠輪不到任何人喊停。
    #
    # ⚠ 收工比空轉好：這一輪讓出去，排程會照常跑下一個腳本，下一個排定時刻也會
    #   重新開始。截圖留著當補模板的來源。
    absent: [nav_home, btn_back_arrow, btn_settings_gear, label_round,
             rank_live_d, rank_live_c, rank_live_b, rank_live_a,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    do:
      - log: 重開遊戲三次仍然認不出畫面，這一輪先收工
      - screenshot: stuck_after_restart
      - finish:

