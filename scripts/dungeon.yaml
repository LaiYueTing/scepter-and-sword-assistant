# 自動副本
#
# 流程：筆記頁 → 日常副本 → 副本列表 → 詳情頁 → 配對 → 戰鬥 → 結算（S 級領獎）
#      → 領獎次數用盡就結束本輪 → 逐層退回家園
#
# 引擎每輪擷取一張畫面，由上而下檢查規則，執行第一條成立的，所以順序就是優先度：
#   限時操作 > 自動模式 > 結算 > 購買次數 > 詳情頁 > 列表頁 > 筆記頁 > 後備規則
#
# 需要等待的狀態（配對中、戰鬥中、準備倒數、選房間）只用攔截規則（do: []）：
# 沒有規則要動作，引擎就停在原地等待。
#
# 六份腳本共通的約束與共用規則（開機、公告、帳號衝突、後備規則）只在這份寫說明，
# 其他腳本指回這裡：
#   - 用 tap_match 而且會換頁的規則一定要設 cooldown。tap_match 點的是觸發當輪
#     畫面裡的座標，換頁需要一兩秒；沒有 cooldown 會把舊座標點在新畫面上。
#     唯一例外是限時操作（漏接的代價比誤點大）。
#   - 攔截規則不能設 cooldown，必須每輪都成立才擋得住後備規則。
#
# 規則欄位與動作見 README。

name: 自動副本
package: com.m88.idleXX

# 戰鬥最長 650 秒，再加上配對排隊，畫面靜止的脫困門檻要大於這段時間。
stuck_timeout: 900

# 結束程序：逐層退回家園待命，讓下一輪或手動操作從已知畫面開始。
# 副本詳情頁按一次返回只到副本列表頁，那頁沒有底部導覽列，要再退到筆記頁才點得到
# 家園，所以每一步先試著點家園，找不到才點返回鍵。
on_finish:
  # ⚠ 每一步 tap_template 前面都要 wait_for。結束程序是無條件執行的清單，而 finish
  #   常落在換頁途中，不等畫面穩定就會空點。wait_for 認得出畫面就立刻往下走，上限
  #   25 秒。最後一步只是確認已在家園，不必再等。
  - log: 本輪結束，返回家園待命
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: nav_home
  - wait: 2

# 等待時附在狀態列與任務卡後面的即時資訊，只影響顯示，不影響判斷。
#
# 戰鬥畫面右上角的評級徽章會隨戰鬥進度往上升（D → C → B → A）。最高只會顯示到 A：
# 達到 S 的當下就直接跳到結算頁，最後的評級由結算規則的 log_match 寫進紀錄。
#
# ⚠ region 高 110px：BOSS 血條會把徽章往下推約 70px（一般關卡 y≈196、BOSS 房 y≈265）。
# ⚠ 模板只裁字母、不裁牌子。牌子形狀每一級相同，裁進去會變成比對牌子（A 模板在
#   D 畫面上 0.757，只留字母後 0.477）。第一名與第二名最少差 0.383。
# ⚠ 門檻 0.80：牌子半透明，同一個 D 量到 1.000 與 0.977；非戰鬥畫面最高 0.377。
status:
  評級:
    region: [645, 185, 75, 110]
    threshold: 0.80
    of: {A: rank_live_a, B: rank_live_b, C: rank_live_c, D: rank_live_d}

rules:
  # ==================== 限時操作：最高優先 ====================
  # 配對成功後只有 20 秒可以按「接受」，錯過就得重新排隊。

  - name: 配對湊了 NPC 夥伴 → 拒絕，等真人隊伍
    # 配對自動補 NPC 夥伴時拒絕。遊戲提示「如果拒絕，本次將不視為故意取消配對」，
    # 拒絕不會被鎖一分鐘。預設不啟用（accept_with_partners: true）：人少的時段
    # 幾乎湊不到全真人隊伍，拒絕會一直重新配對。
    # ⚠ 用那兩行紅字判斷：「拒絕」按鈕在沒有夥伴的配對畫面也在（0.975）。
    template: label_partners_added
    when_option: "!accept_with_partners"
    do:
      - tap_template: btn_reject
      - wait: 3

  - name: 配對成功 → 接受
    # ⚠ region 要同時涵蓋兩種版面：補了 NPC 夥伴時多兩行紅字，「接受」往下推 75px
    #   （y 1082 → 1157）。region 貼齊邊界時全畫面 0.974、限定範圍只有 0.369。
    # ⚠ 不設 cooldown：限時操作。按下後對話框留著等其他玩家，第二次點的是同一顆
    #   已按過的按鈕，沒有副作用。
    template: btn_accept
    region: [360, 1030, 360, 200]
    do:
      - tap_match: []
      - wait: 3

  # ==================== 戰鬥中的自動模式 ====================
  # 準備階段（4 秒自動確認）與選房間（9 秒自動前進）都不必操作，
  # 唯一要做的是確保遊戲內的「自動模式」開著。

  - name: 自動模式面板 → 補開自動準備
    # ⚠ 錨點用「自動準備」這一行，不用面板標題：標題會隨狀態改變
    #   （「自動模式」→「已開啟自動模式……」）。
    require: [label_auto_prepare]
    absent: [toggle_auto_prepare_on]
    region: [400, 500, 230, 46]           # 只看「自動準備」那一行
    when_option: auto_battle_mode
    do:
      - tap: [511, 524]
      - wait: 0.8

  - name: 自動模式面板 → 補開自動治療
    require: [label_auto_prepare]
    absent: [toggle_auto_heal_on]
    region: [400, 554, 230, 46]           # 只看「自動治療」那一行
    when_option: auto_battle_mode
    do:
      - tap: [511, 578]
      - wait: 0.8

  - name: 自動模式面板 → 啟動
    template: btn_start_auto
    when_option: auto_battle_mode
    cooldown: 4
    do:
      - tap_match: []
      - wait: 1.5

  - name: 自動模式面板已在執行 → 關閉面板
    # 面板開著但沒有「開啟自動模式」按鈕，代表已經在執行，關掉面板即可。
    # ⚠ 要設 cooldown：按下返回到面板收起需要一兩秒，期間會重複觸發。
    require: [label_auto_prepare]
    absent: [btn_start_auto]
    when_option: auto_battle_mode
    cooldown: 3
    do:
      - back:
      - wait: 1

  - name: 自動模式被中斷 → 重新開啟
    template: label_auto_stopped
    when_option: auto_battle_mode
    do:
      - tap: [46, 838]                    # 左側齒輪
      - wait: 1.5

  - name: 戰鬥中但自動模式沒開 → 點齒輪開面板
    # 打開自動模式面板，之後由上面幾條接手（有「開啟自動模式」就按，沒有就關面板）。
    # ⚠ 錨點只能用回合條：齒輪在 BOSS 房 0.742～0.810（中位 0.777），40 次取樣有
    #   25 次低於門檻 0.78，sustain 累積不滿；回合條同期 0.940～1.000。
    # ⚠ 齒輪用固定座標點：tap_template 固定使用 runtime.threshold（0.85），齒輪只有
    #   0.81；tap_match 點到的是回合條。
    # ⚠ 選房間階段沒有回合條（0.491），所以不會在那裡開面板。
    template: label_round
    when_option: auto_battle_mode
    sustain: 20
    max_fires: 1
    do:
      - tap: [46, 838]         # 左側齒輪
      - wait: 1.5

  # ⚠ 不要加「定期開面板確認自動模式」的規則：在選房間、準備階段開面板會讓兩層 UI
  #   重疊，齒輪與面板都認不出來，被判成無法辨識而按返回，整場副本中斷。上面那條
  #   只開一次，而且錨點在選房間階段不成立。

  # ==================== 結算處理 ====================
  # S 級規則排在前面，所以後面的規則成立時必定代表「在結算頁但不是 S」。
  # rank_s 在 S 頁 0.999、A 頁 0.386。

  - name: 退出確認對話框 → 確定退出
    # 評級未達 S 而退出結算頁時，遊戲會問「尚未領取日常副本獎勵，確定要退出？」。
    # ⚠ 系統返回鍵對這個對話框無效。和領獎確認框互相只有 0.39；確定鍵是同一個模板。
    template: label_exit_confirm
    do:
      - tap_template: btn_confirm
      - wait: 2.5

  - name: 領獎確認對話框 → 點確定
    # 點「領取獎勵」後會先跳確認框，按確定才真的領到。
    # ⚠ 要排在結算規則前面，否則會記一次完成卻沒領到獎勵。
    # ⚠ 三個模板對應遊戲用過的三種文字（其他玩家的客戶端不一定同時更新）：
    #   「要消耗領獎次數，領取本次副本獎勵嗎?」（_old）
    #   「領取本次副本獎勵需消耗當日領獎次數，是否領取?」
    #   「要消耗N次領獎次數，領取N次本次副本獎勵嗎?」（_x2）
    # ⚠ 數字不能裁進模板。_x2 只取「本次副本獎勵」：N=1 與 N=2 各 0.986／1.000，
    #   兩種舊文字 0.90，退出確認框 0.740（那條排在前面，自己是 1.000）。
    template: [label_claim_confirm, label_claim_confirm_old, label_claim_confirm_x2]
    do:
      - tap_template: btn_confirm
      - wait: 2.5
      - count:

  - name: 獎勵已領取 → 離開結算頁
    # 領完後按鈕變成灰色「已領取」而評級 S 還在。「已領取」對「領取獎勵」模板 0.54。
    template: btn_claimed
    do:
      - tap: [75, 1219]
      - wait: 2.5

  - name: 結算頁 → 幫隊友按讚
    # 要在領獎前做，領完畫面就換掉了。按過的讚模板找不到，不會重複點。
    template: btn_like
    when_option: like_teammates
    do:
      - tap_all: btn_like
      - wait: 1

  - name: 結算頁次數已用盡 → 不領獎直接退出
    # 領獎次數用盡時，結算頁右下的按鈕變成灰色「領獎次數已用盡」。
    # ⚠ 必須排在「結算 S 級 → 領取獎勵」前面，否則 S 級時會一直點這顆無效的按鈕。
    # ⚠ region 是必要的：詳情頁的「今日的領獎次數已用盡」全畫面比對 0.857。
    #   框住按鈕後結算頁 1.000、詳情頁 0.035。
    template: btn_count_used_up
    region: [360, 1185, 330, 66]
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5
      - count:

  - name: 明天開放新副本 → 今天不領獎，打完這一場就結束本輪
    # 次數已在詳情頁買滿，這一場不領獎，次數留到明天的新副本。
    # ⚠ 退出前要自己按掉「尚未領取日常副本獎勵，確定要退出副本嗎?」：這條緊接著
    #   finish，引擎不會再有下一輪讓「退出確認對話框」那條接手，而結束程序只找家園
    #   與返回鍵，對這個對話框無效。
    template: btn_claim_reward
    when_option: "stock_up_before_new_dungeon=true"
    when_flag: [明天開新副本]
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait_for: label_exit_confirm
      - tap_template: btn_confirm
      - wait: 2.5
      - count:
      - finish:

  - name: 結算 S 級 → 領取獎勵
    # 旗標「已在最高難度」由詳情頁的三條規則設定（見「這一級是不是最高難度」那段）。
    # 還有難度能解鎖時，S 是拿來解鎖下一級的，領獎次數留給打得動的最高難度。
    template: rank_s
    region: [270, 140, 200, 220]
    when_option: claim_reward
    when_flag: [已在最高難度]
    do:
      - tally: 領取副本獎勵
      - tap: [520, 1217]
      - wait: 2

  - name: 還能解鎖更高的難度 → 拿到 S 也先不領獎
    # 這一場的 S 會開放下一級，退回詳情頁後由「下一難度可以解鎖」接手。
    template: rank_s
    region: [270, 140, 200, 220]
    when_option: claim_reward
    when_flag: ["!已在最高難度"]
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5

  - name: 設定為不領獎 → 直接退出
    # claim_reward 關閉時：打完就退出、不消耗領獎次數，可以一直打。
    template: btn_claim_reward
    when_option: "!claim_reward"
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5
      - count:

  - name: 結算未達 S → 放棄領取，退出重打
    # 評級寫進紀錄：正確的字母 1.000、其餘 ≤0.404。C、D 級沒有模板，紀錄寫
    # 「（認不出）」，不影響動作。
    # ⚠ region 要框住評級那一塊，單一字母不框住會比對到畫面上別的深色圖形。
    # ⚠ max_fires 是「打幾場拿不到 S 就改領 A」的計數（claim_rank_a_after）。
    #   用完後由下面兩條接手；0 表示不限。計數每輪歸零。
    template: btn_claim_reward
    max_fires: "${claim_rank_a_after:0}"
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5

  - name: 打了幾場都拿不到 S → A 也領獎
    # 只有上一條的 max_fires 用完才會輪到。條件與「結算 S 級 → 領取獎勵」相同：
    # 開著領獎、而且已在最高難度。確認框與計次由「領獎確認對話框」那條處理。
    # ⚠ require 不能拿掉：條件必須是上一條的子集，否則認不出「領取獎勵」按鈕的畫面
    #   會略過計數直接領 A。
    template: rank_a
    region: [270, 140, 200, 220]
    require: [btn_claim_reward]
    when_option: claim_reward
    when_flag: [已在最高難度]
    do:
      - tally: 領取副本獎勵
      - tap: [520, 1217]
      - wait: 2

  - name: 打了幾場都拿不到 S 但這場連 A 都不到 → 退出重打
    # 上上一條的 max_fires 用完之後，B 以下仍要退出重打，否則會停在結算頁。
    template: btn_claim_reward
    do:
      - log_match:
          評級: {region: [270, 140, 200, 220], of: {S: rank_s, A: rank_a, B: rank_b}}
      - tap: [75, 1219]
      - wait: 2.5

  # ==================== 領獎次數用盡 ====================
  # 次數狀態由畫面判斷，不讀數字：
  #   還有次數 → 「每日領獎次數：X/2 ⊕」
  #   次數用盡 → 該行變成「今日的領獎次數已用盡」
  # ⊕ 在購買額度用完後仍然存在，只是點下去不會開購買對話框。

  - name: 次數用盡但還能購買 → 開啟購買
    template: btn_add_count
    require: [label_no_count_left]
    max_fires: 3                           # 最多試三次，避免一直空點
    do:
      - tap_match: []
      - wait: 1.5

  - name: 購買對話框 → 先把數量加到上限
    # 對話框預設買 1 次，buy_counts 設 2 時先按 + 加到上限再確認。
    # ⚠ + 要用 tap_template 找：對話框位置隨開啟的畫面不同而上下差約 11px。
    # ⚠ max_fires: 1 是必要的：條件與「確認購買」相同，不限次數會一直點 +。
    template: dialog_purchase_title
    require: [btn_slider_plus]
    when_option: "buy_counts=2"
    max_fires: 1
    do:
      - tap_template: btn_slider_plus
      - wait: 0.4
      - tap_template: btn_slider_plus    # 點兩次確保到頂，到上限後再點無效
      - wait: 0.5

  - name: 購買對話框 → 確認購買
    # 模板取對話框完全顯示後的畫面；淡入中的畫面只有 0.837／0.825。
    # ⚠ 系統返回鍵對這個對話框無效。
    template: dialog_purchase_title
    do:
      - tap_template: btn_purchase_confirm
      - wait: 2.5

  - name: 次數用盡且無法購買 → 結束本輪
    # ⊕ 不在就代表買不了，這是主要的結束條件。
    absent: [btn_add_count]
    require: [label_no_count_left]
    sustain: 3
    when_option: stop_when_no_count
    do:
      - finish:

  - name: 次數用盡且補充無效 → 結束本輪
    # ⊕ 還在但購買沒有效果（晨星不足、已達上限）時，用持續時間判斷。
    # 30 秒：購買規則最多三次、每次約 6～7 秒。購買成功畫面就會改變，計時歸零。
    template: label_no_count_left
    sustain: 30
    when_option: stop_when_no_count
    do:
      - finish:

  - name: 次數用盡且準備結束 → 不再進入配對
    # 攔截規則。上面兩條結束規則有 sustain，累積期間要擋住「點配對」，否則結束時
    # 角色還在配對隊列中。
    # ⚠ 必須排在兩條結束規則後面，排前面的話它每輪都成立，結束規則永遠輪不到。
    # 綁 stop_when_no_count：設定為「次數用完仍繼續打」時照常配對。
    require: [anchor_dungeon_detail, label_no_count_left]
    when_option: stop_when_no_count
    do: []

  # ==================== 難度：能開就開，開不了就退回去打 ====================
  # 新副本的難度一級一級解鎖：困難要普通達到 S，惡夢還要戰力門檻。策略是先把能開的
  # 都開完再領獎，所以這幾條排在配對前面。
  #
  # 畫面直接顯示能不能解鎖：
  #   條件達成 → 淺綠條 ＋ 亮綠「解鎖」鈕（帶紅點）
  #   條件未達 → 灰條　 ＋ 灰色「未達成啟用條件」
  #
  # 難度頁籤等距 139px（普通 222／困難 360／惡夢 500／煉獄 640），選中頁籤模板的
  # 中心在普通格是 x≈168。

  - name: 下一難度可以解鎖 → 按下解鎖
    # 模板只裁按鈕文字，不裁紅點（解鎖後紅點消失）。可解鎖 1.000、其餘 ≤0.68。
    template: btn_unlock
    cooldown: 5
    do:
      # 往上一級之後要重新判斷最高難度。
      - clear_flag: [更高的難度開不了, 已在最高難度]
      - tap_template: btn_unlock
      - wait: 3

  - name: 看看更高的難度能不能開
    # 跳到「最左邊那個鎖著的頁籤」的前一格，也就是目前看得到的最高難度。
    # ⚠ region 要框住頁籤列：配對冷卻中的「配對」按鈕也有鎖頭（detail_cooldown 0.902）。
    # ⚠ require 用「前往副本」：解鎖頁沒有這顆。不要用 btn_match，它疊著會變的次數
    #   徽章，分數只有 0.85。
    # ⚠ 用 cooldown 不用 max_fires：一輪會打好幾場，中途可能把當前難度打到 S 而開放
    #   下一級。240 秒約是一場的時間。
    template: tab_lock
    require: [anchor_dungeon_detail]
    region: [140, 1180, 580, 80]
    pick: first
    cooldown: 240
    do:
      - tap_match: [-139, 0]
      - wait: 2

  - name: 連普通難度都無法開啟 → 今天先不打，結束本輪
    # 新副本的普通也有等級／戰力條件。選中的是普通時沒有上一級可退，往左 139px 會
    # 點到左下角的返回鍵。沒用掉的領獎次數會留到隔天。
    # ⚠ 必須排在「退回上一級」前面；region 只框普通那一格（困難的中心在 304）。
    template: tab_selected
    require: [label_unlock_blocked]
    region: [140, 1180, 80, 80]
    do:
      - finish:

  - name: 這一級還開不了 → 退回上一級
    # 跳到的難度條件未達（灰條「未達成啟用條件」）時，往左退一格。
    # ⚠ 錨點用選中頁籤的淺綠左緣，不裁文字（四種難度名稱就要四張圖）。
    # ⚠ tab_selected 單獨使用會比對到副本列表頁的「副本」頁籤（0.951），一定要用
    #   require 綁住「這一頁是開不了的難度」。
    template: tab_selected
    require: [label_unlock_blocked]
    region: [140, 1180, 580, 80]
    cooldown: 5
    do:
      # 結算頁看不出更高難度開不開得了，用旗標帶過去給領獎判斷。
      - set_flag: 更高的難度開不了
      - tap_match: [-139, 0]
      - wait: 2

  - name: 領獎次數已達上限 → 記住不要再買
    # 點 ⊕ 後跳出「目前領獎次數已達到上限，無法進行購買」，代表已囤到上限
    # （每日 2 次＋購買 2 次＝4）。這是唯一的訊號：⊕ 買滿後不會消失，也不會開對話框。
    # 只裁「無法進行購買」：來源副本 1.000、換副本 0.986、其餘樣本 ≤0.593。
    template: label_buy_capped
    when_option: "stock_up_before_new_dungeon=true"
    when_flag: ["!次數已經買滿"]
    do:
      - set_flag: 次數已經買滿

  - name: 明天開新副本 → 先把領獎次數買滿
    # 不等次數用盡就購買（⊕ 在 2/2 時就在，0.995），買到的次數留到明天。
    # ⚠ require 綁詳情頁：結算頁上也有同一顆 ⊕。
    # ⚠ 用 max_fires_daily：⊕ 買滿後不會消失，規則分不出還能不能買，而 max_fires
    #   每輪重置會在重新執行時又點三次。給 3 而不是 2，多一次重試（空點沒有副作用）。
    template: btn_add_count
    require: [anchor_dungeon_detail]
    when_option: "stock_up_before_new_dungeon=true"
    when_flag: [明天開新副本, "!次數已經買滿"]
    max_fires_daily: 3
    do:
      - tap_match: []
      - wait: 1.5

  - name: 副本詳情頁 → 確認副本後配對
    # 排隊中按鈕變成「取消配對」，這條就不成立。
    #
    # 副本名稱與難度用 OCR 寫進紀錄（內容會一直增加，不適合用模板）：
    #   選擇副本  白色美術字描黑邊，亮度門檻 210 轉黑字白底、放大 4 倍（3 倍時部分
    #             名稱讀不到）。標題是「名稱·難度」，trim_right 從文字右端扣掉
    #             「·難度」的固定寬度 193px（容許 185～200）。
    #   難度      讀「惡夢副本獎勵」那行淺底標準字，放大 4 倍後去掉「副本獎勵」。
    # 調整參數用的參考畫面：samples/ocr/dungeon_detail.png
    #   python main.py text samples\ocr\dungeon_detail.png 110 174 510 64 \
    #          --binary 210 --scale 3 --trim-right 193      → 月之宮殿
    #   python main.py text samples\ocr\dungeon_detail.png 30 798 170 34 --scale 4
    #                                                       → 惡夢副本獎勵
    template: btn_match
    cooldown: 5
    do:
      # 讓出執行權的檢查點：上一場已結束、下一場還沒開始。「未達 S → 退出重打」
      # 不經過 count，只在 count 檢查會讓連續重打擋住下一個排程時刻。
      - yield_if_due:
      # 先寫紀錄再按配對，紀錄順序才和實際發生的順序一致。
      - log_text:
          選擇副本: {region: [110, 174, 510, 64], binary: 210, scale: 4, trim_right: 193}
          難度: {region: [30, 798, 170, 34], scale: 4, strip: 副本獎勵}
      - tap_match: []
      - wait: 3

  - name: 配對冷卻中 → 等待解鎖
    # 取消配對或漏接會被鎖一分鐘，「配對」變成「🔒 倒數」。攔截規則，倒數結束後由上
    # 一條接手。模板只取鎖頭，避開秒數。
    template: btn_match_locked
    do: []

  - name: 配對過久 → 取消後重新配對
    # 詳情頁連續停留 5 分鐘還沒進入戰鬥就取消重排；畫面一變計時就歸零。
    template: anchor_dungeon_detail
    sustain: 300
    cooldown: 60
    do:
      - log: 已配對 5 分鐘沒有結果
      - tap: [539, 1097]                   # 取消配對（與配對同一顆按鈕的位置）
      - wait: 3

  # ---------- 這一級是不是最高難度 ----------
  # 領獎次數要留給打得動的最高難度。結算頁只看得到副本名稱與難度，所以在詳情頁判斷
  # 後用旗標「已在最高難度」帶過去：
  #   這一級還沒拿過 S → 那一場 S 會開放下一級，獎勵留著（不設旗標）
  #   這一級已經是 S   → 再打也開不了下一級，開始領獎（設旗標）
  #
  # ⚠ 這三條要排在配對規則後面（不搶配對那一輪，也不蓋掉「配對冷卻中」），
  #   又要排在「配對中 → 留在原地等待」前面（那條每輪都成立）。

  - name: 這一級已是 S 而沒有難度等著解鎖 → 已在最高難度
    # 🔒 只在「上一級還沒拿到 S」時出現；上一級是 S 而戰力不足時不會有 🔒。
    # 所以沒有任何 🔒 就代表沒有哪一級在等 S。
    require: [anchor_dungeon_detail, label_detail_rank_s]
    absent: [tab_lock]
    region: [140, 1180, 580, 80]
    when_flag: ["!已在最高難度"]
    cooldown: 60
    do:
      - set_flag: 已在最高難度

  - name: 這一級已是 S 而更高的難度剛確認開不了 → 已在最高難度
    # 上一級有 🔒 但剛確認「未達成啟用條件」：除了評級還差戰力，今天打不出來。
    require: [anchor_dungeon_detail, label_detail_rank_s]
    when_flag: [更高的難度開不了, "!已在最高難度"]
    cooldown: 60
    do:
      - set_flag: 已在最高難度

  - name: 已經在最高的難度 → 已在最高難度
    # 煉獄是最右邊那格，不必看評級。模板取選中狀態，未選中時 0.684。
    template: tab_inferno_on
    require: [anchor_dungeon_detail]
    when_flag: ["!已在最高難度"]
    cooldown: 60
    do:
      - set_flag: 已在最高難度

  - name: 配對中 → 留在原地等待
    # 攔截規則。排隊時「配對」變成「取消配對」；少了這條，後備規則會按返回退出
    # 詳情頁。錨點用「前往副本」，配對與否都在。
    template: anchor_dungeon_detail
    do: []

  - name: 明天就開新副本 → 記住今天要囤次數
    # 沒用掉的領獎次數會留到隔天，新副本開放前一天把次數留給新副本。
    # 倒數剩不到 24 小時時「N天」那段會消失，所以「倒數計時在、『天』不在」就是明天
    # 開放。若遊戲改成顯示「0天」，這條只是不觸發。
    # 「天」：4天 1.000、13天 0.970、其餘樣本 ≤0.512。
    require: [label_unlock_countdown]
    absent: [label_countdown_days]
    region: [100, 880, 520, 180]
    when_option: "stock_up_before_new_dungeon=true"
    when_flag: ["!明天開新副本"]
    do:
      - log: 新副本明天開放，今天不領獎，把領獎次數留到明天
      - set_flag: 明天開新副本

  - name: 副本列表頁 → 選還沒開放那張的上一張
    # 選目前打得了的最新副本（獎勵最好）。列表由舊到新排列、未開放的在最後，所以
    # 「倒數計時」卡片的上一張就是目標。
    # ⚠ 不用評級標章找：標章跟的是當前選中的難度，會隨腳本的動作改變。
    # ⚠ 卡片間距 352px；列表整體會上下位移約 32px，所以用 tap_match 的相對位移。
    # ⚠ pick: highest 取最上面那張未開放的；region 限在 y≥500，確保上一張仍在畫面內。
    # 模板只取「倒數計時：」：正確畫面 1.000、其餘樣本 ≤0.644。
    template: label_unlock_countdown
    region: [0, 500, 720, 780]
    pick: highest
    cooldown: 5
    do:
      - tap_match: [0, -352]
      - wait: 3

  - name: 副本列表頁 → 選最下面那張副本
    # 沒有倒數卡片可當路標時，選最下面那張（列表由舊到新排列）。
    # ⚠ 每張卡片都有評級標章（「最高評級」或「暫無評級」），兩個模板都要掛，再用
    #   pick_across 跨模板取最下面那個。不能只找「暫無評級」：打到 S 後標章會變。
    # ⚠ 不可以有 sustain，否則累積期間會被後面的規則搶先。
    # ⚠ 要排在倒數那條後面：倒數卡片也掛著「暫無評級」（0.942）。
    # 位移取兩種標章的折衷（中心差 11px），落點在卡片中央附近。
    template: [label_max_rank_text, label_no_rank_text]
    pick: lowest
    pick_across: true
    cooldown: 5
    do:
      - tap_match: [-296, 138]
      - wait: 3

  - name: 筆記頁 → 進入日常副本
    template: card_daily_dungeon           # 藍色漩渦，沒有文字
    cooldown: 5
    do:
      - tap_match: []
      - wait: 3

  - name: 其他頁面 → 點筆記
    template: nav_note
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 討伐結算頁 → 點掉繼續
    # 公會討伐的結算頁：討伐加入戰鬥後就結束，打完會停在這張頁面，下一個腳本啟動時
    # 看到的就是它。
    # ⚠ 系統返回鍵無效，只能點空白處。點掉後回到討伐頁，由「誤入次要頁面」逐層退出。
    template: label_raid_result
    do:
      - tap: [360, 900]
      - wait: 2

  # 以下攔截規則把副本內的階段分開命名，動作都相同（do: []），讓等待狀態看得出
  # 停在哪個階段。
  # ⚠ 細節狀態要排在通用的「戰鬥中」前面。

  - name: BOSS 房戰鬥中
    # BOSS 房背景是明亮的主題色，半透明的齒輪只有 0.800～0.813；「回合：N/M」是不
    # 透明的深色膠囊，1.000。回合數是每位玩家各自的計數，只當錨點用，不解讀數字。
    # ⚠ region 是必要的：不限範圍時詳情頁 0.726、列表頁 0.718；限定頂端後有回合條
    #   最低 0.964、沒有的最高 0.445。回合條在畫面頂端，不會被其他內容推移。
    template: label_round
    region: [230, 12, 270, 56]
    do: []

  - name: 載入中 → 等畫面切換
    # 全螢幕「載入中……」。三個模板是同一段文字的三個彈跳位置：單一模板分數在
    # 0.601～1.000 間跳動，三張合起來載入畫面最低 0.893、其他畫面最高 0.649。
    # 只裁「入中」，避開奔跑的角色與會增加的「……」。
    template: [label_loading, label_loading_b, label_loading_c]
    do: []

  # ==================== 遊戲冷啟動 ====================
  # 從關閉狀態啟動到家園約 108～152 秒，整段沒有主流程的元素（導覽列、返回鍵、齒輪
  # 都 ≤0.63）。時間軸：
  #   0～35 秒    全黑。_ensure_app 啟動後先等 8 秒，後備規則要連續 45 秒才動作。
  #   35～42 秒   開場 logo
  #   44～103 秒  標題畫面「正在載入更新檔」→「正在初始化」
  #   105～109 秒 轉場空檔
  #   109 秒～    公告（有返回鍵）
  # 「檢查網路」按鈕是載入中標題畫面唯一不變的 UI：標題畫面 0.947～1.000、遊戲內
  # 樣本最高 0.427。標題畫面停多久不可預測（下載更新），有攔截規則就能一直等。

  - name: 伺服器維護中 → 結束本輪，下一輪再試
    # 標題畫面上的「伺服器維護中」氣泡：進不了遊戲，這一輪直接結束。
    # ⚠ 必須排在「標題畫面 → 點擊開始遊戲」前面，否則返回鍵關掉氣泡後會一直點開始。
    # 模板只取「伺服器維護中」那行：維護畫面 1.000、其餘樣本 ≤0.616。
    # ⚠ 用 skip_cleanup：這張畫面沒有導覽列與返回鍵，結束程序的每一步都會空等 25 秒。
    template: label_server_maintenance
    do:
      - finish: skip_cleanup

  - name: 遊戲要求重新進入 → 重新啟動遊戲
    # 同一個「確認」對話框的兩種訊息，處理方式相同：
    #   請重新啟動遊戲以進行更新      版本更新後
    #   世界發生變動，重新進入後生效。  維護結束、世界資料變更後
    # 新的訊息出現時把模板加進清單即可。
    # 按確定不保證會關閉遊戲，所以按完仍要重新啟動。重新啟動後在標題畫面下載更新，
    # 由「遊戲啟動中 → 等載入完成」接住。
    # 模板只取訊息那行（標題與確定鍵是共用元件）：各自 1.000、互相 0.46～0.47、
    # 其餘樣本 ≤0.560；確定鍵 0.982／0.957。
    # ⚠ max_fires: 2：重新啟動兩次仍是同一張畫面，交給下一條結束本輪。
    template: [label_restart_to_update, label_world_changed]
    max_fires: 2
    do:
      - tap_template: btn_confirm
      - wait: 2
      - restart_app:

  - name: 重新啟動後仍要求重新進入 → 結束本輪，下一輪再試
    # 上一條的 max_fires 用完才輪到。skip_cleanup 的理由與維護那條相同。
    template: [label_restart_to_update, label_world_changed]
    do:
      - finish: skip_cleanup

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    # 同一個帳號在別的裝置登入時跳出的對話框，不按確定會一直停在這裡。按下後回到
    # 標題畫面，由「標題畫面 → 點擊開始遊戲」完成登入。
    # ⚠ 返回鍵 0.487、家園 0.482，後備規則接不住，而系統返回鍵對這個對話框無效。
    # 模板只取訊息那行；確定鍵 btn_confirm 0.982。
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    # 開機自動彈出的全螢幕公告，勾「今日不再提醒」再關閉。
    # ⚠ 必須排在「誤入次要頁面」前面（這頁返回鍵 1.00），否則沒有機會勾選。
    # 模板含圓圈與文字（公告頁 1.00、其他樣本最高 0.58），勾選後分數下降，不會再觸發
    # 而取消勾選。偏移量：模板中心 (362, 1128)、圓圈中心 (289, 1127)。
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    # 「點擊任意處開始遊戲」不點就不會前進，後備規則也接不住（返回鍵 0.58）。
    # 錨點用右側選單（靜態 UI，0.93～1.00；載入中的標題畫面沒有這個選單），底下那行
    # 字有流光動畫（0.71～0.98 週期跳動），只當備援。
    # sustain 3：避開公告淡入時的畫面（選單仍看得見，0.91）。
    # (360, 900) 是角色與文字之間的空地，右側選單在 x>600。
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  - name: 選擇房間中 → 等投票結果
    # 每打完一關的「副本房間地圖」，投票選下一間，9 秒後自動前進。
    template: label_room_map
    do: []

  - name: 準備中 → 等倒數結束
    # 「戰鬥準備倒數計時：N 秒」，4 秒後自動確認，不必點「準備」。模板避開秒數。
    # 三個準備階段共 5 張 0.995～1.000，其他畫面 ≤0.458。
    template: label_battle_prepare
    do: []

  - name: 戰鬥中
    # 副本內通用的戰鬥狀態；上面幾條沒認出來的階段都落到這裡。
    # 門檻 0.78：齒輪半透明、疊在戰鬥特效上，132 張戰鬥畫面 0.863～0.913、準備階段
    # 0.792、明亮的 BOSS 房 0.800～0.813；非戰鬥畫面 ≤0.63。
    # ⚠ 紫色主題的關卡上齒輪只有 0.727 而且沒有回合條，所以評級徽章也一起掛
    #   （同一張畫面 0.998）。四個等級都要列，戰鬥中最高只到 A。
    # 規則名稱只寫狀態：等待訊息取「→」前面那段。
    template: [btn_settings_gear, rank_live_d, rank_live_c, rank_live_b,
               rank_live_a]
    threshold: 0.78
    do: []

  # ==================== 後備規則 ====================
  # 走到這裡代表停在流程以外的畫面，依序嘗試：處理特定對話框 → 點空白處 → 按返回鍵
  # → 回家園 → 系統返回鍵 → 重新啟動遊戲 → 結束本輪。
  #
  # ⚠ 會動作的後備規則都要設 sustain。換頁（載入、配對、結算動畫）那一兩秒主流程規則
  #   都不成立，立刻動作會打斷正常流程。

  - name: 觀戰確認框 → 確定退出
    # 「要退出觀戰狀態嗎?」是按系統返回鍵叫出來的；認不得的話後備規則會一直按返回鍵，
    # 對話框開開關關。模板取訊息那行（其餘樣本 ≤0.549），確定鍵 1.000。
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 點空白處無法關閉的頁面 → 重新啟動遊戲
    # 「點擊空白處關閉」的頁面若點了沒有作用，下面那條會每輪都成立，後面的後備規則
    # 永遠輪不到。頁面連續存在 90 秒就重新啟動遊戲。
    # ⚠ 一定要排在點空白處那條前面：sustain 未滿時讓給它點，滿了才輪到這條。
    template: label_tap_blank_close
    sustain: 90
    max_fires: 1
    do:
      - screenshot: blank_page_stuck
      - restart_app: 45

  - name: 重新啟動後仍無法關閉 → 結束本輪
    # 重新啟動後還是同一張頁面。這張頁面沒有導覽列與返回鍵，所以跳過結束程序。
    template: label_tap_blank_close
    sustain: 90
    do:
      - log: 點空白處無法關閉這張頁面，重新啟動遊戲後仍然存在，結束本輪
      - screenshot: blank_page_stuck_after_restart
      - finish: skip_cleanup

  - name: 點擊空白處關閉的頁面 → 點掉
    # 返回鍵無效、只能點空白處的結算頁共用底部那行「點擊空白處關閉」，一條全部接住。
    # ⚠ 排在系統返回鍵前面：返回鍵對這類頁面沒有作用，還可能叫出其他確認框。
    template: label_tap_blank_close
    cooldown: 3
    do:
      - tap: [360, 640]
      - wait: 2

  - name: 誤入次要頁面 → 點返回退出
    # 沒有底部導覽列、只有左下角返回鍵的頁面。主流程頁面也有返回鍵，但那些規則在前面。
    template: btn_back_arrow
    sustain: 4
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 停在無法處理的畫面 → 回家園重新開始
    template: nav_home
    sustain: 5
    cooldown: 30
    do:
      - screenshot:
      - tap_match: []
      - wait: 3

  - name: 完全無法辨識 → 按系統返回鍵
    # 導覽列、返回鍵、戰鬥畫面的錨點都找不到時按系統返回鍵。
    # sustain 45 秒：載入黑畫面、選房間、準備倒數都沒有導覽列也沒有返回鍵。
    # ⚠ absent 要列出所有「正常但沒有導覽列」的畫面錨點。sustain 是條件持續成立的
    #   時間，攔截規則擋得住觸發、擋不住計時；只有條件本身不成立計時才會歸零：
    #   - 戰鬥：齒輪、回合條、四個評級徽章（紫色關卡齒輪只有 0.727，徽章 0.998、
    #     非戰鬥畫面 ≤0.377）
    #   - 開機：logo、檢查網路、標題選單（遊戲內樣本 ≤0.53）
    absent: [nav_home, btn_back_arrow, btn_settings_gear, label_round,
             rank_live_d, rank_live_c, rank_live_b, rank_live_a,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 5          # 用完之後由下一條重新啟動遊戲
    cooldown: 30
    do:
      - screenshot:
      - back:
      - wait: 2

  - name: 持續無法脫困 → 重新啟動遊戲
    # 系統返回鍵處理不了的畫面（只能點空白處的頁面、按返回反而叫出確認框的頁面），
    # 重新啟動讓畫面回到「開機 → 家園」這條認得的路。
    # ⚠ absent 要和上一條完全一樣，少列一個就會在那個畫面上誤觸發（重新啟動要 152 秒）。
    # ⚠ 上一條一定要有 max_fires，否則這條永遠輪不到。
    absent: [nav_home, btn_back_arrow, btn_settings_gear, label_round,
             rank_live_d, rank_live_c, rank_live_b, rank_live_a,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 3      # 用完之後由下一條結束本輪
    do:
      - restart_app: 45

  - name: 重新啟動遊戲也無法恢復 → 結束本輪
    # 後備規則的最後一條：重新啟動三次仍無法辨識，結束本輪讓排程繼續，截圖留作
    # 補模板的來源。
    # ⚠ 一定要有這條：最後手段本身也要有上限，否則會每 30 秒重新啟動一次遊戲。
    absent: [nav_home, btn_back_arrow, btn_settings_gear, label_round,
             rank_live_d, rank_live_c, rank_live_b, rank_live_a,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    do:
      - log: 重新啟動遊戲三次仍無法辨識畫面，結束本輪
      - screenshot: stuck_after_restart
      - finish:
