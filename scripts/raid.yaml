# 自動公會討伐
#
# 流程：家園 →「公會」→ 拖曳找到遠征之門 → 公會討伐 → 討伐獎勵可領就先領
#      → 往下一關 → 場上有人就進旁觀房間 → 等人夠多 → 加入戰鬥 → 逐層退回家園
#
# 和副本相同，畫面決定動作、順序就是優先度。這份腳本的四個設計：
#
# 1. 樓層不必計數。按鈕顯示狀態：打過的是「已擊敗」、當前可打的是亮綠色「挑戰」、
#    更後面的是「未解鎖」。規則依按鈕往左或往右一層，自然停在可挑戰的那層。
#
# 2. 「有沒有人」看討伐頁副標題，「有多少人真的在打」看房間裡的順序條。
#    副標題「目前有 N 人正在挑戰」的模板只裁「人正在挑戰」，任何人數都認得
#    （「無人挑戰」0.57）。N 只是進場人數，旁觀而沒開打的也算在內。
#
# 3. 「等到某個時間還沒人就自己進場」用 sustain 表達（某個狀態連續成立 N 分鐘），
#    中午與晚上兩場共用同一條規則。
#
# 4. 順序條用 measure 量測長度，不裁模板（見「旁觀房間」那段）。
#
# 共通約束與共用規則的說明見 dungeon.yaml 檔頭。⚠ 這份腳本少了 cooldown 的後果
# 是點開 BOSS 詳情面板蓋住整頁。

name: 自動公會討伐
package: com.m88.idleXX

# 等人可能等 7 分鐘以上，畫面只有 BOSS 待機動畫在動，脫困門檻要大於這段時間。
stuck_timeout: 900

# 結束程序：逐層退回家園待命：戰鬥 → 討伐頁 → 公會活動 → 公會島 → 家園。
# 公會活動頁沒有底部導覽列，所以每一步先試著點家園，找不到才點返回鍵。
#
# ⚠ 只能用 tap_template，不能用固定座標：這是無條件執行的清單，加入戰鬥後畫面停在
#   戰鬥中，固定座標會點出寵物資訊或技能面板。結算頁交給規則處理。
# ⚠ 加入戰鬥後左下角是 ⤡（縮小），返回鍵在那裡只有 0.60，所以第一步要掛
#   btn_battle_shrink（戰鬥畫面 1.00、其他畫面 ≤0.50）。點 ⤡ 只是離開戰鬥畫面，
#   戰鬥在背景繼續；回到討伐頁後「挑戰」變成「返回戰鬥畫面」。
on_finish:
  - log: 本輪結束，返回家園待命
  # 加入戰鬥後要載入十幾秒，wait_for 等到畫面認得出來才往下走。
  - wait_for: [nav_home, btn_battle_shrink, btn_back_arrow]
  - wait: 1.5
  # ⚠ 每一步之前都要 wait_for，理由見 dungeon.yaml 的結束程序。
  - tap_template: [nav_home, btn_battle_shrink, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - wait_for: [nav_home, btn_back_arrow]
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: nav_home
  - wait: 2

rules:
  # ==================== 最上層的畫面優先 ====================

  - name: 獲得獎勵動畫 → 點擊關閉
    # 領取討伐獎勵、公會島累積獎勵後的「獲得獎勵」橫幅，點空白處關閉。
    # 排在最前面，避免橫幅蓋住底下的按鈕造成誤判。
    template: label_reward_got
    do:
      - tap: [360, 250]
      - wait: 1.5

  - name: 討伐結算頁 → 點擊關閉
    # 「戰鬥結束／造成傷害 N 億／參與討伐獎勵」。
    # ⚠ 系統返回鍵無效，只能點空白處（y=900 附近沒有按鈕）。
    # 模板取「參與討伐獎勵」那行，不含每層不同的獎勵物品：1.00、其他畫面 ≤0.54。
    template: label_raid_result
    do:
      - tap: [360, 900]
      - wait: 2

  - name: 討伐戰鬥中 → 縮小離開戰鬥畫面
    # 已參戰而畫面停在戰鬥中（手動打到一半才執行，或上一輪結束程序沒有走完）。
    # 點 ⤡ 不會放棄這一場，回到討伐頁後由「已經在戰鬥中 → 結束本輪」接手。
    # btn_battle_shrink 戰鬥畫面 1.00、其他畫面（含副本戰鬥）≤0.50。
    template: btn_battle_shrink
    cooldown: 5
    do:
      - tap_match: []
      - wait: 2.5

  # ==================== 旁觀房間：人數判斷 ====================
  # 點「挑戰」只進入旁觀狀態的房間（不消耗討伐次數），按「加入戰鬥」才真正入場。
  #
  # 人數看畫面最上方的順序條：每一格是參戰的角色或寵物，長相各不相同，不能裁模板，
  # 改用兩個量測：
  #   1. 空軌道長度：沒被圖示佔住的那段是顏色均勻的 UI（BGR 80,143,141、H=30，
  #      圖示外圈 H≈100）。
  #   2. 圖示間距：圖示會縮小以擠進固定寬度。
  # 空軌道約 12 個單位以上就飽和為 0px，間距在飽和後仍然單調，所以 metric: units
  # 合併兩者：單位數 ≈ 已排到的寬度 ÷ 圖示間距。
  #
  # 量測階梯（軌道全長 572px）：
  #   場上沒人（raid_start_battle）     空軌道 367px　間距 48px　約  4 個單位
  #   1 人在打（raid_battle_room）      空軌道 286px　間距 41px　約  7 個單位
  #   數人在打（raid_room_few）         空軌道 121px　間距 25px　約 18 個單位
  #   戰鬥中期                          空軌道  40px　間距 20px　約 27 個單位
  #   人數很多（raid_room_crowded）     空軌道   0px　間距 14px　約 41 個單位
  #
  # 換算式：單位數 ≈ 2.25 × 人數 + 5.75（五個實際人數的校準點都在 ±1.5 個單位內，
  # 校準表見 CLAUDE.md）。8 人 ≈ 24、10 人 ≈ 28、12 人 ≈ 33。
  #
  # ⚠ 這是估計值（誤差約 ±2～3 人）。自相關峰值只有 0.3～0.6，相鄰兩幀可能差 20 個
  #   單位，所以一定要 smooth（最近 15 次取中位數）配合 sustain。
  # 量測值每 30 秒寫一筆紀錄，方便對照實際人數校準門檻。

  - name: 房間裡人夠多 → 加入戰鬥
    # 估計人數達到 raid_join_players（預設 10）就入場。人越多存活越久、傷害越高
    # （同樣消耗一次次數）；達不到時由下面的平台期與保底規則接手。
    require: [btn_join_battle]
    measure:
      region: [70, 119, 572, 18]
      metric: units
      color: [80, 143, 141]
      smooth: 15
      # 填人數即可，引擎依換算式轉成單位數。
      at_least_players: "${raid_join_players:10}"
      log: 順序條
    when_option: wait_for_others
    sustain: 20          # 讓平滑視窗填滿，也避開順序條剛好排滿的瞬間值
    max_fires: 3
    do:
      - tally: 參戰
      - tap_template: btn_join_battle
      - wait: 6
      - count:
      - finish:

  - name: 人數上到平台期 → 加入戰鬥
    # 人數達不到上一條時，估計值停在 raid_plateau_players（預設 6.5 人）以上持續
    # raid_plateau_sustain 秒就入場。順序條是「當下存活的單位」，早入場的人陣亡就消失，
    # 人數會先升後降，等越久不一定人越多。人數還在上升時這條不會累積滿。
    # sustain 120：再長的話先升後降的場次會錯過高峰（取捨過程見 CLAUDE.md）。
    # 不設 log：量的是同一個數值，上一條已經寫了。
    require: [btn_join_battle]
    measure:
      region: [70, 119, 572, 18]
      metric: units
      color: [80, 143, 141]
      smooth: 15
      at_least_players: "${raid_plateau_players:6.5}"
    when_option: wait_for_others
    sustain: "${raid_plateau_sustain:120}"
    max_fires: 3
    do:
      - tally: 參戰
      - log: 湊不到設定的人數，但估計值已經不再上升
      - tap_template: btn_join_battle
      - wait: 6
      - count:
      - finish:

  - name: 一直沒人開場 → 自己開始戰鬥
    # 沒有戰鬥實例時按鈕是「開始戰鬥」（自己開一場），有實例時是「加入戰鬥」。
    # 等 raid_solo_after_minutes（預設 8 分鐘）仍沒人開場才自己開；單人的效益很差，
    # 只當最後手段。有人開場後按鈕變成「加入戰鬥」，交給上面幾條。
    # ⚠ 一定要有 sustain：進房間的規則只等 12 秒，「開始戰鬥」不代表已經等夠了。
    # ⚠ 必須小於 10 分鐘：旁觀房間待滿 10 分鐘會被遊戲送回討伐頁，計時只在房間裡累積。
    template: btn_start_battle
    sustain_minutes: "${raid_solo_after_minutes:8}"
    max_fires: 3
    do:
      - tally: 參戰
      - log: 等待時間已到仍無人開場，自行開始戰鬥（單人效益較差）
      - tap_match: []
      - wait: 6
      - count:
      - finish:

  - name: 等不到更多人 → 還是加入戰鬥
    # 保底：等 raid_join_wait_minutes（預設 5 分鐘）仍湊不到人數，有人在打就加入。
    # 刻意不設人數條件，否則人很少的日子會一直等到結束本輪而沒有參戰。
    require: [btn_join_battle]
    sustain_minutes: "${raid_join_wait_minutes:5}"
    max_fires: 3
    do:
      - tally: 參戰
      - tap_template: btn_join_battle
      - wait: 6
      - count:
      - finish:

  - name: 設定為不等人 → 直接入場
    # 兩種按鈕都要掛：有實例就加入、沒有就自己開。
    template: [btn_join_battle, btn_start_battle]
    when_option: "!wait_for_others"
    max_fires: 3
    do:
      - tap_match: []
      - wait: 6
      - count:
      - finish:

  - name: 旁觀房間 → 留在原地等待
    # 攔截規則。房間左下也有返回鍵（1.00），上面幾條 sustain 累積期間要擋住後備規則。
    # ⚠ 兩種按鈕文字都要掛（template 清單是「任一符合」，require 是「全部符合」）。
    template: [btn_join_battle, btn_start_battle]
    do: []

  - name: 已經在戰鬥中 → 結束本輪
    # 入場後回到討伐頁，「挑戰」變成「返回戰鬥畫面」，代表這一場已經參戰。
    # 從已參戰的狀態啟動時也由這條結束。
    template: btn_return_to_battle
    do:
      - count:
      - finish:

  # ==================== 討伐頁：領獎與選層 ====================
  # 順序就是「先領獎、再往前推、走過頭就退回」，不必判斷目前樓層。

  - name: 已擊敗的層 → 領取討伐獎勵
    # 可領取時獎勵圖示右上角有紅色驚嘆號，位置與外觀固定。
    # ⚠ region 要框住獎勵格右上角：紅點在畫面上到處都有。可領 1.00、已領 0.53、
    #   不可領 0.47。用 tap_match 從紅點偏移到圖示中心。
    require: [anchor_raid_page, btn_floor_defeated]
    template: reward_available
    region: [368, 678, 46, 42]
    when_option: claim_raid_reward
    cooldown: 4
    do:
      - tally: 領取討伐獎勵
      - tap_match: [-31, 35]
      - wait: 2

  - name: 今日次數已用盡 → 結束本輪
    # 次數用盡時「挑戰」按鈕外觀不變（仍是 1.00），只能讀「今日剩餘討伐次數」。
    # 模板只裁第一個數字「0」：單一字元 1.00 對 0.58，整串「0/2」在 1/2 畫面有 0.79。
    # ⚠ region 要框住標題那一小塊：畫面上其他數字（血量、樓層）會誤判。
    # ⚠ 排在領獎之後（次數用完仍要領獎）、推進樓層之前。
    require: [anchor_raid_page]
    template: label_raid_count_zero
    region: [400, 34, 70, 36]
    do:
      - finish:

  - name: 已擊敗的層 → 前往下一關
    # 領獎規則在前面，到這裡代表獎勵已領完或設定為不領獎。
    # ⚠ 箭頭用 tap_template 點：樓層推到底時固定座標會點開 BOSS 詳情面板。
    require: [anchor_raid_page, btn_floor_defeated, btn_floor_next]
    do:
      - tap_template: btn_floor_next
      - wait: 1.5

  - name: 未解鎖的層 → 退回一層
    # 走過頭（或手動滑到後面的層）時往回。
    require: [anchor_raid_page, btn_floor_locked, btn_floor_prev]
    do:
      - tap_template: btn_floor_prev
      - wait: 1.5

  # ==================== 討伐頁：決定何時進房間 ====================

  - name: 場上有人 → 進去房間看清楚
    # 副標題顯示有人在挑戰就進房間，人數判斷在房間裡做（旁觀不消耗次數）。
    # sustain 12：確認副標題不是換頁時的殘影。
    require: [anchor_raid_page, btn_raid_challenge]
    template: label_challenging
    when_option: wait_for_others
    sustain: 12
    max_fires: 3
    do:
      - tap_template: btn_raid_challenge
      - wait: 4

  - name: 設定為不等人 → 直接進入挑戰
    require: [anchor_raid_page, btn_raid_challenge]
    when_option: "!wait_for_others"
    max_fires: 3
    do:
      - tap_template: btn_raid_challenge
      - wait: 4

  - name: 等不到人 → 自己先進場觸發
    # 進入討伐頁後 raid_page_wait_minutes（預設 7 分鐘）仍無人挑戰，自己先進房間。
    require: [anchor_raid_page, btn_raid_challenge]
    template: label_no_challenger
    when_option: wait_for_others
    sustain_minutes: "${raid_page_wait_minutes:7}"
    max_fires: 3
    do:
      - log: 等待時間已到仍無人挑戰
      - tap_template: btn_raid_challenge
      - wait: 4

  - name: 在討伐頁停留過久 → 結束本輪
    # 安全網：一直進不了戰鬥時結束本輪並留一張截圖。已知情況都有專屬規則，
    # 走到這裡代表遇到沒見過的畫面，截圖就是補模板的來源。
    # ⚠ raid_page_giveup_minutes 必須大於 raid_page_wait_minutes，否則還沒等完就結束。
    require: [anchor_raid_page]
    sustain_minutes: "${raid_page_giveup_minutes:15}"
    do:
      - log: 在討伐頁停留過久仍未能加入戰鬥
      - screenshot: raid_stuck
      - finish:

  - name: 討伐頁 → 留在原地等待
    # 攔截規則。討伐頁左下也有返回鍵（1.00），等人期間要擋住後備規則。
    require: [anchor_raid_page]
    do: []

  # ==================== 導覽：走到公會討伐 ====================

  - name: 公會活動頁 → 進入公會討伐
    template: card_guild_raid
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 公會島放置獎勵 → 領取
    # 說明見 chores.yaml 的同名規則。
    template: btn_guild_mine_reward
    require: [label_nav_guild_on]
    region: [500, 880, 220, 160]
    max_fires: 1
    do:
      - tap_match: []
      - wait: 2

  - name: 公會島看到遠征之門 → 點進去
    # 門的位置隨視角左右移動，用 tap_match 點。
    # 公會島有日夜循環（不跟現實時間），白天版模板在夜晚只有 0.66～0.71，所以掛日夜
    # 兩版：有門的畫面都 ≥0.96、沒門的 ≤0.48。
    # 模板取門底部的石造基座，不裁中央會轉動的漩渦（連拍 0.847／0.825／0.778）。
    template: [building_raid_gate, building_raid_gate_night]
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  # 找門：公會島會記住上次的視角，所以先往一個方向拖到底、再往反方向拖回來，用
  # max_fires 控制換向時機，不依賴場景地標。
  # ⚠ 拖曳距離與速度不要加大：快速滑動有慣性，500px／600ms 會一次跨過「看得到門」的
  #   整段視角而來回震盪。240px／800ms 幾乎沒有慣性，步距小於門在畫面內的區間。
  # ⚠ 兩條都不設 cooldown：冷卻期間會讓後備規則判成未知畫面而退回家園。

  - name: 公會島找不到門 → 往右拖曳搜尋
    # 整張地圖約 4～5 步寬，門在最左往右 2 步的位置，max_fires 5 足以拖到底。
    require: [label_nav_guild_on]
    absent: [building_raid_gate, building_raid_gate_night]
    max_fires: 5
    do:
      - swipe: [480, 400, 240, 400, 800]
      - wait: 1.5

  - name: 公會島找不到門 → 往回拖曳搜尋
    # 往右拖到底仍沒找到，代表起始視角在門的右邊。20 次足以掃過整張地圖。
    require: [label_nav_guild_on]
    absent: [building_raid_gate, building_raid_gate_night]
    max_fires: 20
    do:
      - swipe: [240, 400, 480, 400, 800]
      - wait: 1.5

  - name: 不在公會島 → 點公會頁籤
    # 模板取未選中的公會圖示；選中時圖示變亮變大（0.83），已在公會島時不成立。
    template: nav_guild
    cooldown: 4
    do:
      - tap_match: []
      - wait: 2.5

  - name: 載入中 → 等畫面切換
    # 說明見 dungeon.yaml 的同名規則。
    template: [label_loading, label_loading_b, label_loading_c]
    do: []

  # ==================== 遊戲冷啟動（共用規則，說明見 dungeon.yaml） ====================

  - name: 伺服器維護中 → 結束本輪，下一輪再試
    # ⚠ 要排在「標題畫面 → 點擊開始遊戲」前面。
    template: label_server_maintenance
    do:
      - finish: skip_cleanup

  - name: 遊戲要求重新進入 → 重新啟動遊戲
    template: [label_restart_to_update, label_world_changed]
    max_fires: 2
    do:
      - tap_template: btn_confirm
      - wait: 2
      - restart_app:

  - name: 重新啟動後仍要求重新進入 → 結束本輪，下一輪再試
    template: [label_restart_to_update, label_world_changed]
    do:
      - finish: skip_cleanup

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    # ⚠ 必須排在「誤入次要頁面」前面。
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    max_fires: 10
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 標題畫面點了沒有反應 → 重新啟動遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    max_fires: 1
    do:
      - screenshot: title_stuck
      - reset_fires: [標題畫面 → 點擊開始遊戲]
      - restart_app: 45

  - name: 重新啟動後仍停在標題畫面 → 結束本輪
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    do:
      - log: 標題畫面點擊沒有反應，重新啟動遊戲後仍然一樣，結束本輪
      - screenshot: title_stuck_after_restart
      - finish: skip_cleanup

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  # ==================== 後備規則（共用規則，說明見 dungeon.yaml） ====================
  # sustain 比副本長一些：公會島與討伐頁的載入比副本慢。

  - name: 觀戰確認框 → 確定退出
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 退出確認對話框 → 確定退出
    # 副本那一輪中途中斷時留下的結算頁，說明見 dungeon.yaml 的同名規則。
    template: label_exit_confirm
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2.5

  - name: 點空白處無法關閉的頁面 → 重新啟動遊戲
    # ⚠ 一定要排在點空白處那條前面。
    template: label_tap_blank_close
    sustain: 90
    max_fires: 1
    do:
      - screenshot: blank_page_stuck
      - restart_app: 45

  - name: 重新啟動後仍無法關閉 → 結束本輪
    template: label_tap_blank_close
    sustain: 90
    do:
      - log: 點空白處無法關閉這張頁面，重新啟動遊戲後仍然存在，結束本輪
      - screenshot: blank_page_stuck_after_restart
      - finish: skip_cleanup

  - name: 點擊空白處關閉的頁面 → 點擊關閉
    template: label_tap_blank_close
    cooldown: 3
    do:
      - tap: [360, 640]
      - wait: 2

  - name: 誤入次要頁面 → 點返回退出
    template: btn_back_arrow
    sustain: 6
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 停在無法處理的畫面 → 回家園重新開始
    template: nav_home
    sustain: 8
    cooldown: 30
    do:
      - screenshot:
      - tap_match: []
      - wait: 3

  - name: 完全無法辨識 → 按系統返回鍵
    # ⚠ absent 要列出開機畫面的錨點，理由見 dungeon.yaml 的同名規則。
    absent: [nav_home, btn_back_arrow, nav_guild,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 5          # 用完之後由下一條重新啟動遊戲
    cooldown: 30
    do:
      - screenshot:
      - back:
      - wait: 2

  - name: 持續無法脫困 → 重新啟動遊戲
    # ⚠ absent 要和上一條完全一樣。
    absent: [nav_home, btn_back_arrow, nav_guild,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 3      # 用完之後由下一條結束本輪
    do:
      - restart_app: 45

  - name: 重新啟動遊戲也無法恢復 → 結束本輪
    absent: [nav_home, btn_back_arrow, nav_guild,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    do:
      - log: 重新啟動遊戲三次仍無法辨識畫面，結束本輪
      - screenshot: stuck_after_restart
      - finish:
