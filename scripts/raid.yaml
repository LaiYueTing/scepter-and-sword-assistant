# 自動公會討伐
#
# 流程：家園 →「公會」→ 拖曳找到遠征之門 → 公會討伐 → 討伐獎勵可領就先領
#      → 往下一關 → 場上有人就進旁觀房間 → 等人夠多 → 加入戰鬥 → 逐層退回家園
#
# 和自動副本一樣是「看到什麼就做什麼」，順序就是優先度。四個和副本不同的設計：
#
# 1. 樓層不必數。按鈕自己會講：打過的是「已擊敗」、當前可打的是亮綠色「挑戰」、
#    更後面的是「未解鎖」。規則只看按鈕是哪一種、往左或往右走一層，自然收斂到
#    可挑戰的那層。
#
# 2. 「有沒有人」看討伐頁的副標題，「有多少人真的在打」看房間裡的順序條。
#    副標題寫「目前無人挑戰」或「目前有 N 人正在挑戰」，模板刻意只裁
#    「人正在挑戰」避開數字，任何人數都認得（「無人挑戰」對它只有 0.57）。
#    但那個 N 只是**進場**人數，進來旁觀卻沒開打的也算進去，不能拿來決定入場。
#
# 3. 「等到某個時刻還沒人就自己進」不需要引擎支援時間條件——等價於「無人挑戰
#    的狀態連續成立 N 分鐘」。用 sustain 而不是絕對時刻的好處是晚上那場
#    不必另外設一個時刻，同一條規則兩場都適用。
#
# 4. 順序條那種「長度在講話」的元素用 measure 量，不裁模板（見「旁觀房間」那段）。
#
# 五份腳本共通的兩條全域約束（tap_match 換頁要 cooldown、純攔截不能有 cooldown）
# 見 dungeon.yaml 檔頭。⚠ 在這份腳本裡，少了 cooldown 的後果是點開 BOSS 詳情
# 面板把整頁蓋住。

name: 自動公會討伐
package: com.m88.idleXX

# 等人可能等上 7 分鐘，這期間畫面幾乎只有 BOSS 待機動畫在動，
# 不能讓「畫面靜止」的脫困機制誤判。
stuck_timeout: 900

# 收尾：逐層退回家園待命。從討伐頁按一次返回只退到「公會活動」，而那頁沒有底部
# 導覽列，nav_home 找不到，所以每步先試著點家園、找不到才點返回鍵再退一層：
# 戰鬥 → 討伐頁 → 公會活動 → 公會島 → 家園。
#
# ⚠ 收尾裡只能用 tap_template，不能用固定座標的 tap。這是無條件執行的動作清單，
#   沒有 template 守著畫面是什麼——入場後畫面通常還停在戰鬥中，寫死的座標在那裡
#   會點出寵物資訊與技能面板。結算頁交給規則處理（「討伐結算頁 → 點掉繼續」）。
#
# 剛加入戰鬥時畫面停在戰鬥中，左下角那顆按鈕會從返回鍵換成 ⤡（縮小）——
# btn_back_arrow 在那裡只有 0.60 比不到，所以第一步要掛 btn_battle_shrink
# （戰鬥畫面 1.00，其他所有畫面 ≤0.50）。
#
# 點 ⤡ 只是離開戰鬥畫面，戰鬥仍在背景進行，傷害貢獻不會丟掉——證據是回到討伐頁後
# 「挑戰」會變成「返回戰鬥畫面」（btn_return_to_battle），隨時可以再進去看。
on_finish:
  # 訊息刻意中性：收尾在「已加入戰鬥」與「在討伐頁折騰太久而收工」時都會跑。
  - log: 本輪結束，返回家園待命
  # ⚠ 加入戰鬥之後遊戲要載入十幾秒，那段時間畫面上什麼都認不到。固定的 wait
  #   只能猜：猜短了整串動作全部空點、人停在戰鬥畫面上（實測 2026-08-22 12:53
  #   連四步都落空）；猜長了每次收尾都白等。wait_for 在畫面認得出來的那一刻
  #   就往下走。
  - wait_for: [nav_home, btn_battle_shrink, btn_back_arrow]
  - wait: 1.5
  # 一步一層：戰鬥（⤡）→ 討伐頁 → 公會活動 → 公會島 → 家園。
  # nav_home 排在最前面，所以只要走到有導覽列的頁面就直接回家園。
  - tap_template: [nav_home, btn_battle_shrink, btn_back_arrow]
  - wait: 2.5
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: [nav_home, btn_back_arrow]
  - wait: 2.5
  - tap_template: nav_home
  - wait: 2

rules:
  # ==================== 限時 / 最深的畫面優先 ====================

  - name: 獲得獎勵動畫 → 點掉繼續
    # 領獎不像副本會跳確認框，是直接跳「獲得獎勵」的橫幅動畫，點空白處關掉。
    # 排最前面，免得動畫蓋住底下的按鈕造成誤判。
    template: label_reward_got
    do:
      - tap: [360, 250]
      - wait: 1.5

  - name: 討伐結算頁 → 點掉繼續
    # 一場討伐打完會跳「戰鬥結束／造成傷害 N 億／參與討伐獎勵」這張頁。
    # ⚠ 它的系統返回鍵無效，只能點空白處（y=900 那一帶沒有任何按鈕）。
    #
    # 模板取「參與討伐獎勵」那行字：底下的獎勵物品每層都不同（晨星、公會幣），
    # 裁進去就會換一場認不出來。這張 1.00，其他畫面 ≤0.54。
    template: label_raid_result
    do:
      - tap: [360, 900]
      - wait: 2

  - name: 討伐戰鬥中 → 縮小離開戰鬥畫面
    # 已經參戰、畫面停在戰鬥中時（手動打到一半才跑腳本，或上一輪收尾沒走完）。
    #
    # 戰鬥中左下角是 ⤡（縮小）而不是返回鍵，btn_back_arrow 只有 0.60 比不到，
    # 所以少了這條就只能靠 45 秒的兜底空按系統返回鍵。
    # btn_battle_shrink 在戰鬥畫面 1.00、其他所有畫面 ≤0.50，餘裕很大。
    #
    # 點它不會放棄這一場：戰鬥在背景繼續，回到討伐頁後「挑戰」會顯示成
    # 「返回戰鬥畫面」，接著由「已經在戰鬥中 → 收工」收尾。
    #
    # 副本的戰鬥畫面沒有這顆按鈕（實測 ≤0.50），所以不會誤縮到副本戰鬥。
    template: btn_battle_shrink
    cooldown: 5          # 見檔頭：用 tap_match 換頁的規則都要設
    do:
      - tap_match: []
      - wait: 2.5

  # ==================== 旁觀房間：真正的人數判斷在這裡 ====================
  # 點「挑戰」只會進到旁觀狀態的戰鬥房間（實測不消耗討伐次數），真正入場的是
  # 「加入戰鬥」那顆按鈕。所以可以放心先進來看清楚再決定。
  #
  # 判斷放在房間裡而不是看討伐頁副標題，因為副標題的 N 只是進場人數。真正在打
  # 的人會在畫面最上方的**順序條**留下角色與寵物圖示，改量那個。
  #
  # 順序條不能裁模板：每一格都是別人的角色或寵物，長相全不同。改成兩個都不需要
  # 模板的量測：
  #   1. 空軌道長度——沒被圖示佔住的那段是 UI 元件，顏色極均勻
  #      （BGR 80,143,141、H=30，和圖示外圈的 H≈100 差 70 度）。
  #   2. 圖示間距——圖示會自動縮小才擠得進固定寬度，所以間距也在講人數。
  #
  # 只用 (1) 不夠，它會**飽和**：約 12 個單位以上就一律是 0px，分不出 3 人與
  # 8 人。(2) 在飽和之後仍然單調，所以 metric: units 把兩者合起來：
  #      單位數 ≈ 已排到的寬度 ÷ 圖示間距
  #
  # 實測階梯（軌道全長 572px）：
  #   場上完全沒人（raid_start_battle） 空軌道 367px　間距 48px　約  4 個單位
  #   1 人在打（raid_battle_room）      空軌道 286px　間距 41px　約  7 個單位
  #   數人在打（raid_room_few）         空軌道 121px　間距 25px　約 18 個單位
  #   戰鬥中期                          空軌道  40px　間距 20px　約 27 個單位
  #   人多到塞滿（raid_room_crowded）   空軌道   0px　間距 14px　約 41 個單位
  #
  # 換算式（用使用者親眼數的人數校準）：**單位數 ≈ 2.25 × 人數 + 5.75**
  #
  # | 實際人數 | 量到 | 模型 | 來源 |
  # |---|---|---|---|
  # |  0 |  4.3 |  5.8 | raid_start_battle 樣本（只有 BOSS） |
  # |  1 |  7.0 |  8.0 | raid_battle_room 樣本 |
  # | 12 | 32.5 | 32.8 | 入場前的討伐頁寫 12 人進場（獨立驗證） |
  # | 13 | 35.0 | 35.0 | 使用者親眼數的人數 |
  # | 17 | 44.0 | 44.0 | 連拍 7 張取中位數 |
  #
  # 五個點都落在 ±1.5 個單位內。反推：8 人 ≈ 24、**10 人 ≈ 28**、12 人 ≈ 33。
  #
  # ⚠ 低人數的斜率不能外推到高人數。用「0 人 → 1 人」那一步算出的「每人 2.7 個
  #   單位」會把 31 當成 10 人，其實 31 已經接近 12 人。這種指標一定要在真正要
  #   判斷的區間取真實對照。
  #
  # ⚠ 這是估計值不是精確計數（誤差約 ±2～3 人）。自相關的峰值只有 0.3～0.6
  #   （隊列中間的分隔記號會破壞週期性），單幀讀數相鄰可能差到 20 個單位——
  #   所以一定要 smooth（取最近 15 次的中位數）配 sustain 一起用。
  #
  # 掛 log 是為了讓每場都留下真實數字（每 30 秒一筆），對照遊戲裡實際看到的人數
  # 就能校準門檻。

  - name: 房間裡人夠多 → 加入戰鬥
    # 「至少 10 人」。等不到就交給下面那條 5 分鐘的保底。
    #
    # 為什麼值得等到人多（同樣都只消耗一次次數）：單人開場的戰鬥 1 分鐘就結束、
    # 造成 3.72 億；約 10 人的那場打了 29 分鐘，BOSS 從滿血到剩 39%。
    #
    # 差別不是「回合被大家分著用」——回合數是每個玩家自己算的。真正的差別是
    # **存活時間**：人少時我方很快被打倒、戰鬥就結束，人多時撐得久。
    require: [btn_join_battle]
    measure:
      region: [70, 119, 572, 18]
      metric: units
      color: [80, 143, 141]
      smooth: 15
      # 填人數就好，引擎照換算式（單位數 ≈ 2.25×人數 + 5.75）換成單位數。
      at_least_players: "${raid_join_players:10}"
      log: 順序條單位數
    when_option: wait_for_others
    sustain: 20          # 讓平滑視窗填滿，也避免某個回合剛好排滿的瞬間值
    max_fires: 3
    do:
      - log: 順序條估到 10 人以上
      - tap_template: btn_join_battle
      - wait: 6
      - count:
      - finish:

  - name: 人數上到平台期 → 加入戰鬥
    # 接住「這一場湊不到 10 人」的日子。上面那條要 ≥28（約 10 人），人少的時候
    # 整場都不會成立，就只能等 5 分鐘的保底——而保底的時機是**反向**的：
    #
    #   實測某一場：進房間約 2 人 → 3 分半後峰值約 8 人 → 再 1 分鐘掉到 2.5 人，
    #   保底在 5 分鐘（人最少時）才入場，錯過了整段人最多的時候。
    #
    # 原因是順序條上的單位是**當下存活的參戰單位**，不是累計進場人數：早入場的人
    # 陣亡就從條上消失，所以人數會先升後降，不是單調上升。等越久不一定越好。
    #
    # 所以這條抓「平台期」：≥20 個單位（約 6.5 人）持續一段時間。持續才是重點——
    # 人數還在往上衝時它不會成立（那時上面那條有機會等到 10 人），
    # 只有「上到某個水位就不再往上」才會落到這裡。
    #
    # sustain 是取捨，不是最佳解。兩場實測的形狀完全不同（一場先升後降、一場慢啟動
    # 後單調上升），拿它們算餘裕：
    #   90　先升後降那場沒問題，但單調上升那場會在還在升時就入場（約 8.6 人），
    #       再等半分鐘可能就衝過 28 而由上面那條以 10 人入場
    #   120 單調上升那場讓主規則有機會先成立；先升後降那場仍能在崩掉前 70 秒入場
    #   150 更可能等到 10 人，但先升後降那場只剩 40 秒餘裕，太貼邊
    #
    # 刻意不掛 log：和上面那條量的是同一個數字，兩條都寫的話紀錄會每 30 秒
    # 出現兩行一樣的讀數。
    require: [btn_join_battle]
    measure:
      region: [70, 119, 572, 18]
      metric: units
      color: [80, 143, 141]
      smooth: 15
      at_least_players: "${raid_plateau_players:6.5}"
    when_option: wait_for_others
    # 120 秒是拿兩場實測算出來的餘裕（見 CLAUDE.md）：再長就太貼邊。
    sustain: "${raid_plateau_sustain:120}"
    max_fires: 3
    do:
      - log: 湊不到 10 人，但讀數已經不再往上
      - tap_template: btn_join_battle
      - wait: 6
      - count:
      - finish:

  - name: 一直沒人開場 → 自己開始戰鬥
    # 按鈕文字直接講狀態：**沒有戰鬥實例可加入**時是「開始戰鬥」（自己開一場）、
    # 已有實例時是「加入戰鬥」。
    #
    # ⚠ 「看到開始戰鬥」不能推論成「已經等過了、可以開場」——進房間有兩條路，
    #   其中「場上有人 → 進去房間看清楚」只等 12 秒。這條沒有 sustain 的話，
    #   進房間幾秒就會單人開場。
    #
    # 15 分鐘的理由：公會的人是在排定時刻後幾分鐘內陸續到的（21:00 還沒有人開場，
    # 21:05 就有 9～10 人在打）。等 15 分鐘還是一個人都沒有，才代表今天真的沒人
    # 要打——這時自己開一場仍勝過不打（至少領得到參與獎勵），但單人效益極差，
    # 所以它只該是最後手段。
    #
    # 有人開了實例就會變成「加入戰鬥」，交給上面兩條處理，這條自然落空。
    template: btn_start_battle
    sustain_minutes: "${raid_solo_after_minutes:15}"
    max_fires: 3
    do:
      - log: 等了 15 分鐘仍無人開場；單人效益差，這是最後手段
      - tap_match: []
      - wait: 6
      - count:
      - finish:

  - name: 等不到更多人 → 還是加入戰鬥
    # 保底：等 5 分鐘還湊不到 10 人，有幾個人就跟著打，不要空等到收工。
    #
    # 刻意**不設任何人數條件**。設了的話，人真的很少那天就會一路等到收工、
    # 白跑一趟——而既然已經進到房間，代表場上本來就有人在打。
    require: [btn_join_battle]
    sustain_minutes: "${raid_join_wait_minutes:5}"
    max_fires: 3
    do:
      - tap_template: btn_join_battle
      - wait: 6
      - count:
      - finish:

  - name: 設定為不等人 → 直接入場
    # 兩種按鈕文字都要掛：有實例就加入、沒實例就自己開。
    template: [btn_join_battle, btn_start_battle]
    when_option: "!wait_for_others"
    max_fires: 3
    do:
      - tap_match: []
      - wait: 6
      - count:
      - finish:

  - name: 旁觀房間 → 留在原地等待
    # 純攔截。房間左下也有返回鍵（btn_back_arrow 1.00），而上面幾條都有 sustain，
    # 沒滿的期間會讓後面的規則有機會——少了這條，等人等到一半就會被兜底摸到返回
    # 鍵而退出房間。
    #
    # ⚠ 兩種按鈕文字都要掛。只掛 btn_join_battle 的話，「還沒有人開場」（按鈕是
    #   「開始戰鬥」）的那段時間完全沒有攔截。template 給清單是唯一能表達
    #   「兩者其一」的寫法——require 是 AND。
    template: [btn_join_battle, btn_start_battle]
    do: []

  - name: 已經在戰鬥中 → 收工
    # 入場之後回到討伐頁，「挑戰」會變成「返回戰鬥畫面」。看到它就代表這一場
    # 已經參戰，直接收工。
    #
    # 這條也讓腳本能從「已參戰」的狀態啟動而不亂動（手動打到一半跑腳本、
    # 或上一輪收尾沒走完）。少了它會停在「留在原地等待」直到 15 分鐘的安全網。
    template: btn_return_to_battle
    do:
      - count:
      - finish:

  # ==================== 討伐頁：領獎與選層 ====================
  # 這幾條的順序就是「先領獎、再往前推、走過頭就退回來」，不必判斷現在幾樓。

  - name: 已擊敗的層 → 領取討伐獎勵
    # 「可不可領」看獎勵圖示右上角有沒有紅色驚嘆號——那個記號位置固定、外觀固定，
    # 換哪一層都一樣。判斷「能不能做」比判斷「做過沒有」可靠：後者（綠色勾號）
    # 疊在每層都不同的獎勵物品上，換層就認不出來，會對著領完的獎勵一直重複點。
    #
    # region 一定要框住獎勵格右上角：紅點在遊戲畫面到處都有，不限範圍必定誤判。
    # 限定後可領 1.00、已領 0.53、不可領 0.47。
    #
    # 點擊用 tap_match 從紅點偏移到圖示中心，不寫死座標。
    require: [anchor_raid_page, btn_floor_defeated]
    template: reward_available
    region: [368, 678, 46, 42]
    when_option: claim_raid_reward
    cooldown: 4          # 見檔頭：用 tap_match 換頁的規則都要設
    do:
      - tap_match: [-31, 35]
      - wait: 2

  - name: 今日次數已用盡 → 收工
    # ⚠ 位置有講究：排在領獎之後（次數用完獎勵還是要領）、推進樓層之前
    #   （沒有這層保護時腳本會先把樓層一路往前推，繞一大圈才收工）。
    #
    # 次數用盡時「挑戰」按鈕**外觀完全不變**，仍是亮綠色可點的
    # （btn_raid_challenge 還是 1.00），只有紅點消失。所以只能讀標題那行的
    # 「今日剩餘討伐次數」。
    #
    # 模板只裁次數的第一個數字，不裁整串「0/2」（整串在 1/2 的畫面也有 0.79，
    # 只差一個字元太危險；單一字元是 1.00 對 0.58）。而數字在畫面上到處都有
    # （血量 96%、樓層 260），所以必須用 region 框住標題那一小塊。
    require: [anchor_raid_page]
    template: label_raid_count_zero
    region: [400, 34, 70, 36]
    do:
      - finish:

  - name: 已擊敗的層 → 前往下一關
    # 刻意不要求「獎勵已領」：領獎規則排在前面，走到這裡必定代表獎勵已領完或
    # 設定為不領獎，兩種都該往前推一層。順序本身就把條件表達完了。
    #
    # 箭頭要用模板確認「真的在畫面上」，而且用 tap_template 點它——寫死座標時，
    # 樓層推到底之後那個位置的點擊會落到別的元素上，開出 BOSS 詳情面板蓋住整頁。
    require: [anchor_raid_page, btn_floor_defeated, btn_floor_next]
    do:
      - tap_template: btn_floor_next
      - wait: 1.5

  - name: 未解鎖的層 → 退回一層
    # 走過頭（或使用者手動滑到後面的層）時往回收斂。
    require: [anchor_raid_page, btn_floor_locked, btn_floor_prev]
    do:
      - tap_template: btn_floor_prev
      - wait: 1.5

  # ==================== 討伐頁：決定何時入場 ====================
  # 太早進去會被踢出場，所以原則是「等場上有人開打了才進」。

  - name: 場上有人 → 進去房間看清楚
    # 副標題只當「值得進去看看」的信號，不做人數判斷——那個 N 只是進場人數，
    # 真正的判斷在房間裡看順序條。進房間是旁觀、不消耗次數，先進去看不吃虧。
    #
    # sustain 只用來確認副標題不是轉場瞬間的殘影。
    require: [anchor_raid_page, btn_raid_challenge]
    template: label_challenging
    when_option: wait_for_others
    sustain: 12
    max_fires: 3
    do:
      - tap_template: btn_raid_challenge
      - wait: 4

  - name: 設定為不等人 → 直接進入挑戰
    require: [anchor_raid_page, btn_raid_challenge]
    when_option: "!wait_for_others"
    max_fires: 3
    do:
      - tap_template: btn_raid_challenge
      - wait: 4

  - name: 等不到人 → 自己先進場觸發
    # 「等一段時間還沒人開打就自己先進去觸發一次」。從進到討伐頁那一刻起算，
    # 所以中午與晚上兩場共用同一條規則，不必為各自的時刻分開設定。
    require: [anchor_raid_page, btn_raid_challenge]
    template: label_no_challenger
    when_option: wait_for_others
    sustain_minutes: "${raid_page_wait_minutes:7}"
    max_fires: 3
    do:
      - log: 等了 7 分鐘仍無人挑戰
      - tap_template: btn_raid_challenge
      - wait: 4

  - name: 在討伐頁折騰太久 → 收工
    # 最後的安全網：真的卡在討伐頁一直進不了戰鬥時就收工並留一張截圖，不要整晚
    # 在「進去又被退出」之間空轉。已知會落到這裡的情況都有專屬規則了（次數用盡、
    # 已經參戰），所以走到這條代表遇到還沒見過的畫面——那張截圖就是下次補模板的
    # 來源。
    #
    # ⚠ 這個時間必須大於上面那條的等待（raid_page_wait_minutes，預設 7 分），
    #   否則等人還沒等完就先收工。改設定時兩個要一起看。
    require: [anchor_raid_page]
    sustain_minutes: "${raid_page_giveup_minutes:15}"
    do:
      - log: 等了 15 分鐘仍未能加入戰鬥
      - screenshot: raid_stuck
      - finish:

  - name: 討伐頁 → 留在原地等待
    # 純攔截，這條非常關鍵。討伐頁左下也有返回鍵（btn_back_arrow 1.00），而
    # sustain 沒滿的規則會讓後面的規則有機會，所以等人的那 7 分鐘裡兜底規則每輪
    # 都摸得到返回鍵——少了這條攔截，等人等到一半就會被退出討伐頁。
    require: [anchor_raid_page]
    do: []

  # ==================== 導覽：走到公會討伐 ====================

  - name: 公會活動頁 → 進入公會討伐
    template: card_guild_raid
    cooldown: 4          # 見檔頭：用 tap_match 換頁的規則都要設
    do:
      - tap_match: []
      - wait: 2.5

  - name: 公會島看到遠征之門 → 點進去
    # 門的位置會隨視角左右浮動，所以一定要用 tap_match，不能寫死座標。
    #
    # 兩個模板是白天版與夜晚版，缺一不可：公會島有日夜循環（而且不跟現實時間走
    # ——22:00 可能是白天、隔天 00:50 是夜晚），白天版模板在夜晚只有 0.66～0.71，
    # 低於門檻，那場會整場找不到門。兩版都掛之後，有門的畫面日夜都 ≥0.96、
    # 沒門的 ≤0.48。
    #
    # 模板取門底部的靜態石造基座：門中央的藍色漩渦是會轉的動畫，裁進去會讓分數
    # 在門檻上下跳動（同視角連拍 0.847 / 0.825 / 0.778）。
    template: [building_raid_gate, building_raid_gate_night]
    cooldown: 4          # 見檔頭：用 tap_match 換頁的規則都要設
    do:
      - tap_match: []
      - wait: 2.5

  # 下面兩條負責找門。公會島的視角有記憶（切頁籤回來還停在上次的位置），所以不能
  # 假設「進公會島就在最左邊」，也不能靠「固定拖幾次」。作法是先往一個方向掃到底、
  # 再往反方向掃回來，用 max_fires 控制換手時機——完全不依賴場景地標，也就不必為
  # 日夜各準備一套地標模板。
  #
  # 拖曳的距離與速度是實測調出來的，不要改大：500px / 600ms 會讓腳本在兩端之間
  # 無止盡震盪——快速滑動會被遊戲加上慣性，實際位移遠超過指定距離，一次就跨過
  # 「看得到門」的整段視角。240px / 800ms 的慢速小步幾乎沒有慣性，步距也明顯小於
  # 「門在畫面內」的區間（約 2 步寬），掃過去時一定有某一步剛好看到門。
  #
  # 兩條都刻意不設 cooldown：門一出現上面那條就接手，本來不會拖過頭；設了反而會
  # 在冷卻的空檔漏給兜底，被判成「卡在未知畫面」而退回家園。

  - name: 公會島找不到門 → 往右掃
    # 整張地圖約 4～5 步寬，門在最左往右 2 步的位置，所以先往右掃。
    # max_fires 5 就夠掃到底；掃完還沒看到門就換下面那條往回掃。
    require: [label_nav_guild_on]
    absent: [building_raid_gate, building_raid_gate_night]
    max_fires: 5
    do:
      - swipe: [480, 400, 240, 400, 800]
      - wait: 1.5

  - name: 公會島找不到門 → 往回掃
    # 上面那條掃到底仍沒找到，代表一開始的視角就在門的右邊。max_fires 給得寬鬆
    # （20 次足以掃遍整張地圖），因為這是最後手段——用完就只能落到兜底回家園。
    require: [label_nav_guild_on]
    absent: [building_raid_gate, building_raid_gate_night]
    max_fires: 20
    do:
      - swipe: [240, 400, 480, 400, 800]
      - wait: 1.5

  - name: 不在公會島 → 點公會頁籤
    # 模板取「沒被選中」的公會圖示：選中時圖示會變亮變大、只有 0.83，所以人已經
    # 在公會島時這條不會成立，剛好交棒給上面的公會島規則。
    template: nav_guild
    cooldown: 4          # 見檔頭：用 tap_match 換頁的規則都要設
    do:
      - tap_match: []
      - wait: 2.5

  - name: 載入中 → 等畫面切換
    # 全遊戲共用的載入畫面，導覽時（進公會島、進討伐頁、進戰鬥）都會經過。
    # 純攔截，讓等待狀態有個明確名字，也不讓兜底在轉場的瞬間誤動作。
    # 三個模板是同一段文字的三個彈跳位相，理由見 dungeon.yaml 的同名規則。
    template: [label_loading, label_loading_b, label_loading_c]
    do: []

  # 冷啟動遊戲要 108 秒才進得到家園，這段期間沒有任何主流程元素可認，少了攔截會被
  # 兜底按下系統返回鍵。兩條分別認開場 logo 與標題畫面，詳細的時間軸與模板分數見
  # dungeon.yaml 的同名規則。

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    # 在別的裝置登入同一個帳號時會被踢出並跳出這個對話框，不按確定就永遠停在
    # 這裡（兜底接不住：這張畫面上返回鍵只有 0.487，而 modal 對話框對系統返回鍵
    # 通常無效）。說明見 dungeon.yaml。
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    # 四份腳本共用的開機規則，詳細說明只在 dungeon.yaml 寫一份。
    # ⚠ 必須排在「誤入次要頁面」前面，否則返回鍵會先被按掉而失去勾選的機會。
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    # 冷啟動唯一會卡死的畫面：不點就永遠停在那裡，而它沒有返回鍵可讓兜底接手。
    # 說明見 dungeon.yaml。
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  # ==================== 兜底：三層 ====================
  # 和副本同樣的分層，但 sustain 都放得寬一點，因為公會島與討伐頁的載入比副本慢。

  - name: 觀戰確認框 → 確定退出
    # 「要退出觀戰狀態嗎?」——按了系統返回鍵之後跳出來的。
    #
    # ⚠ 少了這條會死循環：兜底按返回鍵 → 叫出這個框 → 認不得 → 再按返回鍵 →
    #   框關掉又開起來。實測有使用者卡在這裡 17 分鐘、空按 26 次返回鍵。
    #   modal 對話框對系統返回鍵通常無效或反效果，一定要各自認得。
    #
    # 模板取訊息那行字（其餘樣本 ≤0.549），確定鍵用既有的 btn_confirm（1.000）。
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 點擊空白處關閉的頁面 → 點掉
    # 遊戲有好幾張「返回鍵無效、只能點空白處」的結算頁（挑戰賽戰鬥結束、
    # 公會討伐結算…）。它們共用底部那行「點擊空白處關閉」，用它一併接住，
    # 不必為每一張各裁一個模板。
    #
    # ⚠ 排在兜底前面。少了這條會一路掉到「完全無法辨識」去空按返回鍵——而返回鍵
    #   對這類頁面沒有作用，還可能叫出別的確認框。
    template: label_tap_blank_close
    cooldown: 3
    do:
      - tap: [360, 640]
      - wait: 2

  - name: 誤入次要頁面 → 點返回退出
    template: btn_back_arrow
    sustain: 6
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 卡在未知畫面 → 回家園重來
    template: nav_home
    sustain: 8
    cooldown: 30
    do:
      - screenshot:
      - tap_match: []
      - wait: 3

  - name: 完全無法辨識 → 按系統返回鍵
    # 連導覽列和返回鍵都找不到（全螢幕公告、載入中的黑畫面）。
    # ⚠ 開機畫面的三個模板也要列進來，理由見 dungeon.yaml 的同名規則：
    #   sustain 是累加的，攔截規則不會讓兜底的計時歸零。
    absent: [nav_home, btn_back_arrow, nav_guild,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 5          # 按這麼多次還脫不了困，就交給下一條重開遊戲
    cooldown: 30
    do:
      - screenshot:
      - back:
      - wait: 2

  - name: 一直脫不了困 → 重開遊戲
    # 兜底按了 5 次系統返回鍵還是認不出畫面。返回鍵解決不了兩種狀況：**對它無效
    # 的結算頁**（只能點空白處），以及**按下去反而會叫出確認框**的頁面——後者會
    # 變成開開關關的死循環。重開遊戲讓畫面回到「開機 → 家園」這條認得的路。
    #
    # ⚠ absent 要和上面那條**完全一樣**。少列任何一個，這條就會在那個畫面上誤
    #   觸發，而重開遊戲要 152 秒。
    # ⚠ 上面那條一定要有 max_fires，否則它每輪都成立、永遠輪不到這裡。
    absent: [nav_home, btn_back_arrow, nav_guild,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    max_fires: 3      # 重開這麼多次還是認不出來，就別再重開了（見下一條）
    do:
      - restart_app: 45

  - name: 重開遊戲也救不回來 → 收工
    # 最後的保險絲。重開三次還是認不出畫面，代表遇到的東西不是「重開就會好」的
    # ——再重開下去只會每半分鐘關開遊戲一次，直到有人來看。
    #
    # ⚠ 這條非有不可。實測 2026-08-25：領獎確認框的文字被遊戲改掉，模板比不中而
    #   落到兜底，接著**每 30 秒重開一次遊戲，從 08:03 跑到 12:17**，
    #   足足 4 小時 14 分，而且是使用者自己按停止才停的——
    #   而重開那條當時沒有 max_fires，所以永遠輪不到任何人喊停。
    #
    # ⚠ 收工比空轉好：這一輪讓出去，排程會照常跑下一個腳本，下一個排定時刻也會
    #   重新開始。截圖留著當補模板的來源。
    absent: [nav_home, btn_back_arrow, nav_guild,
             label_boot_logo, label_boot_network, label_title_menu]
    threshold: 0.78
    sustain: 45
    do:
      - log: 重開遊戲三次仍然認不出畫面，這一輪先收工
      - screenshot: stuck_after_restart
      - finish:

