# 虛空裂縫
#
# 隔週週日開放的限時活動（與混沌侵襲輪替），每期可打 10 場。隊伍由使用者自己組好、
# 停在活動地圖上，腳本從那裡開始：找門 → 進入 → 打完 → 領獎 → 再找門，次數用完就
# 離開地圖回家園。不排程，由介面上的「虛空裂縫」按鈕手動觸發，排程等待中也可以按
# （Runner.inject）。
#
# 流程：活動地圖上有紫色的門 → 點門 → 對話框按「進入裂縫」→ 載入 → 戰鬥
#      → 可能跳「進入下一層」（點掉，不點 30 秒後也會自動進入）→ 再戰鬥 ⋯
#      → 「獲得獎勵」→ 回到地圖
#      → 右側小工具顯示 N/10：不是 0 就再找門；附近找不到門就用小工具傳回傳送點
#      → 0/10 → 按左下角返回 → 「離開地圖後將自動解散隊伍」按確定 → 家園
#
# 畫面性質：
# 1. 剩餘場次顯示在右側小工具（「虛空裂縫 N/10」），0 是紅色、其他數字是黃色。只比對
#    紅色的 0（1.000／0.960，其他數字 ≤0.60）。對話框裡的「收益次數: N/10」只寫紀錄。
# 2. 門是會動的紫色漩渦，模板只有 0.72～0.85、與對話框裡的大圖差不到 0.06；核心顏色
#    穩定（H≈129、S≈190），所以用 blob 找色塊：門 3400～6750 像素，沒有門的地圖 ≤12。
# 3. 拖曳地圖時鏡頭照拖曳距離移動、沒有慣性（400px 就是 400px），點遠處的門對話框會
#    立刻開啟、角色自己走過去。找門是「拖曳 → 看有沒有紫色色塊 → 再拖曳」的螺旋：
#    右、上、左、左、下、下、右、右，涵蓋起點周圍 3x3 個畫面。整圈都沒有就點小工具 →
#    活動頁「立即前往」→ 確定，傳回傳送點再繞一圈。
#
# 共通約束與共用規則的說明見 dungeon.yaml 檔頭。

name: 虛空裂縫
package: com.m88.idleXX

# ⚠ 在地圖上等門出現時畫面幾乎靜止，而脫困機制會按系統返回鍵，地圖上的返回鍵會叫出
#   解散隊伍的確認框。門檻要大於等門的時間。
stuck_timeout: 900

# 一場約 2～4 分鐘（可能連續好幾層），10 場最多約 40 分鐘。
max_minutes: 60

# 結束程序不做任何動作：0/10 那條已經解散隊伍回到家園；其他結束情況（中斷鈕、
# max_minutes）都是使用者在旁邊，畫面停在哪裡看得到。
# ⚠ 不逐層退回：離開地圖會解散使用者自己組的隊伍。
on_finish:
  - log: 本輪結束

rules:
  # ==================== 確認框 ====================

  - name: 解散隊伍確認框 → 確定離開
    # 「離開地圖後將自動解散隊伍，確定要離開嗎?」：只有次數用完、自己按返回之後才按確定。
    # 旗標由「次數用完」那條設定。
    template: label_leave_team_confirm
    when_flag: [打完了]
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 解散隊伍確認框 → 還沒打完，取消
    # 不是因為次數用完而出現時（後備規則按了返回鍵）按取消，留在地圖上。
    template: label_leave_team_confirm
    cooldown: 3
    do:
      - tap_template: btn_cancel
      - wait: 2

  - name: 角色重傷確認框 → 用料理治療，繼續打
    # 隊伍被打倒後的「角色重傷無法行動，要使用料理治療嗎?」。開啟 rift_heal_with_food
    # 才使用料理；治療三次後仍被打倒就交給下一條。
    template: label_heal_confirm
    when_option: rift_heal_with_food=true
    max_fires: 3
    cooldown: 3
    do:
      - log: 隊伍被打倒，使用料理治療後繼續
      - tap_template: btn_heal_all
      - wait: 3

  - name: 角色重傷確認框 → 不使用料理，結束本輪
    # 未開啟料理治療（或已治療三次）：停在這個對話框，由使用者決定。
    template: label_heal_confirm
    do:
      - log: 隊伍被打倒，角色重傷。未開啟「用料理治療」，結束本輪；請處理後再按一次
      - finish: skip_cleanup

  - name: 前往地圖確認框 → 確定
    # 活動頁按「立即前往」後的「要立即前往地圖，參加活動嗎?」。
    template: label_goto_map_confirm
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 5

  # ==================== 裂縫內 ====================
  # 越上層的畫面越優先：獎勵頁與下一層對話框蓋在戰鬥上、戰鬥蓋在地圖上。

  - name: 進入下一層對話框 → 進入下一層
    # 打贏一層後不一定出現；30 秒後會自動進入，點掉節省時間。
    template: btn_next_floor
    cooldown: 3
    do:
      - tap_match: []
      - wait: 3

  - name: 獲得獎勵 → 關掉，完成一場
    # 一場的結算，點深色面板（不要點到底下的地圖）就回到地圖。
    # ⚠ count 放在這裡：這一頁每場恰好出現一次。
    template: label_reward_gain
    cooldown: 5
    do:
      - count:
      - tap: [360, 700]
      - wait: 2.5

  - name: 裂縫對話框 → 進入裂縫
    # 點門之後的對話框（掉落、收益次數、「組隊」與「進入裂縫」）。
    # 剩餘場次只寫紀錄，判斷靠地圖上的紅色 0。
    template: btn_enter_rift
    cooldown: 3
    do:
      - log_text:
          剩餘場次: {region: [500, 806, 170, 30], scale: 4, strip: ["收益次數:", "收益次數："]}
      - tap_match: []
      - wait: 3

  - name: 裂縫戰鬥準備 → 開始戰鬥
    # 單人進入時先停在準備畫面（回合 0/30、「開始戰鬥」）；組隊時直接開打。
    # 與公會討伐、競技場共用模板（1.000）。
    template: btn_start_battle
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 戰鬥中 → 等
    # 回合條「回合：N/30」：戰鬥畫面 0.975～1.000、地圖 ≤0.64。
    template: label_round
    do: []

  # ==================== 活動地圖 ====================

  - name: 次數用完（紅色 0/10）→ 離開地圖回家園
    # 紅色 0 在 0/10 時 1.000／0.960，其他次數 ≤0.60；region 框住小工具的數字那一行。
    # 按返回會跳出解散隊伍確認框，旗標讓第一條按確定。
    # ⚠ 不能有 sustain：這條與「點門」在同一張畫面上同時成立，sustain 累積期間點門會
    #   先成立，多打一場沒有收益的。
    template: label_rift_zero
    region: [600, 400, 110, 40]
    # 「在活動地圖上」＝小工具與右下角「探索10次」兩個都在。家園右側也有同一個小工具
    # （0.887），活動結束後的世界地圖有探索鈕而沒有小工具。小工具只裁中央的水晶
    # （兩張地圖 1.000／0.961），裁到背景的話換地圖就只剩 0.6。
    require: &on_map [label_rift_widget, btn_explore_ten]
    do:
      - log: 10 場都已打完，離開地圖
      - set_flag: 打完了
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 地圖上有門 → 點門
    # 門的核心是 H≈129、S≈190 的飽和紫色。region 避開頂部 HUD（紫色天空與水晶）與底部
    # 聊天列，exclude 挖掉小工具本身的紫色圖示。其他玩家的紫色裝扮與傳送點拱門最多 9 像素。
    # 門只露出一角在畫面底部時面積只有一百多像素，被 min_area 排除（點下去會點到按鈕）。
    # 找到門就把螺旋歸零。
    require: *on_map
    blob:
      hue: [120, 140]
      sat: [150, 255]
      val: [60, 210]
      region: [0, 110, 720, 900]
      exclude: [[590, 320, 130, 130]]
      min_area: 1500
    cooldown: 4
    do:
      - reset_fires: [找門 → 鏡頭往右, 找門 → 鏡頭往上, 找門 → 鏡頭往左,
                      找門 → 鏡頭再往左, 找門 → 鏡頭往下, 找門 → 鏡頭再往下,
                      找門 → 鏡頭往右回頭, 找門 → 鏡頭再往右]
      - tap_match: []
      - wait: 2.5

  # ---- 沒有門：拖曳鏡頭繞一圈 ----
  # 八條規則條件相同（在地圖上、畫面裡沒有門），靠 max_fires: 1 依序執行，走出「右、
  # 上、左、左、下、下、右、右」的螺旋。每拖一步就重新判斷，看到門由上一條接手。
  #
  # ⚠ sustain 要全部相同：八條條件相同，計時同步累積，第一條等得比較久的話後面幾條會
  #   先滿而搶先拖曳。第一步等 12 秒（門常在打完後一兩秒內原地出現），之後每一步緊接著。
  # ⚠ 拖曳起點與終點要避開 UI：右側小工具（600～710, 340～440）、底部按鈕與任務橫幅
  #   （y ≥ 950）。水平拖曳在 y=600，垂直拖曳在 x=360。
  # ⚠ blob 參數要和「點門」那條完全一樣，否則「有門」與「沒門」會同時成立或都不成立。

  - name: 找門 → 鏡頭往右
    require: *on_map
    blob: &no_door
      hue: [120, 140]
      sat: [150, 255]
      val: [60, 210]
      region: [0, 110, 720, 900]
      exclude: [[590, 320, 130, 130]]
      min_area: 1500
      absent: true
    sustain: 12
    max_fires: 1
    do:
      - swipe: [610, 600, 110, 600, 600]
      - wait: 2

  - name: 找門 → 鏡頭往上
    require: *on_map
    blob: *no_door
    sustain: 12
    max_fires: 1
    do:
      - swipe: [360, 300, 360, 800, 600]
      - wait: 2

  - name: 找門 → 鏡頭往左
    require: *on_map
    blob: *no_door
    sustain: 12
    max_fires: 1
    do:
      - swipe: [110, 600, 610, 600, 600]
      - wait: 2

  - name: 找門 → 鏡頭再往左
    require: *on_map
    blob: *no_door
    sustain: 12
    max_fires: 1
    do:
      - swipe: [110, 600, 610, 600, 600]
      - wait: 2

  - name: 找門 → 鏡頭往下
    require: *on_map
    blob: *no_door
    sustain: 12
    max_fires: 1
    do:
      - swipe: [360, 800, 360, 300, 600]
      - wait: 2

  - name: 找門 → 鏡頭再往下
    require: *on_map
    blob: *no_door
    sustain: 12
    max_fires: 1
    do:
      - swipe: [360, 800, 360, 300, 600]
      - wait: 2

  - name: 找門 → 鏡頭往右回頭
    require: *on_map
    blob: *no_door
    sustain: 12
    max_fires: 1
    do:
      - swipe: [610, 600, 110, 600, 600]
      - wait: 2

  - name: 找門 → 鏡頭再往右
    require: *on_map
    blob: *no_door
    sustain: 12
    max_fires: 1
    do:
      - swipe: [610, 600, 110, 600, 600]
      - wait: 2

  - name: 繞了一圈都沒有門 → 用小工具傳回傳送點
    # 八步拖完仍沒看到門：點小工具 → 活動頁「立即前往」→ 確定，傳回傳送點、鏡頭回到
    # 角色身上，螺旋歸零再繞一圈。
    require: *on_map
    blob: *no_door
    sustain: 12
    cooldown: 20
    do:
      - log: 附近沒有門，從活動頁傳回傳送點再找
      - reset_fires: [找門 → 鏡頭往右, 找門 → 鏡頭往上, 找門 → 鏡頭往左,
                      找門 → 鏡頭再往左, 找門 → 鏡頭往下, 找門 → 鏡頭再往下,
                      找門 → 鏡頭往右回頭, 找門 → 鏡頭再往右]
      - tap: [655, 375]
      - wait: 3

  - name: 活動頁 → 立即前往
    # 小工具開啟的活動頁（大門圖、「獎勵次數: N/10」、「立即前往」）。
    template: btn_go_now
    require: [label_rift_event_page]
    cooldown: 3
    do:
      - tap_match: []
      - wait: 2

  - name: 家園 → 場次已打完，結束本輪
    # 解散隊伍後遊戲自動回到家園，結束程序不必再退。
    template: nav_home
    when_flag: [打完了]
    sustain: 2
    do:
      - finish: skip_cleanup

  - name: 家園 → 尚未進入活動地圖，結束本輪
    # 腳本要從活動地圖開始（隊伍由使用者組），停在家園代表還沒進入。
    template: nav_home
    when_flag: ["!打完了"]
    sustain: 5
    do:
      - log: 目前在家園而不是活動地圖。請先組好隊伍、進入虛空裂縫的地圖後再按一次
      - finish: skip_cleanup

  # ==================== 換頁 ====================

  - name: 載入中 → 等畫面切換
    # 用載入畫面的底紋：「載入中……」那行字會上下跳動、常有一半在畫面外，三張舊模板
    # 仍漏掉三分之一的畫面。底紋靜止：30 張載入畫面全部 1.000、其餘 ≤0.69。
    # 「隊伍已解散」的黑畫面底紋相同。
    template: label_loading_bg
    region: [0, 300, 720, 600]
    do: []

  # ==================== 遊戲冷啟動（共用規則，說明見 dungeon.yaml） ====================

  - name: 伺服器維護中 → 結束本輪，下一輪再試
    template: label_server_maintenance
    do:
      - finish: skip_cleanup

  - name: 遊戲要求重新進入 → 重新啟動遊戲
    template: [label_restart_to_update, label_world_changed]
    max_fires: 2
    do:
      - tap_template: btn_confirm
      - wait: 2
      - restart_app:

  - name: 重新啟動後仍要求重新進入 → 結束本輪，下一輪再試
    template: [label_restart_to_update, label_world_changed]
    do:
      - finish: skip_cleanup

  - name: 帳號在其他用戶端登入 → 按確定回到登入畫面
    template: label_login_conflict
    cooldown: 5
    do:
      - tap_template: btn_confirm
      - wait: 3

  - name: 公告 → 勾選今日不再提醒後關閉
    template: label_notice_dont_remind
    cooldown: 5
    do:
      - tap_match: [-73, -1]
      - wait: 0.8
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 標題畫面 → 點擊開始遊戲
    template: [label_title_menu, label_tap_to_start]
    sustain: 3
    cooldown: 5
    do:
      - tap: [360, 900]
      - wait: 3

  - name: 遊戲啟動中 → 等開場動畫
    template: label_boot_logo
    do: []

  - name: 遊戲啟動中 → 等載入完成
    template: label_boot_network
    do: []

  # ==================== 後備規則（共用規則，說明見 dungeon.yaml） ====================

  - name: 觀戰確認框 → 確定退出
    template: label_leave_spectate
    cooldown: 3
    do:
      - tap_template: btn_confirm
      - wait: 2

  - name: 點空白處無法關閉的頁面 → 重新啟動遊戲
    template: label_tap_blank_close
    sustain: 90
    max_fires: 1
    do:
      - screenshot: blank_page_stuck
      - restart_app: 45

  - name: 重新啟動後仍無法關閉 → 結束本輪
    template: label_tap_blank_close
    sustain: 90
    do:
      - log: 點空白處無法關閉這張頁面，重新啟動遊戲後仍然存在，結束本輪
      - screenshot: blank_page_stuck_after_restart
      - finish: skip_cleanup

  - name: 誤入次要頁面 → 點返回退出
    # ⚠ 活動地圖與活動頁都有返回鍵（0.991／1.000），一定要列進 absent，否則等門期間
    #   會退出地圖並叫出解散隊伍確認框。
    require: [btn_back_arrow]
    absent: [label_rift_widget, label_rift_event_page, btn_go_now, label_round,
             label_reward_gain, btn_start_battle]
    sustain: 4
    cooldown: 3
    do:
      - tap_template: btn_back_arrow
      - wait: 2

  - name: 完全無法辨識 → 按系統返回鍵
    # ⚠ absent 要列出這份腳本的每一種畫面：地圖、對話框、戰鬥、獎勵頁、活動頁、各個
    #   確認框，少列的畫面上計時會一直累積。
    absent: [nav_home, btn_back_arrow, label_rift_widget, label_round,
             label_loading_bg, btn_enter_rift, btn_next_floor, label_reward_gain,
             label_rift_event_page, btn_go_now, label_leave_team_confirm,
             label_goto_map_confirm, label_heal_confirm,
             label_title_menu, label_tap_to_start, label_boot_logo,
             label_boot_network, label_loading, label_loading_b,
             label_loading_c, label_notice_dont_remind]
    sustain: 45
    max_fires: 5
    do:
      - screenshot: rift_unknown
      - back:
      - wait: 3

  - name: 持續無法脫困 → 重新啟動遊戲
    # ⚠ absent 要和上一條完全一樣。
    absent: [nav_home, btn_back_arrow, label_rift_widget, label_round,
             label_loading_bg, btn_enter_rift, btn_next_floor, label_reward_gain,
             label_rift_event_page, btn_go_now, label_leave_team_confirm,
             label_goto_map_confirm, label_heal_confirm,
             label_title_menu, label_tap_to_start, label_boot_logo,
             label_boot_network, label_loading, label_loading_b,
             label_loading_c, label_notice_dont_remind]
    sustain: 45
    max_fires: 3
    do:
      - restart_app: 45

  - name: 重新啟動遊戲也無法恢復 → 結束本輪
    absent: [nav_home, btn_back_arrow, label_rift_widget, label_round,
             label_loading_bg, btn_enter_rift, btn_next_floor, label_reward_gain,
             label_rift_event_page, btn_go_now, label_leave_team_confirm,
             label_goto_map_confirm, label_heal_confirm,
             label_title_menu, label_tap_to_start, label_boot_logo,
             label_boot_network, label_loading, label_loading_b,
             label_loading_c, label_notice_dont_remind]
    sustain: 45
    do:
      - log: 重新啟動遊戲三次仍無法辨識畫面，結束本輪
      - screenshot: stuck_after_restart
      - finish:
